name: NOVA Fast Drag Stress Audit
on:
  push:
    branches:
      - nova/full-audit-20261014
    paths:
      - bank-v3-neon-chalk/qa/fast_drag_audit.py
      - .github/workflows/nova-fast-drag-audit.yml
permissions:
  contents: write
jobs:
  drag:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser tools
        run: |
          python -m pip install --quiet playwright==1.55.0
          if command -v google-chrome; then echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"; else python -m playwright install chromium; fi
      - name: Fast movement and pointer capture checks
        run: python -u bank-v3-neon-chalk/qa/fast_drag_audit.py
      - name: Record drag stress results without modifying production
        if: always()
        run: |
          git config user.name "NOVA Audit Bot"
          git config user.email "nova-audit-bot@users.noreply.github.com"
          git add bank-v3-neon-chalk/qa/drag-audit-2026-10-14/*.json
          if ! git diff --cached --quiet; then
            git commit -m "audit: save high-speed mouse drag findings"
            git push origin HEAD:nova/full-audit-20261014
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-fast-drag-results
          path: bank-v3-neon-chalk/qa/drag-audit-2026-10-14/
          if-no-files-found: warn
