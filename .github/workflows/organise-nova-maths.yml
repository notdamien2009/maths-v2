name: NOVA F0–F18 one-time archive organisation
on:
  push:
    branches: [nova/f0-f18-organise-20261014]
    paths: [.github/workflows/organise-nova-maths.yml]
permissions:
  contents: write
jobs:
  organise:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Extract and classify F11–F18 archive content
        run: python3 .github/scripts/organise_nova_math.py
      - name: Commit organised production files for review
        run: |
          git config user.name "NOVA Maths archive organiser"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No repository changes"
          else
            git commit -m "Organise F0-F18 production files and remove obsolete run notes"
            git push origin HEAD:nova/f0-f18-organise-20261014
          fi
