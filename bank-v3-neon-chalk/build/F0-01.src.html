<style>
@@CSS@@
/* ---- F0-01 local styles (all values come from tokens) ---- */
.tk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px 12px 14px;margin:0;list-style:none}
@media(min-width:640px){.tk-grid{grid-template-columns:repeat(4,1fr)}}
.tk-sw{border:1px solid var(--v-line);border-radius:12px;padding:8px;background:var(--v-panel);color:var(--v-ink);font-size:.72rem;display:grid;gap:4px;transition:transform .25s var(--ease),box-shadow .25s}
.tk-sw .chip{height:30px;border-radius:8px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12)}
.tk-sw b{font-size:.78rem}.tk-sw code{font-family:var(--nova-font-mono);color:var(--v-muted);font-size:.68rem}
.tk-sw.on{transform:translateY(-2px);box-shadow:0 0 0 2px var(--m-focus)}
.tk-fonts{padding:12px 14px;display:grid;gap:10px;color:var(--v-ink)}
.tk-fonts .ui{font:800 1.25rem var(--nova-font-ui)}.tk-fonts .mx{font:1.5rem var(--nova-font-maths)}.tk-fonts .mo{font:.9rem var(--nova-font-mono);color:var(--v-muted)}
.tk-fonts small{display:block;color:var(--v-muted);font:600 .7rem var(--nova-font-ui);letter-spacing:.08em;text-transform:uppercase}
.tk-eq{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:14px 10px 6px;font:1.6rem var(--nova-font-maths)}
.tk-tok{position:relative;min-width:40px;padding:4px 8px 10px;border-radius:10px;text-align:center;color:var(--v-ink);background:var(--v-panel);border:2px solid var(--v-line);cursor:pointer}
.tk-tok svg{position:absolute;right:-6px;top:-8px;width:16px;height:16px}
.tk-tok[data-role]{border-color:var(--rc)}
.tk-tok[data-role="unknown"]{border-style:dashed}
.tk-tok[data-role="result"]{box-shadow:inset 0 -6px 0 -3px var(--rc)}
.tk-tok[data-role="error"]{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--rc) 25%,transparent) 0 4px,transparent 4px 8px),var(--v-panel)}
.tk-tok[data-role="focus"]{box-shadow:0 0 0 4px color-mix(in srgb,var(--rc) 35%,transparent)}
.tk-tok[data-role="support"]{background:color-mix(in srgb,var(--rc) 18%,var(--v-panel))}
.tk-tok:focus-visible{outline:3px solid var(--nova-focus,#ffcc58);outline-offset:2px}
.tk-legend{display:flex;flex-wrap:wrap;gap:6px;padding:4px 12px 12px;justify-content:center}
.tk-legend span{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;color:var(--v-muted);font-weight:700}
.tk-legend svg{width:14px;height:14px}
.tk-cvd{filter:var(--tk-filter,none)}
.tk-help{display:flex;justify-content:center;padding:0 0 6px}
.tk-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.tk-roles button{display:inline-flex;gap:4px;align-items:center}
.tk-roles button svg{width:14px;height:14px}
.tk-ratio{font:800 .85rem var(--nova-font-ui);color:var(--v-ink)}
.tk-ratio .pass{color:var(--math-green)}.tk-ratio .fail{color:var(--math-red)}
.tk-anchor{font-size:.75rem;color:var(--v-muted)}
.nova-spec dd{white-space:pre-line}
@media print{.nova-tl,.nova-tabs,.nova-helperbar,.nova-panel{display:none!important}}

/* house v3 polish — Improve: typography, written maths, tables */
.tk-fonts .mx{letter-spacing:.01em}
.tk-eq{gap:10px;padding:18px 12px 10px}
.tk-tok{min-width:44px;padding:6px 10px 12px}


/* v3.1 audit: chalk writing + neon tile glow (matches F0-02); Challenge fills the stage */
html[data-house="neon-chalk"] .tk-eq{font-family:"Segoe Print","Comic Sans MS","Bradley Hand",cursive;font-weight:800}
html[data-house="neon-chalk"] .tk-tok{color:#eef9ff;text-shadow:0 0 1px #fff,0 0 8px color-mix(in srgb,var(--rc,#67b8e5) 70%,transparent);background:linear-gradient(180deg,#0f1d3d,#060d20);border-color:var(--rc,#316bb6);box-shadow:0 0 0 2px #040818,0 0 14px color-mix(in srgb,var(--rc,#4f8cff) 45%,transparent),inset 0 1px #e2f9ff40}
html[data-house="neon-chalk"] .tk-tok[data-role]{color:var(--rc)}
html[data-house="neon-chalk"] .tk-tok .tk-ch{display:inline-block;filter:url(#nv-chalk)}
.tk-chal .tk-eq{margin-top:auto;font-size:3rem;gap:16px;padding:28px 12px 18px}
.tk-chal .tk-tok{min-width:86px;padding:10px 18px 16px;border-radius:18px}
.tk-chal .tk-tok svg{width:24px;height:24px;right:-9px;top:-11px}
.tk-chal .tk-legend{margin-bottom:auto!important;gap:10px;max-width:820px;margin:0 auto;padding:6px 14px 14px}
.tk-chal .tk-legend span{font-size:.95rem;color:#eef9ff;padding:8px 14px;border-radius:999px;border:1px solid #316bb6;background:linear-gradient(180deg,#0f1d3d,#060d20);box-shadow:0 0 10px #4f8cff33}
.tk-chal .tk-legend svg{width:20px;height:20px}
@media (max-width:480px){.tk-chal .tk-eq{font-size:1.9rem;gap:8px;padding:18px 6px 12px}.tk-chal .tk-tok{min-width:50px;padding:6px 10px 10px}.tk-chal .tk-legend span{font-size:.75rem;padding:5px 9px}.tk-chal .tk-legend svg{width:14px;height:14px}}
</style>

(function(){

/* shape glyphs: the second (non-colour) cue for every role */
function glyph(role,size){var c=T.maths[role].hex,s=size||16,P={
  square:'<rect x="3" y="3" width="10" height="10" fill="'+c+'"/>',
  circle:'<circle cx="8" cy="8" r="5" fill="none" stroke="'+c+'" stroke-width="2" stroke-dasharray="3 2"/>',

var steps=[
 {name:'Surfaces',mood:'neutral',narration:'Every NOVA screen starts from the same dark navy surfaces. These are tokens: named values, set in one place.',prompt:'Find the canvas colour. Why is the maths drawn on a darker panel than the page?'},
 {name:'Fonts',mood:'focus',narration:'Inter is for words and buttons. Cambria Math is for maths, so x, fractions and powers always look like maths.',prompt:'Which font would you use for 3x + 5? Which for a button label?'},
 {name:'Colour language',mood:'focus',narration:'Seven maths roles, seven colours. Blue is given, gold is unknown, cyan is an operation, green is the result.',prompt:'Say the role for each colour before you read its label.'},
 {name:'Shapes too',mood:'think',narration:'Colour is never the only clue. Each role also has a shape: square, dashed circle, diamond, tick, cross, star, triangle.',prompt:'Cover the colours. Can you still tell the roles apart by shape?'},
 {name:'Read an equation',mood:'focus',narration:'Here is 3x + 5 = 20. Given numbers are blue squares, x is the gold unknown, and the signs are cyan operations.',prompt:'Which part is the unknown? How do you know without the colour?'},
 {name:'Colour-blind check',mood:'think',narration:'This is the same equation for someone who sees no colour. The shapes and outlines still carry the meaning.',prompt:'Is anything now impossible to tell apart? That would be a design bug.'},
 {name:'Solved',mood:'cheer',narration:'When we solve it, the answer turns green with a tick: x = 5. Same language, in every lesson.',prompt:'Which role changed when the equation was solved?'}
];
function render(i,stage){stage.innerHTML='';var s=steps[i];C.vision=C._userVision||'none';
  if(i===0){cap(stage,'Brand surfaces','tokens');swatches(stage,brandList(),'--v-bg');}
  else if(i===1){cap(stage,'Type tokens','fonts');stage.appendChild(h('div',{class:'tk-fonts'},[h('div',{},[h('small',{text:'UI · --nova-font-ui · Inter'}),h('div',{class:'ui',text:'Check answer'})]),h('div',{},[h('small',{text:'Maths · --nova-font-maths · Cambria Math'}),h('div',{class:'mx',text:'3x + 5 = 20   ¾   2³   √12'})]),h('div',{},[h('small',{text:'Code · --nova-font-mono'}),h('div',{class:'mo',text:'var(--m-unknown)  #ffcc58'})])]));}
  else if(i===2){cap(stage,'Maths colour language','7 roles');swatches(stage,roleList());}
  else if(i===3){cap(stage,'Second cue: shape','colour-blind safe');var l=h('div',{class:'tk-legend',style:'padding:16px 10px'});ROLES.forEach(function(r){var s2=h('span',{style:'font-size:.85rem'});s2.innerHTML=glyph(r,26)+'<span>'+T.maths[r].shape+'</span>';l.appendChild(s2);});stage.appendChild(l);}
  else if(i===4){cap(stage,'Equation by role','linear');eq(stage,C.presets.linear.expression);legend(stage,['given','unknown','op']);}

  else {cap(stage,'Solved','result');eq(stage,C.presets.solved.expression);legend(stage,['unknown','op','result']);}
  vision(stage);
  var pose={neutral:'idle',focus:'point',think:'think',cheer:'cheer'}[s.mood]||'idle';helper(stage,pose,s.name);
}
var eng;
function btnRow(api,check,hint){var r=h('div',{class:'tk-row'});r.appendChild(h('button',{class:'nova-btn primary',text:'Check',onclick:check}));r.appendChild(h('button',{class:'nova-btn ghost',text:'Hint',onclick:function(){api.hint(hint);}}));return r;}
var def={id:'F0-01',title:'Design tokens',config:C,steps:steps,render:render,
 alt:'Design tokens: NOVA surfaces, fonts and seven maths role colours, each with its own shape.',
 staticAlt:'Seven maths roles: given = blue square, unknown = gold dashed circle, operation = cyan diamond, result = green tick, error = red cross with hatch, focus = orange star, support = purple triangle. Fonts: Inter for UI, Cambria Math for maths. Example: 3x + 5 = 20 with 3, 5, 20 given, x unknown, + and = operations; solved x = 5 shown as a green result.',
 exploreIntro:'Explore: pick a role, switch theme or colour-blind preview, and check the contrast.',
 explore:function(panel,stage,api){
   function draw(){stage.innerHTML='';var r=C.focusRole,m=T.maths[r],cr=contrast(m.hex,canvasHex());cap(stage,'Role: '+r,C.vision==='none'?C.theme:C.vision);
     swatches(stage,roleList(),r);eq(stage,C.expression);vision(stage);
     ratio.innerHTML='';ratio.appendChild(document.createTextNode(m.label+' '+m.hex+' on canvas: '+cr.toFixed(2)+':1 '));ratio.appendChild(h('span',{class:cr>=C.minContrast?'pass':'fail',text:cr>=C.minContrast?'✔ passes AA':'✖ below AA, use shape + label'}));
     NOVA.events.emit('value',{engine:'F0-01',role:r,hex:m.hex,cssVar:m.cssVar,contrast:+cr.toFixed(2),theme:C.theme,vision:C.vision});}
   var roles=h('div',{class:'tk-row tk-roles',role:'group','aria-label':'Choose a maths role'});

   var vis=h('select',{class:'nova-input','aria-label':'Colour-blind preview'});[['none','Normal vision'],['protan','Protanopia'],['deutan','Deuteranopia'],['tritan','Tritanopia'],['grey','Greyscale']].forEach(function(o){vis.appendChild(h('option',{value:o[0],text:o[1]}));});vis.value=C.vision;vis.onchange=function(){C.vision=C._userVision=vis.value;draw();};

     var view=ex.map(function(t,i){return [t[0],tags[i]];});var row=eq(stage,view,{blank:false,onTok:function(i){var cur=tags[i],n=cur?ROLES.indexOf(cur)+1:0;tags[i]=n>=ROLES.length?null:ROLES[n];NOVA.events.emit('value',{engine:'F0-01',token:ex[i][0],role:tags[i]});draw();stage.querySelector('[data-i="'+i+'"]').focus();}});

   panel.appendChild(h('p',{text:'Tap (or press Enter on) each part to cycle its role until the colour AND shape are right. Then press Check.'}));

       api.check(ok,msg,{preset:keys[k],wrong:wrong.length});if(ok&&k<keys.length-1){var tm=setTimeout(function(){k++;load();},900);api.onCleanup(function(){clearTimeout(tm);});}},
     'Numbers you are told are given (blue square). Letters you need to find are unknown (gold dashed circle). Signs are operations (cyan diamond).'));
   load();}
};
var card=h('section',{class:'nova-card nova-engine',id:'F0-01','aria-labelledby':'F0-01-h'},[h('h2',{id:'F0-01-h',class:'nova-eh'},[h('span',{class:'nova-id',text:'01'}),h('span',{text:'Design tokens (NOVA colours, fonts, maths colour language)'})])]);
var spec={purpose:'One shared source of truth for NOVA colours, fonts and the maths colour language, so every engine shows given, unknown, operation, result, error, focus and support the same way. Pupils learn to read the roles, so the colours carry meaning from lesson to lesson.',
