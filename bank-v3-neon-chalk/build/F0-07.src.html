/* ---- F0-07 local styles ---- */
.pr-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.pr-task{font-weight:700}
.ev-wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px;padding:8px 12px}
@media (max-width:480px){.ev-wrap{grid-template-columns:1fr}}
.ev-box h4{margin:0 0 4px;font:800 .68rem var(--nova-font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--v-muted)}
.ev-bar{display:block;width:100%;height:auto}
.ev-frac .mt{font-size:1.7em}
.ev-frac{text-align:center;font-size:1.5rem;min-height:2.6em;display:flex;align-items:center;justify-content:center}
/* fixed 6-slot event stream + fixed-height state readout: events never change the layout */
.ev-list{display:grid;grid-template-rows:repeat(6,26px);gap:4px;margin:0;padding:0;list-style:none}
.ev-list li{display:flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:8px;border:1px solid var(--v-line);background:var(--v-panel2);font:700 .72rem var(--nova-font-mono,monospace);color:var(--v-ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ev-list li.empty{opacity:.3}
.ev-list li b{font:800 .66rem var(--nova-font-ui);padding:1px 6px;border-radius:999px;color:#06111b;flex:none}
.ev-list li[data-t="value"] b{background:var(--m-op)}.ev-list li[data-t="value"] b::before{content:'\25C6 '}
.ev-list li[data-t="step"] b{background:var(--m-support)}.ev-list li[data-t="step"] b::before{content:'\25B2 '}
.ev-list li[data-t="correct"] b{background:var(--m-result)}.ev-list li[data-t="correct"] b::before{content:'\2713 '}
.ev-list li[data-t="correct"].no b{background:var(--m-error)}.ev-list li[data-t="correct"].no b::before{content:'\2716 '}
.ev-list li[data-t="hintUsed"] b{background:var(--m-unknown)}.ev-list li[data-t="hintUsed"] b::before{content:'\25CC '}
.ev-list li[data-t="mode"] b{background:var(--v-muted)}
.ev-state{height:64px;margin:6px 0 0;padding:6px 8px;border-radius:8px;border:1px dashed var(--v-line);font:600 .7rem/1.35 var(--nova-font-mono,monospace);color:var(--v-muted);overflow:hidden;white-space:pre-wrap;word-break:break-all}
.ev-sum{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ev-sum span{font:800 .7rem var(--nova-font-ui);padding:2px 8px;border-radius:999px;border:1px solid var(--v-line);color:var(--v-ink)}
.ev-parts{display:flex;flex-wrap:wrap;gap:4px}
.ev-parts button{min-width:38px}
.ev-parts button[aria-pressed="true"]{background:var(--m-focus);color:#06111b}
.rs-opts{display:flex;flex-wrap:wrap;gap:6px}
.rs-opts button[aria-pressed="true"]{outline:3px solid var(--m-focus)}
.nova-spec dd{white-space:pre-line}
@media print{.nova-tl,.nova-tabs,.nova-helperbar,.nova-panel{display:none!important}}
</style>

<script>

/* demo timeline: each step shows the state and the events that action would emit (shown, not fired) */

var DEMO=[
 {k:0,ev:[]},

 {k:3,ev:[ev('correct',{correct:true,target:'3/4'}),ev('step',{index:2,name:'Check'}),ev('value',{key:'shaded',value:3,source:'click'})],target:'correct'},
 {k:2,ev:[ev('hintUsed',{count:1,hint:'Count the shaded parts'}),ev('correct',{correct:false,target:'3/4'}),ev('value',{key:'shaded',value:2,source:'click'})],target:'hintUsed'},
 {k:3,ev:[ev('value',{source:'redo',value:{shaded:3}}),ev('value',{source:'undo',value:{shaded:2}}),ev('value',{key:'shaded',value:3,source:'click'})]},

 {k:3,ev:[ev('correct',{correct:true,target:'3/4'}),ev('step',{index:2,name:'Check'}),ev('hintUsed',{count:1}),ev('value',{key:'shaded',value:3})],sum:{attempts:2,correct:1,hints:1,firstTry:false}}];
var steps=[
 {name:'State',mood:'neutral',narration:'Each engine keeps a small state: here, a bar of 4 parts with none shaded. The state is the single source of truth.',prompt:'What fraction is shaded right now?'},

function render(i,stage){stage.innerHTML='';var s=steps[i],d=DEMO[i];cap(stage,'Events · '+s.name,'step '+(i+1)+'/'+steps.length);panelBox(stage,4,d.k,d.ev,{parts:4,shaded:d.k,step:Math.min(i,2),hints:i>=4?1:0},d.sum,d.target);NOVA.scene.helperStrip(stage,i===steps.length-1?'cheer':'explain',s.name);}

var def={id:'F0-07',title:'State and events API',config:C,steps:steps,render:render,

var card=h('section',{class:'nova-card nova-engine',id:'F0-07','aria-labelledby':'F0-07-h'},[h('h2',{id:'F0-07-h',class:'nova-eh'},[h('span',{class:'nova-id',text:'07'}),h('span',{text:'State and events API (value, correct, step)'})])]);

card.appendChild(h('p',{class:'purpose',style:'margin:6px 0 0'},[h('strong',{text:'Year groups: '}),'KS3 Years 7–9 (12–15). ',h('strong',{text:'Linked components: '}),'F0-03, F0-04, F0-06, F0-08, F0-11, F0-12.']));
