<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA F0-15 · Interactive table primitive</title>
<style>
@@CSS@@
/* ---- F0-15 local styles ---- */
.pr-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.pr-task{font-weight:700}
.rs-opts{display:flex;flex-wrap:wrap;gap:6px}
.rs-opts button[aria-pressed="true"]{outline:3px solid var(--m-focus)}
.nova-spec dd{white-space:pre-line}
.xx-h4{margin:0 0 4px;font:800 .68rem var(--nova-font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--v-muted)}
@media print{.nova-tl,.nova-tabs,.nova-helperbar,.nova-panel{display:none!important}}
.tb-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:8px 12px}
@media (max-width:480px){.tb-wrap{grid-template-columns:1fr}}
.tb{border-collapse:separate;border-spacing:4px;width:100%;table-layout:fixed}
.tb th,.tb td{height:34px;text-align:center;border-radius:8px;font:800 .9rem var(--nova-font-ui);color:var(--v-ink);border:1px solid var(--v-line);background:var(--v-panel2);padding:0}
.tb th{font-size:.72rem;color:var(--v-muted);width:34px}
.tb td.blank{border:1.5px dashed var(--m-unknown);color:var(--m-unknown)}.tb td.blank::before{content:'\25CC';font-size:.75em}
.tb td.fill{border-color:var(--m-result);color:var(--m-result)}
.tb td.bad{border-color:var(--m-error);color:var(--m-error)}.tb td.bad::after{content:' \2716';font-size:.7em}
.tb td.hl,.tb th.hl{box-shadow:0 0 0 2px var(--m-focus)}
.tb input{width:100%;height:100%;box-sizing:border-box;background:transparent;border:0;text-align:center;font:800 .9rem var(--nova-font-ui);color:var(--m-unknown);border-radius:8px}
.tb input:focus{outline:2px solid var(--m-focus)}
.tb-diff{display:grid;gap:4px;margin-top:2px;height:22px;font:800 .7rem var(--nova-font-ui);color:var(--m-op);text-align:center}
.tb-note{height:36px;overflow:hidden;margin-top:6px;padding:4px 8px;border-radius:8px;border:1px dashed var(--v-line);font:600 .72rem/1.35 var(--nova-font-ui);color:var(--v-muted)}
.tb-svg{display:block;width:100%;height:auto}
</style>
</head>
<body data-topic="algebra">
<div class="nova-wrap">
<header id="nova-header" data-run="F0 · Bank · F0-15" data-title="Interactive table primitive" data-sub="Fill a table of values, watch the differences, and see every column become a point on the graph."></header>
<main id="gallery"></main>
<section class="nova-card nova-logcard" aria-label="Event log">
<h2 style="font-size:1.1em">Event log (NOVA.events)</h2>
<div id="log" class="nova-log" role="log" aria-live="off"></div>
<button class="nova-btn" id="clearlog">Clear log</button>
</section>
</div>
<script>
@@JS@@
</script>
<script>
/* ===== F0-15 CONFIG: parameters + named presets ===== */
var NOVA_F0_15_CONFIG={
  startMode:'watch',
  preset:'linear',
  presets:{
    linear:  {label:'Table of values y = 3x − 2',xh:'x',yh:'y',xs:[-1,0,1,2,3],f:'3x-2',m:3,c:-2,y:[-6,10],ys:2},
    linear2: {label:'Table of values y = −2x + 5',xh:'x',yh:'y',xs:[-1,0,1,2,3],f:'-2x+5',m:-2,c:5,y:[-2,8],ys:2},
    ratio:   {label:'Ratio table: eggs per cake (3 : 2)',xh:'cakes',yh:'eggs',xs:[2,4,6,8,10],f:'1.5x',m:1.5,c:0,y:[0,16],ys:4},
    convert: {label:'Conversion: miles to km (× 1.6)',xh:'miles',yh:'km',xs:[0,5,10,15,20],f:'1.6x',m:1.6,c:0,y:[0,32],ys:8},
    gcse:    {label:'GCSE: y = x² − 1',xh:'x',yh:'y',xs:[-2,-1,0,1,2],f:'x^2-1',quad:true,y:[-2,4],ys:1}
  }
};
</script>
<script>
/* ===== F0-15 ENGINE ===== */
(function(){
var h=NOVA.h,S=NOVA.svg,C=NOVA_F0_15_CONFIG;
function F(p){return function(x){return p.quad?x*x-1:+(p.m*x+p.c).toFixed(9);};}
function num(v){return NOVA.svg.num?NOVA.svg.num(v):String(v);}
/* o:{p, vals:{i:value|undefined}, blank:[i], bad:[i], hl:i, input:fn, diffs, note, plot} */
function view(stage,o){var p=o.p,f=F(p),w=h('div',{class:'tb-wrap'}),L=h('div'),R=h('div');
  var t=h('table',{class:'tb','aria-label':'Table of values for '+p.label}),r1=h('tr',{},[h('th',{scope:'row',text:p.xh})]),r2=h('tr',{},[h('th',{scope:'row',class:o.hl!=null?'':'' ,text:p.yh})]);
  p.xs.forEach(function(x,i){r1.appendChild(h('td',{class:o.hl===i?'hl':'',text:num(x)}));var v=o.vals&&o.vals[i]!=null?o.vals[i]:null,isB=o.blank&&o.blank.indexOf(i)>=0&&v==null,isBad=o.bad&&o.bad.indexOf(i)>=0;
    var td=h('td',{class:(isB?'blank':isBad?'bad':v!=null&&o.blank&&o.blank.indexOf(i)>=0?'fill':'')+(o.hl===i?' hl':''),'data-maths':o.hl===i?'row':isBad?'bad':isB&&o.tgt?'blank':null});
    if(o.input&&isB){var inp=h('input',{'aria-label':p.yh+' when '+p.xh+' = '+x,inputmode:'decimal'});inp.addEventListener('change',function(){o.input(i,inp.value);});inp.addEventListener('focus',function(){if(o.focus)o.focus(i);});td.appendChild(inp);}else if(!isB)td.textContent=num(v!=null?v:f(x));r2.appendChild(td);});
  t.appendChild(r1);t.appendChild(r2);L.appendChild(t);
  if(o.diffs){var ys=p.xs.map(f),d=NOVA.table.diffs(ys),dv=h('div',{class:'tb-diff','aria-label':'Differences',style:'grid-template-columns:34px repeat('+p.xs.length+',1fr)','data-maths':'diff'});dv.appendChild(h('span'));dv.appendChild(h('span'));d.forEach(function(x){dv.appendChild(h('span',{text:(x>=0?'+':'')+num(x)}));});L.appendChild(dv);}
  L.appendChild(h('div',{class:'tb-note',text:o.note||''}));
  if(o.plot!==false){var sv=S.root(300,200,'Graph of the table');sv.setAttribute('class','nv-svg tb-svg');var P=NOVA.plot.frame(sv,{x0:34,y0:10,w:250,h:166,x:[p.xs[0],p.xs[p.xs.length-1]],y:p.y,xStep:p.xs[1]-p.xs[0],yStep:p.ys,xLabel:p.xh,yLabel:p.yh});
    if(o.line)P.line(f,{role:'support',dash:'5 4'});var pts=[];p.xs.forEach(function(x,i){var known=!(o.blank&&o.blank.indexOf(i)>=0)||(o.vals&&o.vals[i]!=null);if(!known)return;var y=o.vals&&o.vals[i]!=null?o.vals[i]:f(x);if(y<p.y[0]||y>p.y[1])return;pts.push([x,y,'',o.hl===i?'pt':null,i]);});
    pts.forEach(function(q){var bad=o.bad&&o.bad.indexOf(q[4])>=0;NOVA.plot.marker(sv,P.X(q[0]),P.Y(q[1]),bad?'cross':o.hl===q[4]?'diamond':'circle',o.hl===q[4]?6:4.5,bad?'stroke:var(--m-error);fill:none':'fill:var(--m-'+(o.hl===q[4]?'focus':'given')+');stroke:#06111b;stroke-width:1',{'data-maths':o.hl===q[4]?'pt':null});});R.appendChild(sv);}
  w.appendChild(L);w.appendChild(R);stage.appendChild(w);}
var LP=C.presets.linear;
var DEMO=[{p:LP,blank:[0,1,2,3,4],note:'x values chosen; y to work out.'},{p:LP,blank:[1,2,3,4],vals:{0:-5},note:'x = −1: 3 × (−1) − 2 = −5'},{p:LP,diffs:1,note:'Each step in x adds 3 to y: the gradient.'},{p:LP,line:1,note:'Each column is a point (x, y).'},{p:LP,line:1,hl:3,note:'Row x = 2 ↔ point (2, 4)',target:'pt'},{p:LP,line:1,vals:{3:5},bad:[3],note:'(2, 5) is off the line. 3 × 2 − 2 = 4.',target:'bad'},{p:LP,line:1,diffs:1,note:'Complete: y = 3x − 2'}];
var steps=[
 {name:'Table',mood:'neutral',narration:'A table of values lists x values and works out y for each. Here the rule is y = 3x − 2.',prompt:'What rule fills the y row?'},
 {name:'Fill',mood:'think',narration:'Substitute each x. When x is −1: 3 times −1 is −3, take 2 is −5.',prompt:'What is y when x = 0?'},
 {name:'Differences',mood:'think',narration:'Look along the row: y goes up by 3 each time x goes up by 1. That constant difference is the gradient.',prompt:'What is the difference?'},
 {name:'Link to graph',mood:'focus',narration:'Each column is a coordinate. Plot them and they line up on y = 3x − 2.',prompt:'Which point comes from x = 1?'},
 {name:'Highlight',mood:'focus',narration:'Highlight a column and its point lights up too: x = 2, y = 4 is the point (2, 4).',prompt:'What are the coordinates?',target:'pt'},
 {name:'Spot the error',mood:'oops',narration:'If a value is wrong, the point jumps off the line. 5 should be 4: 3 times 2 is 6, take 2 is 4.',prompt:'Which value is wrong?',target:'bad'},
 {name:'Complete',mood:'cheer',narration:'Complete table, steady differences, points on a line: the table and the graph tell the same story.',prompt:'What is the gradient?'}];
function render(i,stage){stage.innerHTML='';var s=steps[i];NOVA.cap(stage,'Table · '+s.name,'step '+(i+1)+'/'+steps.length);view(stage,DEMO[i]);NOVA.scene.helperStrip(stage,i===steps.length-1?'cheer':'explain',s.name);}
var def={id:'F0-15',title:'Interactive table primitive',config:C,steps:steps,render:render,
 alt:'Interactive table primitive: a two-row table of x and y values with blanks to fill and a differences row, linked to a graph where each column is a point.',
 staticAlt:'y = 3x − 2: x −1, 0, 1, 2, 3 gives y −5, −2, 1, 4, 7. Differences +3. Points lie on a straight line; (2, 5) would be off the line, so 5 is an error.',
 exploreIntro:'Explore: pick a table, type the missing values (each correct one is plotted), focus a cell to highlight its point.',
 explore:function(panel,stage,api){var p=C.presets[C.preset],vals={},hl=null;
   function draw(){stage.innerHTML='';var done=Object.keys(vals).length;NOVA.cap(stage,'Explore · '+p.label,done+'/'+p.xs.length+' filled');view(stage,{p:p,blank:p.xs.map(function(_,i){return i;}),vals:vals,hl:hl,line:done===p.xs.length,diffs:done===p.xs.length,note:hl!=null?p.xh+' = '+num(p.xs[hl])+': '+p.f.replace(/x/g,'('+num(p.xs[hl])+')'):'Type a value in any dashed cell.',input:function(i,v){var n=NOVA.ui.parseNum(v),ok=Math.abs(n-F(p)(p.xs[i]))<1e-9;NOVA.events.emit('value',{engine:'F0-15',key:'cell',index:i,value:n});api.check(ok,ok?'Yes: '+num(n)+'.':'Not quite. Substitute '+p.xh+' = '+num(p.xs[i])+' into '+p.f+'.',{cell:i});if(ok){vals[i]=n;hl=i;}draw();},focus:function(i){if(hl!==i){hl=i;}}});NOVA.scene.helperStrip(stage,'explain',done+' filled');}
   var pre=h('select',{class:'nova-input','aria-label':'Table'});Object.keys(C.presets).forEach(function(k){pre.appendChild(h('option',{value:k,text:C.presets[k].label}));});pre.onchange=function(){p=C.presets[pre.value];vals={};hl=null;NOVA.events.emit('value',{engine:'F0-15',key:'preset',value:pre.value});draw();};
   panel.appendChild(h('label',{class:'pr-row'},['Table ',pre]));
   panel.appendChild(h('div',{class:'pr-row'},[h('button',{class:'nova-btn',text:'Clear',onclick:function(){vals={};hl=null;draw();}}),h('button',{class:'nova-btn ghost',text:'Hint',onclick:function(){var i=p.xs.findIndex(function(_,k){return vals[k]==null;});api.hint(i<0?'All filled!':'For '+p.xh+' = '+num(p.xs[i])+', work out '+p.f.replace(/x/g,'('+num(p.xs[i])+')')+'.');}})]));
   draw();C._explore={vals:vals};},
 challenge:function(panel,api,stage){var R=C.presets.ratio;
   var tasks=[
    {q:'y = 3x − 2. Fill the blank: y when x = 2.',build:NOVA.entryTask('y =','F0-15'),check:function(v){var ok=v===4;return [ok,ok?'Yes: 3 × 2 − 2 = 4.':v===6?'Do not forget − 2.':v===3?'3x means 3 × x, not 3 + x − 2.':'Substitute x = 2.'];},hint:'3 × 2 = 6, then subtract 2.',solve:function(c){c._A.input.value='4';}},
    {q:'One y value is wrong. For which x is it wrong?',build:NOVA.entryTask('x =','F0-15'),check:function(v){var ok=v===1;return [ok,ok?'Yes: at x = 1, y should be 1, not 2. The differences break there too.':'Check the differences: they should all be +3.'];},hint:'The cross on the graph is off the line.',solve:function(c){c._A.input.value='1';}},
    {q:'Ratio table: 3 eggs make 2 cakes. How many eggs for 8 cakes?',build:NOVA.entryTask('eggs =','F0-15'),check:function(v){var ok=v===12;return [ok,ok?'Yes: 8 cakes is 4 lots of 2, so 4 × 3 = 12 eggs.':v===9?'That adds 6. Ratios multiply: 2 → 8 is × 4.':'Scale up: 2 cakes to 8 cakes is × 4.'];},hint:'2 × 4 = 8, so multiply 3 by 4.',solve:function(c){c._A.input.value='12';}}];
   NOVA.challengeRun(panel,api,tasks,function(k){stage.innerHTML='';NOVA.cap(stage,'Challenge '+(k+1)+' of 3',['fill','error','ratio'][k]);
     if(k===0)view(stage,{p:LP,blank:[3],tgt:1,note:'x = 2 → y = ?'});else if(k===1)view(stage,{p:LP,vals:{2:2},bad:[2],line:1,diffs:0,note:'Which value is wrong?'});else view(stage,{p:R,blank:[3],note:'3 eggs : 2 cakes'});NOVA.scene.helperStrip(stage,'think',['y = ?','Spot it','Scale up'][k]);},C);}
};
NOVA.bankMount({id:'F0-15',num:'15',title:'Interactive table primitive (fill, link to graph, highlight)',def:def,linked:['F0-04','F0-11','F0-13','F0-14'],
 spec:{purpose:'A reusable two-row table for tables of values, ratio tables and conversions: fill blanks, see the difference pattern, link every column to a point on the F0-14 graph, highlight a column and its point, and spot errors that fall off the line.',
  params:'preset; per table: headings, xs, rule (m, c or quadratic), y range and step. Core: NOVA.table.diffs / rule, NOVA.plot. Year groups: KS3 Years 7–9 (12–15), with GCSE extension.',
  presets:'y = 3x − 2 · y = −2x + 5 · Ratio 3 eggs : 2 cakes · Miles to km · GCSE y = x² − 1',
  steps:'Table → Fill → Differences → Link to graph → Highlight → Spot the error → Complete. Each step has a Sir Bob line and a Guided prompt. The helper glides to the highlighted point and the wrong value.',
  interactions:'Watch: auto-play. Guided: step with prompts. Explore: choose a table, type values into dashed cells (each checked, fires correct, plotted), focusing a cell highlights its point; Clear, Hint. Challenge (3 tasks): y at x = 2 (4); find the wrong value (x = 1); eggs for 8 cakes (12). Events: value, correct, step, hintUsed.',
  traps:'3x read as 3 + x · Forgetting the constant · Negative x substitution (3 × −1) · Adding in ratio tables instead of multiplying',
  gcse:'Extension: quadratic tables (non-constant differences); linked: F0-14 plotting, F0-13 worked examples, F0-11 marking'}});
})();
</script>
<script>
(function(){var log=document.getElementById('log');var addLog=function(e){log.textContent=new Date(e.time).toLocaleTimeString()+' '+e.type+' '+JSON.stringify(e.detail)+'\n'+log.textContent.slice(0,6000);};NOVA.events.history().forEach(addLog);NOVA.events.on('*',addLog);
document.getElementById('clearlog').onclick=function(){log.textContent='';};})();
</script>
</body>
</html>
