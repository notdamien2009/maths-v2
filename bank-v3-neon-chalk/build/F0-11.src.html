<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA F0-11 · Assessment engine</title>
<style>
@@CSS@@
/* ---- F0-11 local styles ---- */
.pr-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.pr-task{font-weight:700}
.rs-opts{display:flex;flex-wrap:wrap;gap:6px}
.rs-opts button[aria-pressed="true"]{outline:3px solid var(--m-focus)}
.nova-spec dd{white-space:pre-line}
.xx-h4{margin:0 0 4px;font:800 .68rem var(--nova-font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--v-muted)}
@media print{.nova-tl,.nova-tabs,.nova-helperbar,.nova-panel{display:none!important}}
.as-wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px;padding:8px 12px}
@media (max-width:480px){.as-wrap{grid-template-columns:1fr}}
.as-q{height:118px;overflow:hidden;padding:8px 10px;border-radius:10px;border:1px solid var(--v-line);background:var(--v-panel2);font:600 .82rem/1.45 var(--nova-font-ui);color:var(--v-ink)}
.as-q .qn{font:800 .64rem var(--nova-font-ui);color:var(--v-muted);letter-spacing:.06em;text-transform:uppercase}
.as-q .resp{margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.as-q .resp b{font:800 .9rem var(--nova-font-mono,monospace);padding:2px 9px;border-radius:7px;border:1.5px solid var(--m-focus);color:var(--m-focus)}
.as-q .resp b.ok{border-color:var(--m-result);color:var(--m-result)}.as-q .resp b.ok::after{content:' \2713'}
.as-q .resp b.no{border-color:var(--m-error);color:var(--m-error)}.as-q .resp b.no::after{content:' \2716'}
.as-q .work{font:600 .72rem var(--nova-font-mono,monospace);color:var(--v-muted)}
.as-ms{display:grid;grid-template-rows:repeat(3,28px);gap:4px;margin:0;padding:0;list-style:none}
.as-ms li{display:grid;grid-template-columns:34px 1fr 22px;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:8px;border:1px solid var(--v-line);font:600 .7rem var(--nova-font-ui);color:var(--v-ink);overflow:hidden}
.as-ms li code{font:800 .7rem var(--nova-font-mono,monospace);color:var(--m-support)}
.as-ms li span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.as-ms li i{font-style:normal;font-weight:900;text-align:center}
.as-ms li.got{border-color:var(--m-result)}.as-ms li.got i{color:var(--m-result)}.as-ms li.got i::before{content:'\2713'}
.as-ms li.miss i{color:var(--v-muted)}.as-ms li.miss i::before{content:'\25CB'}
.as-ms li.empty{opacity:.3}
.as-fb{height:42px;overflow:hidden;margin-top:6px;padding:5px 8px;border-radius:8px;border:1px dashed var(--v-line);font:600 .72rem/1.35 var(--nova-font-ui);color:var(--v-muted)}
.as-fb.trap{border-color:var(--m-error);color:var(--v-ink)}.as-fb.trap::before{content:'\26A0 ';color:var(--m-error)}
.as-tot{font:800 .78rem var(--nova-font-ui);margin:6px 0 4px;height:18px}
.as-bar{display:block;width:100%;height:auto}
</style>
</head>
<body data-topic="number">
<div class="nova-wrap">
<header id="nova-header" data-run="F0 · Bank · F0-11" data-title="Assessment engine" data-sub="Numeric, multiple choice, select-all and order questions, marked fairly with GCSE-style mark schemes, misconception feedback and results by objective."></header>
<main id="gallery"></main>
<section class="nova-card nova-logcard" aria-label="Event log">
<h2 style="font-size:1.1em">Event log (NOVA.events)</h2>
<div id="log" class="nova-log" role="log" aria-live="off"></div>
<button class="nova-btn" id="clearlog">Clear log</button>
</section>
</div>
<script>
@@JS@@
</script>
<script>
/* ===== F0-11 CONFIG: parameters + named presets (question sets) ===== */
var NOVA_F0_11_CONFIG={
  startMode:'watch',
  preset:'fractions',
  tolerance:0.001,     /* numeric answers within this are accepted */
  presets:{
    fractions:{label:'Y7 Fractions of amounts',objectives:{O1:'Unit fractions of amounts',O2:'Non-unit fractions of amounts'},qs:[
      {id:'q1',type:'numeric',prompt:'Find 1/4 of 24.',answer:6,marks:1,objective:'O1',traps:{'96':'That is 24 × 4. A quarter means divide by 4.','20':'That subtracts 4. A quarter means share into 4 equal parts.'}},
      {id:'q2',type:'numeric',prompt:'Find 3/4 of 24.',answer:18,marks:2,objective:'O2',scheme:[{code:'M1',text:'24 ÷ 4 = 6 seen',test:function(r){return /6/.test((r&&r.work)||'');}},{code:'A1',text:'18 cao'}],traps:{'6':'That is one quarter. Three quarters is 3 lots of 6.','8':'That is a third of 24. The denominator is 4.'}},
      {id:'q3',type:'numeric',prompt:'Write 3/4 as a decimal.',answer:0.75,accept:['3/4','.75'],marks:1,objective:'O1',traps:{'0.34':'3/4 is not 0.34. Divide 3 by 4.','3.4':'3/4 means 3 ÷ 4.'}},
      {id:'q4',type:'mcq',prompt:'Which is bigger: 2/3 of 30 or 3/4 of 24?',options:['2/3 of 30','3/4 of 24','They are equal'],answer:'2/3 of 30',marks:1,objective:'O2',traps:{'3/4 of 24':'3/4 of 24 = 18 but 2/3 of 30 = 20.'}},
      {id:'q5',type:'multi',prompt:'Select all that equal 12.',options:['1/2 of 24','1/3 of 36','2/5 of 25','3/4 of 16'],answer:['1/2 of 24','1/3 of 36','3/4 of 16'],marks:2,objective:'O2',scheme:[{code:'B1',text:'at least two correct, none wrong',test:function(r){var v=r&&r.answer||r||[];var good=['1/2 of 24','1/3 of 36','3/4 of 16'];return v.length>=2&&v.every(function(x){return good.indexOf(x)>=0;});}},{code:'A1',text:'all three'}]}]},
    integers:{label:'Y7 Negative numbers',objectives:{O1:'Add and subtract negatives',O2:'Multiply negatives'},qs:[
      {id:'n1',type:'numeric',prompt:'−3 + 8',answer:5,marks:1,objective:'O1',traps:{'-11':'Start at −3 and move 8 to the right.','11':'Signs matter: −3 + 8 is 5.'}},
      {id:'n2',type:'numeric',prompt:'4 − (−6)',answer:10,marks:1,objective:'O1',traps:{'-2':'Subtracting a negative is adding: 4 + 6.'}},
      {id:'n3',type:'numeric',prompt:'−5 × −3',answer:15,marks:1,objective:'O2',traps:{'-15':'Negative × negative is positive.'}},
      {id:'n4',type:'order',prompt:'Order from smallest: 2, −7, 0, −1',answer:['-7','-1','0','2'],marks:1,objective:'O1'},
      {id:'n5',type:'mcq',prompt:'Which is true?',options:['−8 > −3','−8 < −3','−8 = −3'],answer:'−8 < −3',marks:1,objective:'O1',traps:{'−8 > −3':'−8 is further left on the number line, so it is smaller.'}}]},
    gcse:{label:'GCSE: Standard form',objectives:{O1:'Convert',O2:'Calculate'},qs:[
      {id:'s1',type:'numeric',prompt:'Write 45 000 in standard form. Give the power of 10.',answer:4,marks:1,objective:'O1',traps:{'3':'4.5 × 10³ is 4 500.'}},
      {id:'s2',type:'numeric',prompt:'(2 × 10³) × (4 × 10⁵) = 8 × 10ⁿ. Find n.',answer:8,marks:2,objective:'O2',scheme:[{code:'M1',text:'adds the powers',test:function(r){return /3\s*\+\s*5/.test((r&&r.work)||'');}},{code:'A1',text:'n = 8'}],traps:{'15':'Multiply the numbers but ADD the powers.'}},
      {id:'s3',type:'numeric',prompt:'Write 0.003 as a × 10ⁿ. Find n.',answer:-3,marks:1,objective:'O1',traps:{'3':'Small numbers have negative powers.'}}]}
  }
};
</script>
<script>
/* ===== F0-11 ENGINE ===== */
(function(){
var h=NOVA.h,S=NOVA.svg,E=S.el,C=NOVA_F0_11_CONFIG,A=NOVA.assess,MT=NOVA.mt;
function set(){return C.presets[C.preset];}
function bars(res,objs){var keys=Object.keys(objs),W=300,H=26*keys.length+6,sv=S.root(W,H,'Results by objective: '+keys.map(function(k){var o=res.byObjective[k]||{pct:0};return k+' '+o.pct+'%';}).join(', '));sv.setAttribute('class','nv-svg as-bar');sv.setAttribute('data-maths','bars');
  keys.forEach(function(k,i){var o=res.byObjective[k]||{got:0,max:0,pct:0},y=4+i*26,w=(W-120)*o.pct/100,low=o.pct<50;var t=E('text',{x:0,y:y+15,css:'fill:var(--v-ink);font:800 11px var(--nova-font-ui)'},sv);t.textContent=k;
    E('rect',{x:30,y:y+2,width:W-120,height:16,rx:5,css:'fill:none;stroke:var(--v-line)'},sv);if(w>0)E('rect',{x:30,y:y+2,width:w,height:16,rx:5,css:'fill:var(--m-'+(low?'error':'result')+')'},sv);
    if(low&&w>0)for(var x=34;x<30+w-2;x+=7)E('line',{x1:x,y1:y+16,x2:x+5,y2:y+4,css:'stroke:rgba(6,17,27,.45);stroke-width:1.6'},sv);
    var l=E('text',{x:W-84,y:y+15,css:'fill:var(--v-ink);font:800 11px var(--nova-font-ui)'},sv);l.textContent=o.got+'/'+o.max+' · '+o.pct+'%'+(low?' \u25BD':' \u25B3');});return sv;}
function respText(q,r){if(r==null)return '—';var v=typeof r==='object'&&!Array.isArray(r)?r.answer:r;return Array.isArray(v)?v.join(', '):String(v);}
function card(stage,o){var q=o.q,w=h('div',{class:'as-wrap'}),L=h('div'),R=h('div');L.appendChild(h('h4',{class:'xx-h4',text:'Question · '+q.type+' · '+q.marks+' mark'+(q.marks>1?'s':'')+' · '+q.objective}));
  var m=o.resp!=null&&o.marked?A.mark(q,o.resp):null;var qc=h('div',{class:'as-q'},[h('div',{class:'qn',text:(o.n||'Q')+(q.options?' · options: '+q.options.join(' / '):'')}),h('div',{text:q.prompt})]);
  var rp=h('div',{class:'resp'},['Answer ',h('b',{class:m?(m.correct?'ok':'no'):'','data-maths':'resp',text:respText(q,o.resp)})]);if(o.resp&&o.resp.work)rp.appendChild(h('span',{class:'work',text:'working: '+o.resp.work}));qc.appendChild(rp);L.appendChild(qc);
  var fb=h('div',{class:'as-fb'+(m&&m.trap?' trap':''),'data-maths':m&&m.trap?'trap':null,text:m?m.feedback+' ('+m.marks+'/'+m.max+')':'Not marked yet.'});L.appendChild(fb);
  R.appendChild(h('h4',{class:'xx-h4',text:o.res?'Results by objective':'Mark scheme'}));
  if(o.res){R.appendChild(h('div',{class:'as-tot',text:'Total '+o.res.total+'/'+o.res.max}));R.appendChild(bars(o.res,o.objs));}
  else{var ul=h('ul',{class:'as-ms','aria-label':'Mark scheme'});var sch=q.scheme||[{code:'B'+q.marks,text:q.type==='numeric'?'answer '+q.answer+(q.accept?' (or '+q.accept.join(', ')+')':''):'correct choice'}];
    for(var i=0;i<3;i++){var s=sch[i];if(!s){ul.appendChild(h('li',{class:'empty'},[h('code',{text:''}),h('span',{text:'—'}),h('i')]));continue;}ul.appendChild(h('li',{class:m?(m.awarded.indexOf(s.code)>=0?'got':'miss'):''},[h('code',{text:s.code}),h('span',{text:s.text}),h('i')]));}R.appendChild(ul);}
  w.appendChild(L);w.appendChild(R);stage.appendChild(w);}
var F=C.presets.fractions,Q=F.qs;
var RESP=[6,{answer:16,work:'24 ÷ 4 = 6, 6 × 3 = 16'},'3/4',['3/4 of 24'],{answer:['1/2 of 24','1/3 of 36']}];
var DEMO=[{q:Q[0]},{q:Q[0],resp:6,marked:1,target:'resp'},{q:Q[2],resp:'3/4',marked:1},{q:Q[1],resp:RESP[1],marked:1},{q:Q[1],resp:{answer:6,work:'24 ÷ 4 = 6'},marked:1,target:'trap'},{q:Q[4],resp:RESP[4],marked:1,res:A.results(Q,RESP),objs:F.objectives,target:'bars'},{q:Q[4],resp:RESP[4],marked:1,res:A.results(Q,RESP),objs:F.objectives}];
var steps=[
 {name:'Question types',mood:'neutral',narration:'One engine, four question types: numeric, multiple choice, select-all and put-in-order. Every question carries its marks and objective.',prompt:'What type is "Find 1/4 of 24"?'},
 {name:'Mark',mood:'cheer',narration:'A quarter of 24 is 6. The marker compares the answer and awards the mark.',prompt:'How many marks for 6?',target:'resp'},
 {name:'Equivalent answers',mood:'think',narration:'3/4, 0.75 and .75 are the same number, so all of them score. Pupils are not punished for a different form.',prompt:'Name another way to write 0.75.'},
 {name:'Method marks',mood:'think',narration:'Three quarters of 24 is worth 2 marks. This pupil found 24 ÷ 4 = 6 but slipped: 6 × 3 is 18, not 16. M1 for the method, no A1.',prompt:'Why does the pupil get 1 mark?'},
 {name:'Misconceptions',mood:'focus',narration:'An answer of 6 for three quarters is a known trap: it is only one quarter. The feedback names the slip, not just "wrong".',prompt:'What did the pupil forget?',target:'trap'},
 {name:'By objective',mood:'focus',narration:'Results group by objective. O1 is strong; O2, non-unit fractions, needs more work. The striped bar marks the gap.',prompt:'Which objective needs work?',target:'bars'},
 {name:'Report',mood:'cheer',narration:'Marks, method credit, misconception notes and objective scores: everything a teacher needs, with no scores turned into games here.',prompt:'What would you reteach first?'}];
function render(i,stage){stage.innerHTML='';var s=steps[i],d=DEMO[i];NOVA.cap(stage,'Assessment · '+s.name,'step '+(i+1)+'/'+steps.length);card(stage,Object.assign({n:'Q'+(Q.indexOf(d.q)+1)},d));NOVA.scene.helperStrip(stage,i===steps.length-1?'cheer':'explain',s.name);}
var def={id:'F0-11',title:'Assessment engine',config:C,steps:steps,render:render,
 alt:'Assessment engine: a question card with the pupil answer and feedback beside a mark scheme (M1, A1) or results-by-objective bars.',
 staticAlt:'Question 2: Find 3/4 of 24 (2 marks, O2). Mark scheme: M1 24 ÷ 4 = 6 seen; A1 18. A pupil answering 16 with 24 ÷ 4 = 6 shown gets M1 only (1/2). Answer 6 triggers the note "That is one quarter". Results: O1 100%, O2 lower.',
 exploreIntro:'Explore: take the quiz. Type or pick an answer (add working for method marks), press Mark, and watch the objective bars fill.',
 explore:function(panel,stage,api){var P=set(),i=0,resp=P.qs.map(function(){return null;}),marked=P.qs.map(function(){return false;}),showRes=false;
   function draw(){stage.innerHTML='';var q=P.qs[i];NOVA.cap(stage,'Explore · Q'+(i+1)+' of '+P.qs.length,showRes?'results':q.type);card(stage,{q:q,n:'Q'+(i+1),resp:resp[i],marked:marked[i],res:showRes?A.results(P.qs,resp):null,objs:P.objectives});NOVA.scene.helperStrip(stage,'explain','Q'+(i+1));}
   var box=h('div');function build(){box.innerHTML='';var q=P.qs[i];
     if(q.type==='numeric'){var e=NOVA.ui.entry({label:'Answer',engine:'F0-11-ui'}),wk=NOVA.ui.entry({label:'Working',engine:'F0-11-ui'});wk.input.setAttribute('inputmode','text');box.appendChild(e);if(q.scheme)box.appendChild(wk);box._get=function(){var v=e.input.value.trim();return q.scheme?{answer:v,work:wk.input.value}:v;};}
     else if(q.type==='mcq'){var g=NOVA.ui.choice(q.options,null,{engine:'F0-11'});box.appendChild(g);box._get=function(){return g.get();};}
     else if(q.type==='multi'){var sel=[],gg=h('div',{class:'rs-opts',role:'group','aria-label':'Select all'});q.options.forEach(function(x){var b=h('button',{class:'nova-btn','aria-pressed':'false',text:x,onclick:function(){var k=sel.indexOf(x);if(k<0)sel.push(x);else sel.splice(k,1);b.setAttribute('aria-pressed',String(k<0));NOVA.events.emit('value',{engine:'F0-11',control:'multi',value:sel.slice()});}});gg.appendChild(b);});box.appendChild(gg);box._get=function(){return {answer:sel.slice()};};}
     else{var s2=NOVA.ui.sort?null:null;var ord=h('input',{class:'nova-input','aria-label':'Order, comma separated',placeholder:'e.g. -7, -1, 0, 2'});box.appendChild(ord);box._get=function(){return ord.value.split(',').map(function(x){return x.trim().replace('\u2212','-');});};}}
   var pre=h('select',{class:'nova-input','aria-label':'Question set'});Object.keys(C.presets).forEach(function(k){pre.appendChild(h('option',{value:k,text:C.presets[k].label}));});pre.value=C.preset;pre.onchange=function(){P=C.presets[pre.value];i=0;resp=P.qs.map(function(){return null;});marked=P.qs.map(function(){return false;});showRes=false;build();draw();NOVA.events.emit('value',{engine:'F0-11',key:'preset',value:pre.value});};
   panel.appendChild(h('label',{class:'pr-row'},['Question set ',pre]));panel.appendChild(box);
   panel.appendChild(h('div',{class:'pr-row'},[h('button',{class:'nova-btn',text:'\u25C0 Prev',onclick:function(){i=Math.max(0,i-1);showRes=false;build();draw();}}),h('button',{class:'nova-btn primary',text:'Mark',onclick:function(){resp[i]=box._get();marked[i]=true;var m=A.mark(P.qs[i],resp[i]);api.check(m.correct,m.feedback+' ('+m.marks+'/'+m.max+')',{question:P.qs[i].id,marks:m.marks});draw();}}),
     h('button',{class:'nova-btn',text:'Next \u25B6',onclick:function(){i=Math.min(P.qs.length-1,i+1);showRes=false;build();draw();}}),h('button',{class:'nova-btn ghost',text:'Results',onclick:function(){showRes=!showRes;draw();}})]));
   build();draw();C._explore={get:function(){return {i:i,resp:resp};}};},
 challenge:function(panel,api,stage){var qA={id:'c1',type:'numeric',prompt:'Find 3/4 of 24.',answer:18,marks:2,objective:'O2',scheme:Q[1].scheme};
   var R2=[6,{answer:16,work:'6'},0.75,'3/4 of 24',null],res=A.results(Q,[6,18,0.75,'3/4 of 24',{answer:['1/2 of 24']}]);
   var tasks=[
    {q:'A pupil answers 16 for "3/4 of 24" and shows 24 ÷ 4 = 6. How many marks out of 2?',build:NOVA.entryTask('marks =','F0-11'),check:function(v){var ok=v===1;return [ok,ok?'Yes: M1 for the method, no A1 because 16 is wrong.':v===0?'The method mark is for 24 ÷ 4 = 6, which is shown.':v===2?'A1 needs the right answer, 18.':'Look at the mark scheme lines.'];},hint:'M1 is for the method, A1 for the right answer.',solve:function(c){c._A.input.value='1';}},
    {q:'The answer is 0.75. Which response should ALSO score?',build:NOVA.choiceTask(['3/4','0.34','7/5'],'F0-11'),check:function(v){var ok=v==='3/4';return [ok,ok?'Yes: 3/4 = 0.75, the same number in another form.':v?'That is not equal to 0.75. Divide to check.':'Pick one first.'];},hint:'Equivalent forms of the same number score.',solve:function(c){c._G.set('3/4');}},
    {q:'From these results, which objective needs reteaching?',build:NOVA.choiceTask(['O1','O2'],'F0-11'),check:function(v){var ok=v==='O2';return [ok,ok?'Yes: O2 is the low, striped bar.':v?'O1 is full. Look for the striped bar.':'Pick one first.'];},hint:'The striped bar marks the gap.',solve:function(c){c._G.set('O2');}}];
   NOVA.challengeRun(panel,api,tasks,function(k){stage.innerHTML='';NOVA.cap(stage,'Challenge '+(k+1)+' of 3',['method marks','equivalence','by objective'][k]);
     if(k===0)card(stage,{q:qA,n:'Q2',resp:{answer:16,work:'24 ÷ 4 = 6'}});else if(k===1)card(stage,{q:Q[2],n:'Q3'});else card(stage,{q:Q[4],n:'Q5',res:res,objs:F.objectives});NOVA.scene.helperStrip(stage,'think',['Marks?','Equivalent?','Reteach?'][k]);},C);}
};
NOVA.bankMount({id:'F0-11',num:'11',title:'Assessment engine (question types, marking, mark scheme, results by objective)',def:def,linked:['F0-04','F0-05','F0-07','F0-09','F0-12','F0-13','F0-17'],
 spec:{purpose:'Marks maths answers fairly: numeric (with tolerance and equivalent forms), multiple choice, select-all and ordering; GCSE-style mark schemes with method (M1), accuracy (A1) and independent (B1) marks; named misconception feedback; results grouped by learning objective for reports.',
  params:'preset question set; tolerance; per question: type, prompt, answer, accept[], marks, scheme[{code,text,test}], objective, traps{answer:message}. Core: NOVA.assess.mark(q, response) / results(questions, responses) / eq / TYPES. Year groups: KS3 Years 7–9 (12–15), with GCSE extension.',
  presets:'Y7 Fractions of amounts · Y7 Negative numbers · GCSE Standard form',
  steps:'Question types → Mark → Equivalent answers → Method marks → Misconceptions → By objective → Report. Each step has a Sir Bob line and a Guided prompt. The helper glides to the answer, the misconception note and the objective bars.',
  interactions:'Watch: auto-play. Guided: step with prompts. Explore: choose a set, answer each question (entry with optional working, choice, select-all, order), Mark (fires correct with marks), Prev / Next, Results bars. Challenge (3 tasks): method marks for 16 with 24 ÷ 4 = 6 shown (1); equivalent answer to 0.75 (3/4); objective to reteach (O2). Events: value, correct, step, hintUsed.',
  traps:'3/4 of 24 answered as 6 (one quarter only) · 1/4 of 24 as 96 (multiplying) · 3/4 read as 0.34 · Subtracting a negative · Multiplying the powers in standard form',
  gcse:'Extension: M1 / A1 / B1 mark schemes and the GCSE standard form set; results-by-objective feed the F0-12 wrapper and F0-17 worksheets'}});
})();
</script>
<script>
(function(){var log=document.getElementById('log');var addLog=function(e){log.textContent=new Date(e.time).toLocaleTimeString()+' '+e.type+' '+JSON.stringify(e.detail)+'\n'+log.textContent.slice(0,6000);};NOVA.events.history().forEach(addLog);NOVA.events.on('*',addLog);
document.getElementById('clearlog').onclick=function(){log.textContent='';};})();
</script>
