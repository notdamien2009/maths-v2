<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA F0-16 · Geometry canvas primitive</title>
<style>
@@CSS@@
/* ---- F0-16 local styles ---- */
.pr-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.pr-task{font-weight:700}
.rs-opts{display:flex;flex-wrap:wrap;gap:6px}
.rs-opts button[aria-pressed="true"]{outline:3px solid var(--m-focus)}
.nova-spec dd{white-space:pre-line}
.xx-h4{margin:0 0 4px;font:800 .68rem var(--nova-font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--v-muted)}
@media print{.nova-tl,.nova-tabs,.nova-helperbar,.nova-panel{display:none!important}}
.gc-wrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px;padding:6px 12px}
@media (max-width:480px){.gc-wrap{grid-template-columns:1fr}}
.gc-svg{display:block;width:100%;height:auto;touch-action:none}
.gc-svg .pt{cursor:grab}.gc-svg .pt:focus{outline:none}.gc-svg .pt:focus circle.ring{stroke:var(--m-focus);stroke-width:2.5}
.gc-info{display:grid;grid-template-rows:repeat(7,26px);gap:3px}
.gc-info div{height:26px;display:flex;align-items:center;padding:0 9px;border-radius:9px;border:1px solid var(--v-line);background:var(--v-panel2);font:700 .74rem var(--nova-font-ui);color:var(--v-ink);overflow:hidden;white-space:nowrap}
.gc-info div.hl{border-color:var(--m-focus);box-shadow:0 0 0 1px var(--m-focus)}
.gc-info div.empty{opacity:.25}
</style>
</head>
<body data-topic="geometry">
<div class="nova-wrap">
<header id="nova-header" data-run="F0 · Bank · F0-16" data-title="Geometry canvas primitive" data-sub="A snap grid with draggable points, live lengths and angle marks, for triangles, angle facts and Pythagoras."></header>
<main id="gallery"></main>
<section class="nova-card nova-logcard" aria-label="Event log">
<h2 style="font-size:1.1em">Event log (NOVA.events)</h2>
<div id="log" class="nova-log" role="log" aria-live="off"></div>
<button class="nova-btn" id="clearlog">Clear log</button>
</section>
</div>
<script>
@@JS@@
</script>
<script>
/* ===== F0-16 CONFIG: parameters + named presets ===== */
var NOVA_F0_16_CONFIG={
  startMode:'watch',
  grid:1,             /* snap step (grid units) */
  cols:10, rows:7,
  presets:{
    scalene: {label:'Scalene triangle',pts:[[1,1],[8,1],[3,6]]},
    right:   {label:'Right-angled triangle (3, 4, 5)',pts:[[2,1],[6,1],[2,4]]},
    isosceles:{label:'Isosceles triangle',pts:[[2,1],[8,1],[5,6]]},
    line:    {label:'Angles on a straight line',pts:[[1,2],[5,2],[8,5]],straight:true},
    gcse:    {label:'GCSE: Pythagoras (6, 8, 10)',pts:[[1,0],[7,0],[1,8]],rows:9}
  }
};
</script>
<script>
/* ===== F0-16 ENGINE ===== */
(function(){
var h=NOVA.h,S=NOVA.svg,E=S.el,C=NOVA_F0_16_CONFIG,G=NOVA.geo;
var NAMES=['A','B','C'],SH=['circle','square','diamond'];
function canvas(stage,o){var cols=o.cols||C.cols,rows=o.rows||C.rows,u=Math.min(270/cols,190/rows),W=cols*u+30,H=rows*u+24,w=h('div',{class:'gc-wrap'}),L=h('div'),R=h('div',{class:'gc-info'});
  var sv=S.root(W,H,o.alt||'Geometry canvas');sv.setAttribute('class','nv-svg gc-svg');L.appendChild(sv);var X=function(x){return 16+x*u;},Y=function(y){return H-12-y*u;};
  for(var i=0;i<=cols;i++)E('line',{x1:X(i),y1:Y(0),x2:X(i),y2:Y(rows),css:'stroke:var(--v-line);stroke-width:.7;opacity:.7'},sv);for(var j=0;j<=rows;j++)E('line',{x1:X(0),y1:Y(j),x2:X(cols),y2:Y(j),css:'stroke:var(--v-line);stroke-width:.7;opacity:.7'},sv);
  var P=o.pts;if(o.upto>=1){if(o.straight){E('line',{x1:X(0),y1:Y(P[0][1]),x2:X(cols),y2:Y(P[0][1]),'stroke-width':2.4,css:'stroke:var(--m-given)'},sv);E('line',{x1:X(P[1][0]),y1:Y(P[1][1]),x2:X(P[2][0]),y2:Y(P[2][1]),'stroke-width':2.4,css:'stroke:var(--m-given)'},sv);}
    else E('path',{d:'M'+P.map(function(p){return X(p[0])+','+Y(p[1]);}).join(' L')+'Z',fill:'rgba(43,220,243,.06)','stroke-width':2.4,css:'stroke:var(--m-given)'},sv);}
  var info=[];
  if(o.upto>=2&&!o.straight){[[0,1],[1,2],[2,0]].forEach(function(e,k){var a=P[e[0]],b=P[e[1]],d=G.dist(a,b),mx=(X(a[0])+X(b[0]))/2,my=(Y(a[1])+Y(b[1]))/2;var t=E('text',{x:mx,y:my-5,'text-anchor':'middle',css:'fill:var(--m-op);font:800 10px var(--nova-font-ui);paint-order:stroke;stroke:#071a28;stroke-width:3px','data-maths':o.side===k?'side':null},sv);t.textContent=NAMES[e[0]]+NAMES[e[1]]+' '+G.round(d,1);info.push({t:NAMES[e[0]]+NAMES[e[1]]+' = '+G.round(d,2)+' units',hl:o.side===k});});}
  if(o.upto>=3){var angs=o.straight?[[P[0],P[1],P[2]],[[cols,P[1][1]],P[1],P[2]]]:[[P[2],P[0],P[1]],[P[0],P[1],P[2]],[P[1],P[2],P[0]]],sum=0;
    angs.forEach(function(t,k){var a=G.angle(t[0],t[1],t[2]);sum+=a;var v=t[1],r=Math.min(22,u*1.1),a1=Math.atan2(-(t[0][1]-v[1]),t[0][0]-v[0]),a2=Math.atan2(-(t[2][1]-v[1]),t[2][0]-v[0]);
      var right=Math.abs(a-90)<.05;if(right){var ux=Math.cos(a1)*12,uy=Math.sin(a1)*12,wx=Math.cos(a2)*12,wy=Math.sin(a2)*12;E('path',{d:'M'+(X(v[0])+ux)+','+(Y(v[1])+uy)+' l'+wx+','+wy+' l'+(-ux)+','+(-uy),fill:'none','stroke-width':1.8,css:'stroke:var(--m-support)'},sv);}
      else{var sw=((a2-a1+2*Math.PI)%(2*Math.PI))>Math.PI?0:1;E('path',{d:'M'+(X(v[0])+Math.cos(a1)*r)+','+(Y(v[1])+Math.sin(a1)*r)+' A'+r+','+r+' 0 0,'+sw+' '+(X(v[0])+Math.cos(a2)*r)+','+(Y(v[1])+Math.sin(a2)*r),fill:'none','stroke-width':1.8,css:'stroke:var(--m-support)'},sv);}
      var mid=Math.atan2(Math.sin(a1)+Math.sin(a2),Math.cos(a1)+Math.cos(a2)),lt=E('text',{x:X(v[0])+Math.cos(mid)*(r+13),y:Y(v[1])+Math.sin(mid)*(r+13)+3,'text-anchor':'middle',css:'fill:var(--m-support);font:800 10px var(--nova-font-ui);paint-order:stroke;stroke:#071a28;stroke-width:3px','data-maths':o.ang===k?'ang':null},sv);lt.textContent=(o.hideAng===k?'?':G.round(a,0)+'°');
      info.push({t:(o.straight?['angle 1','angle 2'][k]:'Angle '+NAMES[[0,1,2][k]])+' = '+(o.hideAng===k?'?':G.round(a,1)+'°')+(right?' (right angle)':''),hl:o.ang===k});});
    if(o.sum)info.push({t:'Sum = '+G.round(sum,0)+'°',hl:true});}
  P.forEach(function(p,k){if(o.straight&&k===0&&o.upto>=1)return;var g=E('g',{class:'pt',tabindex:o.drag?0:-1,role:o.drag?'slider':null,'aria-label':'Point '+NAMES[k]+' at ('+p[0]+', '+p[1]+')','data-k':k},sv);E('circle',{class:'ring',cx:X(p[0]),cy:Y(p[1]),r:11,fill:'transparent',css:'stroke:transparent'},g);NOVA.plot.marker(g,X(p[0]),Y(p[1]),SH[k],5,'fill:var(--m-focus);stroke:#06111b;stroke-width:1');
    var cx=(P[0][0]+P[1][0]+P[2][0])/3,cy=(P[0][1]+P[1][1]+P[2][1])/3,dx=p[0]-cx,dy=p[1]-cy,dl=Math.hypot(dx,dy)||1,lx=X(p[0])+dx/dl*16,ly=Y(p[1])-dy/dl*16+4;var t=E('text',{x:lx,y:ly,'text-anchor':dx<-0.3*dl?'end':dx>0.3*dl?'start':'middle',css:'fill:var(--v-ink);font:800 11px var(--nova-font-ui);paint-order:stroke;stroke:#071a28;stroke-width:3px'},g);t.textContent=NAMES[k]+(o.coords?'('+p[0]+', '+p[1]+')':'');});
  if(!info.length)P.forEach(function(p,k){info.push({t:NAMES[k]+' = ('+p[0]+', '+p[1]+')'});});
  for(var q=0;q<7;q++){var it=info[q];R.appendChild(h('div',{class:it?(it.hl?'hl':''):'empty',text:it?it.t:''}));}
  w.appendChild(L);w.appendChild(R);stage.appendChild(w);return {sv:sv,X:X,Y:Y,u:u,toGrid:function(px,py){return [(px-16)/u,(H-12-py)/u];},cols:cols,rows:rows};}
var T=C.presets.scalene.pts,RT=C.presets.right.pts;
var DEMO=[{pts:T,upto:0,coords:1},{pts:T,upto:1,coords:1},{pts:T,upto:2,side:0,target:'side'},{pts:T,upto:3,ang:0,target:'ang'},{pts:T,upto:3,sum:1},{pts:RT,upto:3,ang:0},{pts:C.presets.line.pts,straight:1,upto:3,sum:1}];
var steps=[
 {name:'Snap grid',mood:'neutral',narration:'Points snap to the grid, so coordinates stay exact. A is at (1, 1), B at (8, 1), C at (3, 6).',prompt:'Where is C?'},
 {name:'Lines',mood:'think',narration:'Join the points with line segments to make triangle ABC.',prompt:'How many sides?'},
 {name:'Measure',mood:'focus',narration:'The canvas measures each side. AB runs along the grid: 7 units. The slanted sides use Pythagoras behind the scenes.',prompt:'How long is AB?',target:'side'},
 {name:'Angles',mood:'focus',narration:'Each angle is measured at its vertex and marked with an arc.',prompt:'Which angle is the largest?',target:'ang'},
 {name:'Angle sum',mood:'cheer',narration:'Add the three angles: always 180 degrees, whatever the triangle.',prompt:'What do the angles add to?'},
 {name:'Right angle',mood:'think',narration:'A right angle gets a square mark, not an arc. This is a 3, 4, 5 triangle.',prompt:'Where is the right angle?'},
 {name:'Straight line',mood:'cheer',narration:'Angles on a straight line also add to 180 degrees. Drag the points in Explore to test it.',prompt:'What do angles on a line add to?'}];
function render(i,stage){stage.innerHTML='';var s=steps[i];NOVA.cap(stage,'Geometry · '+s.name,'step '+(i+1)+'/'+steps.length);canvas(stage,DEMO[i]);NOVA.scene.helperStrip(stage,i===steps.length-1?'cheer':'explain',s.name);}
var def={id:'F0-16',title:'Geometry canvas primitive',config:C,steps:steps,render:render,
 alt:'Geometry canvas: a snap grid with triangle ABC, side lengths, angle arcs (square for right angles) and a live measurement list.',
 staticAlt:'Triangle A(1, 1), B(8, 1), C(3, 6): AB = 7, BC ≈ 7.07, CA ≈ 5.39; angles ≈ 68°, 45°, 67°, sum 180°. Right-angled 3, 4, 5 triangle with a square mark at A. Angles on a straight line add to 180°.',
 exploreIntro:'Explore: drag A, B or C (they snap to the grid), or focus a point and use the arrow keys. Lengths and angles update live.',
 explore:function(panel,stage,api){var st={pts:C.presets.scalene.pts.map(function(p){return p.slice();}),straight:false},drag=-1,cur;
   function draw(){stage.innerHTML='';NOVA.cap(stage,'Explore · drag the points','snap '+C.grid);cur=canvas(stage,{pts:st.pts,upto:3,sum:1,drag:1,coords:1,straight:st.straight,rows:st.rows});
     cur.sv.querySelectorAll('.pt').forEach(function(g){var k=+g.getAttribute('data-k');g.addEventListener('pointerdown',function(e){drag=k;try{cur.sv.setPointerCapture(e.pointerId);}catch(_){}});
       g.addEventListener('keydown',function(e){var d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[e.key];if(!d)return;e.preventDefault();move(k,[st.pts[k][0]+d[0]*C.grid,st.pts[k][1]+d[1]*C.grid]);var f=cur.sv.querySelector('.pt[data-k="'+k+'"]');if(f)f.focus();});});
     cur.sv.addEventListener('pointermove',function(e){if(drag<0)return;var pt=cur.sv.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;var q=pt.matrixTransform(cur.sv.getScreenCTM().inverse());move(drag,G.snap(cur.toGrid(q.x,q.y),C.grid),true);});
     cur.sv.addEventListener('pointerup',function(){drag=-1;});NOVA.scene.helperStrip(stage,'explain','Drag a point');}
   function move(k,p,keep){p=[Math.max(0,Math.min(cur.cols,p[0])),Math.max(0,Math.min(cur.rows,p[1]))];if(p[0]===st.pts[k][0]&&p[1]===st.pts[k][1])return;if(st.pts.some(function(q,i){return i!==k&&q[0]===p[0]&&q[1]===p[1];}))return;st.pts[k]=p;NOVA.events.emit('value',{engine:'F0-16',key:'point',name:NAMES[k],value:p});var d=drag;draw();drag=keep?d:-1;}
   var pre=h('select',{class:'nova-input','aria-label':'Shape'});Object.keys(C.presets).forEach(function(k){pre.appendChild(h('option',{value:k,text:C.presets[k].label}));});pre.onchange=function(){var q=C.presets[pre.value];st.pts=q.pts.map(function(p){return p.slice();});st.straight=!!q.straight;st.rows=q.rows;NOVA.events.emit('value',{engine:'F0-16',key:'preset',value:pre.value});draw();};
   panel.appendChild(h('label',{class:'pr-row'},['Shape ',pre]));
   panel.appendChild(h('div',{class:'pr-row'},[h('button',{class:'nova-btn primary',text:'Check: is there a right angle?',onclick:function(){var P=st.pts,a=[G.angle(P[2],P[0],P[1]),G.angle(P[0],P[1],P[2]),G.angle(P[1],P[2],P[0])],k=a.findIndex(function(x){return Math.abs(x-90)<.05;});api.check(k>=0,k>=0?'Yes: the angle at '+NAMES[k]+' is 90°.':'No right angle yet. Try making two sides run along the grid lines.',{angles:a.map(function(x){return G.round(x,1);})});}})]));
   draw();C._explore={state:st};},
 challenge:function(panel,api,stage){
   var tasks=[
    {q:'Two angles of a triangle are 45° and 68°. What is the third angle (to the nearest degree)?',build:NOVA.entryTask('angle =','F0-16'),check:function(v){var ok=v===67;return [ok,ok?'Yes: 180 − 45 − 68 = 67°.':v===113?'That is 45 + 68. Subtract it from 180.':v===247?'Angles in a triangle add to 180, not 360.':'Angles in a triangle add to 180°.'];},hint:'180 − (45 + 68).',solve:function(c){c._A.input.value='67';}},
    {q:'How long is AB? A is (2, 1) and B is (6, 1).',build:NOVA.entryTask('AB =','F0-16'),check:function(v){var ok=v===4;return [ok,ok?'Yes: both have y = 1, so count across: 6 − 2 = 4.':v===8?'That adds the x values. Find the difference.':'Count the grid squares between them.'];},hint:'Same y, so subtract the x values.',solve:function(c){c._A.input.value='4';}},
    {q:'At which vertex is the right angle?',build:NOVA.choiceTask(['A','B','C'],'F0-16'),check:function(v){var ok=v==='A';return [ok,ok?'Yes: the square mark at A shows 90°.':v?'Look for the square corner mark, not an arc.':'Pick one first.'];},hint:'A right angle is marked with a small square.',solve:function(c){c._G.set('A');}}];
   NOVA.challengeRun(panel,api,tasks,function(k){stage.innerHTML='';NOVA.cap(stage,'Challenge '+(k+1)+' of 3',['angle sum','length','right angle'][k]);
     if(k===0)canvas(stage,{pts:T,upto:3,hideAng:2});else if(k===1)canvas(stage,{pts:RT,upto:1,coords:1});else canvas(stage,{pts:RT,upto:3});NOVA.scene.helperStrip(stage,'think',['Third angle?','AB = ?','Right angle?'][k]);},C);}
};
NOVA.bankMount({id:'F0-16',num:'16',title:'Geometry canvas primitive (snap grid, points, lines, angles, measure)',def:def,linked:['F0-02','F0-04','F0-11','F0-14'],
 spec:{purpose:'A shared geometry surface: a snap grid with draggable named points, line segments, live side lengths, angle arcs with square right-angle marks, and angle sums. Used for triangles, angle facts, coordinates and Pythagoras.',
  params:'grid snap step, cols, rows, preset points, straight-line mode. Core: NOVA.geo.dist / angle / snap / round, NOVA.plot.marker shapes (circle, square, diamond per point). Year groups: KS3 Years 7–9 (12–15), with GCSE extension.',
  presets:'Scalene · Right-angled 3, 4, 5 · Isosceles · Angles on a straight line · GCSE Pythagoras 6, 8, 10',
  steps:'Snap grid → Lines → Measure → Angles → Angle sum → Right angle → Straight line. Each step has a Sir Bob line and a Guided prompt. The helper glides to the measured side and the largest angle.',
  interactions:'Watch: auto-play. Guided: step with prompts. Explore: drag points (snap) or focus a point and use arrow keys; lengths, angles and sum update live; Check for a right angle (fires correct). Challenge (3 tasks): third angle (67°); AB length (4); right-angle vertex (A). Events: value, correct, step, hintUsed.',
  traps:'Angle sum taken as 360° · Adding coordinates instead of subtracting · Right angle judged by eye not by mark · Measuring slanted sides by counting squares',
  gcse:'Extension: Pythagoras 6, 8, 10 and coordinate lengths; linked: F0-02 SVG primitives, F0-14 plotting, F0-11 marking'}});
})();
</script>
<script>
(function(){var log=document.getElementById('log');var addLog=function(e){log.textContent=new Date(e.time).toLocaleTimeString()+' '+e.type+' '+JSON.stringify(e.detail)+'\n'+log.textContent.slice(0,6000);};NOVA.events.history().forEach(addLog);NOVA.events.on('*',addLog);
document.getElementById('clearlog').onclick=function(){log.textContent='';};})();
</script>
