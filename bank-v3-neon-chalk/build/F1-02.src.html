<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA F1-02 · Zoomable number line</title>
<style>
@@CSS@@
/* ---- F1-02 local styles ---- */
.pr-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.pr-task{font:700 1.15rem var(--nova-font-chalk-write);color:#eef9ff;text-shadow:var(--nv-chalk-glow)}
.nl-strip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:6px 12px 0}
.nl-strip .k{font:700 .8rem var(--nova-font-chalk-draw);color:#cfe6ff}
.nl-strip .nv-ntile{font-size:1.2rem;min-height:40px;padding:4px 14px}
.nova-spec dd{white-space:pre-line}
.nova-stage>svg.nv-svg{display:block;width:100%;max-width:860px;height:auto;margin:4px auto 0}
.nova-stage>svg.nv-svg.nv-vert{max-width:400px}
@media print{.nova-tl,.nova-tabs,.nova-helperbar,.nova-panel{display:none!important}}
</style>
</head>
<body data-topic="number">
<div class="nova-wrap">
<header id="nova-header" data-run="F1 · Number line and scale · F1-02" data-title="Zoomable number line" data-sub="Zoom into any gap on the number line: each zoom splits one gap into ten, from ones to tenths to hundredths and thousandths."></header>
<main id="gallery"></main>
<section class="nova-card nova-logcard" aria-label="Event log">
<h2 style="font-size:1.1em">Event log (NOVA.events)</h2>
<div id="log" class="nova-log" role="log" aria-live="off"></div>
<button class="nova-btn" id="clearlog">Clear log</button>
</section>
</div>
<script>
@@JS@@
</script>
<script>
/* ===== F1-02 CONFIG: parameters + named presets ===== */
var NOVA_F1_02_CONFIG={
  startMode:'watch',
  preset:'decimals',
  presets:{
    decimals:  {label:'Ones → tenths → hundredths (3.47)',min:0,max:10,step:1,value:3.47,levels:2},
    tenths:    {label:'Ones → tenths (2.6)',min:0,max:10,step:1,value:2.6,levels:1},
    negative:  {label:'Negatives: −1 to 0 (−0.35)',min:-5,max:5,step:1,value:-0.35,levels:2},
    thousandths:{label:'GCSE: thousandths (0.125)',min:0,max:1,step:0.1,value:0.125,levels:2},
    big:       {label:'Big numbers: 0 to 1000 (470)',min:0,max:1000,step:100,value:470,levels:1}
  }
};
</script>
<script>
/* ===== F1-02 ENGINE ===== */
(function(){
var h=NOVA.h,S=NOVA.svg,U=NOVA.ui,C=NOVA_F1_02_CONFIG,P=C.presets;
function fmt(v){return S.num(Math.round(v*1e9)/1e9);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function strip(stage,items){var d=h('div',{class:'nl-strip'});items.forEach(function(it){d.appendChild(h('span',{class:'k',text:it[0]}));d.appendChild(NOVA.neonTile(String(it[1]).replace(/ /g,'\u00A0'),{role:it[2]||'result'}));});stage.appendChild(d);return d;}
/* interval at a level: level 0 = preset range; each level = the gap containing v, split into 10 */
function ranges(st,v,levels){var R=[{min:st.min,max:st.max,step:st.step}];for(var k=1;k<=levels;k++){var p=R[k-1],a=Math.floor((v-p.min)/p.step+1e-9)*p.step+p.min;if(a>=p.max)a=p.max-p.step;a=+a.toFixed(9);R.push({min:a,max:+(a+p.step).toFixed(9),step:+(p.step/10).toFixed(12)});}return R;}
/* draw stacked lines; funnel neon paths join the zoomed gap to the next line */
function zoomDraw(stage,st,v,levels,o){o=o||{};var R=ranges(st,v,levels),gap=104,H=76+gap*levels,sv=S.root(420,H,'Zoomable number line: '+R.map(function(r){return fmt(r.min)+' to '+fmt(r.max);}).join(', then ')+'. Value '+fmt(v)+'.'),axs=[];
  R.forEach(function(r,k){var y=30+k*gap,ax=S.axes(sv,{x:30,y:y,w:360,h:0,xmin:r.min,xmax:r.max,ymin:0,ymax:0,ticks:r.step,numberLine:true});axs.push(ax);
    if(k<R.length-1){var n=R[k+1],x1=ax.sx(n.min),x2=ax.sx(n.max),yb=y+40,yt=y+gap-16;NOVA.neonPath(sv,'M'+x1+','+(y+36)+' L30,'+yt,{role:'op',width:2,dash:'5 5'});NOVA.neonPath(sv,'M'+x2+','+(y+36)+' L390,'+yt,{role:'op',width:2,dash:'5 5'});
      NOVA.neonLine(sv,x1,y,x2,y,{role:'op',width:6});S.pill(sv,210,y+62,'zoom \u00D710',{role:'op',size:12});}});
  if(o.show!==false){var last=axs[axs.length-1],r=NOVA.neonRing(sv,last.sx(v),last.y0,{role:'focus',r:8,pulse:false});if(r)r.setAttribute('data-maths','pt');S.pill(sv,last.sx(v),last.y0-26,o.label||fmt(v),{role:'focus',size:13});}
  stage.appendChild(sv);return {sv:sv,ax:axs[axs.length-1],R:R};}
var D=P.decimals;
var steps=[
 {name:'Whole numbers',mood:'neutral',narration:'Here is 0 to 10. Our number, 3.47, is somewhere between 3 and 4, but at this zoom we cannot see exactly where.',prompt:'Which two whole numbers is 3.47 between?',v:3.47,L:0,o:{label:'?'},chips:[['between','3 and 4','given']]},
 {name:'Zoom to tenths',mood:'think',narration:'Zoom into the gap from 3 to 4 and split it into ten equal parts. Each line is now one tenth. 3.47 sits between 3.4 and 3.5.',prompt:'How many tenths are between 3 and 4?',v:3.47,L:1,o:{label:'?'},chips:[['each gap','0.1','op'],['between','3.4 and 3.5','given']]},
 {name:'Zoom to hundredths',mood:'focus',narration:'Zoom again: 3.4 to 3.5 splits into ten hundredths. Now we can see it exactly: 3.47.',prompt:'Count the hundredths from 3.4.',v:3.47,L:2,o:{},chips:[['each gap','0.01','op'],['value','3.47','focus']],target:'pt'},
 {name:'Times ten',mood:'think',narration:'Every zoom makes the gap ten times smaller: ones, then tenths, then hundredths. That is place value on a line.',prompt:'What is one tenth of 0.1?',v:3.47,L:2,o:{},chips:[['1','\u00F7 10 = 0.1','op'],['0.1','\u00F7 10 = 0.01','op']]},
 {name:'Negatives',mood:'focus',narration:'Zoom works below zero too. Minus 0.35 is between minus 0.4 and minus 0.3, closer to minus 0.4 than you might think? No: it is exactly halfway.',prompt:'Is −0.35 nearer −0.4 or −0.3?',st:P.negative,v:-0.35,L:2,o:{},chips:[['between','\u22120.4 and \u22120.3','given'],['halfway','yes','result']]},
 {name:'Thousandths',mood:'cheer',narration:'Start at 0 to 1 in tenths and zoom twice: 0.125 is one hundred and twenty-five thousandths.',prompt:'How many thousandths is 0.125?',st:P.thousandths,v:0.125,L:2,o:{},chips:[['each gap','0.001','op'],['value','0.125','focus']]}];
steps[4].narration='Zoom works below zero too. Minus 0.35 is between minus 0.4 and minus 0.3, exactly halfway.';
function render(i,stage){stage.innerHTML='';var s=steps[i];NOVA.cap(stage,'Zoom · '+s.name,'step '+(i+1)+'/'+steps.length);zoomDraw(stage,s.st||D,s.v,s.L,s.o);if(s.chips)strip(stage,s.chips);NOVA.scene.helperStrip(stage,i===steps.length-1?'cheer':'explain',s.name);}
var def={id:'F1-02',title:'Zoomable number line',config:C,steps:steps,render:render,
 alt:'Zoomable number line: 0 to 10, with the gap 3 to 4 zoomed into tenths and 3.4 to 3.5 zoomed into hundredths, locating 3.47.',
 staticAlt:'Three stacked number lines: 0 to 10; 3 to 4 in tenths; 3.4 to 3.5 in hundredths with 3.47 marked. Also −0.4 to −0.3 with −0.35, and 0.12 to 0.13 with 0.125.',
 exploreIntro:'Explore: pick a preset, slide the value and choose how many times to zoom. Each zoom splits one gap into ten.',
 explore:function(panel,stage,api){var st=clone(P[C.preset]),v=st.value,L=st.levels,sl,zl;
   function paint(){stage.innerHTML='';NOVA.cap(stage,'Explore · '+st.label,'zoom '+L);var r=zoomDraw(stage,st,v,L,{});var g=r.R[r.R.length-1];strip(stage,[['value',fmt(v),'focus'],['between',fmt(g.min)+' and '+fmt(g.max),'given'],['each gap',fmt(g.step),'op']]);NOVA.scene.helperStrip(stage,'explain','zoom '+L);}
   var pre=h('select',{class:'nova-input','aria-label':'Preset'});Object.keys(P).forEach(function(k){pre.appendChild(h('option',{value:k,text:P[k].label}));});pre.value=C.preset;
   var box=h('div');function build(){box.innerHTML='';var fine=st.step/100;sl=U.slider({label:'Value',min:st.min,max:st.max-fine,step:fine,value:v,engine:'F1-02',onChange:function(x){v=+(+x).toFixed(9);paint();}});box.appendChild(sl);
     zl=U.stepper({label:'Zoom',value:L,min:0,max:2,step:1,engine:'F1-02',onChange:function(x){L=x;paint();}});box.appendChild(zl);}
   pre.onchange=function(){st=clone(P[pre.value]);v=st.value;L=st.levels;build();paint();NOVA.events.emit('value',{engine:'F1-02',control:'preset',value:pre.value});};
   panel.appendChild(h('label',{class:'pr-row'},['Preset ',pre]));panel.appendChild(box);build();paint();C._explore={set:function(x){v=x;paint();},get:function(){return v;}};},
 challenge:function(panel,api,stage){
   var tasks=[
    {q:'Read the value of the ring.',build:NOVA.entryTask('Value','F1-02'),check:function(x){var ok=Math.abs(x-3.47)<1e-9;return [ok,ok?'Yes: 3.4 and 7 hundredths is 3.47.':Math.abs(x-3.7)<1e-9?'3.7 is on the tenths line. Count hundredths on the bottom line.':Math.abs(x-3.407)<1e-9?'Each gap on the bottom line is 0.01, not 0.001.':'Start at 3.4 and count the hundredths.'];},hint:'The bottom line goes from 3.4 to 3.5 in hundredths.',solve:function(c){c._A.input.value='3.47';}},
    {q:'2.68 lies between which two tenths?',build:NOVA.choiceTask(['2.6 and 2.7','2.7 and 2.8','6 and 7'],'F1-02'),check:function(x){var ok=x==='2.6 and 2.7';return [ok,ok?'Yes: 2.68 is 2.6 and 8 hundredths.':x==='2.7 and 2.8'?'2.68 is less than 2.7.':x?'Those are whole numbers; look at the tenths.':'Pick one first.'];},hint:'Zoom into 2 to 3 and find the tenths either side.',solve:function(c){c._G.set('2.6 and 2.7');}},
    {q:'How many hundredths fit in one tenth?',build:NOVA.entryTask('Hundredths','F1-02'),check:function(x){var ok=x===10;return [ok,ok?'Yes: each zoom splits one gap into ten.':x===100?'100 hundredths make one whole, not one tenth.':'Each zoom splits a gap into ten equal parts.'];},hint:'Look at how one tenth gap becomes the next line.',solve:function(c){c._A.input.value='10';}}];
   function paintC(k){stage.innerHTML='';NOVA.cap(stage,'Challenge '+(k+1)+' of 3',['read','locate','zoom'][k]);
     if(k===0){zoomDraw(stage,D,3.47,2,{label:'?'});strip(stage,[['bottom line','3.4 to 3.5','given']]);}
     else if(k===1){zoomDraw(stage,P.tenths,2.68,1,{label:'2.68'});strip(stage,[['find','the two tenths','unknown']]);}
     else{zoomDraw(stage,D,3.47,2,{show:false});strip(stage,[['one tenth','= ? hundredths','unknown']]);}
     NOVA.scene.helperStrip(stage,'think',['Read it','Which tenths?','How many?'][k]);}
   NOVA.challengeRun(panel,api,tasks,paintC,C);}
};
NOVA.bankMount({id:'F1-02',num:'F1·02',title:'Zoomable number line',def:def,linked:['F1-01','F1-03','F1-05','F1-10','F2-01','F0-04','F0-12'],
 spec:{purpose:'Shows place value on a line: zoom into the gap that holds a number and split it into ten, so ones become tenths, then hundredths and thousandths. Used to locate, read and round decimals and to explain scaling by powers of ten.',
  params:'min, max, step (level-0 gap), value, levels (0–2 zooms). Each zoom divides the gap by 10. Core: NOVA.svg.axes({numberLine}), NOVA.neonPath (dashed funnels), neonLine, neonRing, neonTile, NOVA.ui.slider / stepper. Year groups: KS3 Years 7–9 (12–15), with GCSE extension.',
  presets:'Ones → tenths → hundredths (3.47) · Ones → tenths (2.6) · Negatives −0.35 · GCSE thousandths 0.125 · Big numbers 0–1000 (470)',
  steps:'Whole numbers → Zoom to tenths → Zoom to hundredths → Times ten → Negatives → Thousandths. Each step has a Sir Bob line and a Guided prompt; the helper points to the located value.',
  interactions:'Watch: auto-play. Guided: step with prompts. Explore: preset, value slider, zoom stepper (0–2). Challenge (3 tasks): read 3.47; choose the tenths either side of 2.68; how many hundredths in a tenth. Events: value, correct, step, hintUsed.',
  traps:'Reading 3.47 as 3.7 · Thinking the hundredths gap is 0.001 · Believing 2.68 > 2.7 because 68 > 7 · Thinking 100 hundredths make a tenth',
  gcse:'Extension: thousandths and negative decimals for bounds and error intervals; linked: F1-05 rounding, F1-10 powers-of-ten zoom, F1-11 error intervals'}});
var log=document.getElementById('log');var addLog=function(e){log.textContent=new Date(e.time).toLocaleTimeString()+' '+e.type+' '+JSON.stringify(e.detail)+'\n'+log.textContent.slice(0,6000);};NOVA.events.history().forEach(addLog);NOVA.events.on('*',addLog);
document.getElementById('clearlog').onclick=function(){log.textContent='';};
})();
</script>
</body>
</html>
