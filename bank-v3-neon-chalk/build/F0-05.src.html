<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA F0-05 · Maths text renderer (fractions, powers, roots, surds, standard form)</title>
<style>
@@CSS@@
/* ---- F0-05 local styles ---- */
.pr-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.pr-task{font-weight:700}
.mt5-box{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 12px 4px;text-align:center}
.mt5-big{font-size:clamp(1.6rem,5.5vw,2.6rem)}
.mt5-line{display:flex;flex-wrap:wrap;justify-content:center;gap:.4em .8em}
.mt5-say{font:600 .82rem var(--nova-font-ui);color:var(--v-muted);max-width:36em}
.mt5-say b{color:var(--v-ink)}
.mt5-src{font:600 .75rem var(--nova-font-mono,monospace);color:var(--v-muted);background:color-mix(in srgb,var(--v-panel2) 80%,transparent);border:1px solid var(--v-line);border-radius:8px;padding:2px 8px;max-width:100%;overflow-wrap:anywhere}
.mt5-note{font:700 .8rem var(--nova-font-ui);color:var(--v-ink);padding:2px 10px;border-radius:999px;border:1px dashed var(--m-error)}
.mt5-note::before{content:'\2716  ';color:var(--m-error)}
.nova-panel textarea{width:100%;min-height:60px;font:600 .9rem var(--nova-font-mono,monospace);background:var(--v-panel2);color:var(--v-ink);border:1px solid var(--v-line);border-radius:10px;padding:8px;box-sizing:border-box}
.mt5-opts{display:flex;flex-wrap:wrap;gap:8px}
.mt5-opts button{font-size:1.4rem;min-width:90px}
.mt5-opts button[aria-pressed="true"]{outline:3px solid var(--m-focus)}
.mt5-preview{padding:8px;border:1px solid var(--v-line);border-radius:10px;min-height:48px;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.nova-spec dd{white-space:pre-line}
@media print{.nova-tl,.nova-tabs,.nova-helperbar,.nova-panel{display:none!important}}
</style>
</head>
<body data-topic="algebra">
<div class="nova-wrap">
<header id="nova-header" data-run="F0 · Bank · F0-05" data-title="Maths text renderer" data-sub="Fractions, powers, roots, surds and standard form, typeset properly and read aloud correctly, from one tiny markup every NOVA engine shares."></header>
<main id="gallery"></main>
<section class="nova-card nova-logcard" aria-label="Event log">
<h2 style="font-size:1.1em">Event log (NOVA.events)</h2>
<div id="log" class="nova-log" role="log" aria-live="off"></div>
<button class="nova-btn" id="clearlog">Clear log</button>
</section>
</div>
<script>
@@JS@@
</script>
<script>
/* ===== F0-05 CONFIG: parameters + named presets ===== */
var NOVA_F0_05_CONFIG={
  startMode:'watch',
  size:1,                     /* render scale 0.6-2 */
  markup:'\\frac{3}{4}+\\frac{1}{4}=1',
  presets:{
    fraction: {label:'Fractions  3/4 + 1/4',markup:'\\r{given}{\\frac{3}{4}}+\\r{given}{\\frac{1}{4}}=\\r{result}{1}'},
    mixed:    {label:'Mixed number  2 1/3 = 7/3',markup:'\\mixed{2}{1}{3}=\\frac{7}{3}'},
    power:    {label:'Powers  2^3 = 8',markup:'2^{3}=2\\times2\\times2=8'},
    algebra:  {label:'Algebra  (x^2)^3 = x^6',markup:'(x^{2})^{3}=x^{6}'},
    root:     {label:'Roots  √49, ∛27',markup:'\\sqrt{49}=7,\\ \\sqrt[3]{27}=3'},
    surd:     {label:'Surds  √12 = 2√3',markup:'\\sqrt{12}=\\sqrt{4}\\times\\sqrt{3}=\\r{result}{2\\sqrt{3}}'},
    sform:    {label:'Standard form  32 000',markup:'32000=\\r{result}{\\sf{3.2}{4}}'},
    small:    {label:'GCSE: small numbers  0.00056',markup:'0.00056=\\sf{5.6}{-4}'},
    rational: {label:'GCSE: rationalise  1/√2',markup:'\\frac{1}{\\sqrt{2}}=\\frac{\\sqrt{2}}{2}'}
  }
};
</script>
<script>
/* ===== F0-05 ENGINE ===== */
(function(){
var h=NOVA.h,M=NOVA.mt,C=NOVA_F0_05_CONFIG,G=document.getElementById('gallery'),P=C.presets;
function cap(stage,left,tag){stage.appendChild(h('div',{class:'nv-cap'},[h('span',{text:left}),tag?h('span',{class:'tag',text:tag}):null]));}
/* show(stage, lines[], note): typeset each markup line large, with the spoken reading and the source */
function show(stage,lines,note,size){var box=h('div',{class:'mt5-box'}),big=h('div',{class:'mt5-line mt5-big'});if(size)big.style.fontSize='calc(clamp(1.6rem,5.5vw,2.6rem)*'+size+')';
  lines.forEach(function(l){big.appendChild(M.render(l));});box.appendChild(big);
  box.appendChild(h('div',{class:'mt5-say'},[h('b',{text:'Read aloud: '}),lines.map(M.speak).join('; ')]));
  box.appendChild(h('code',{class:'mt5-src',text:lines.join('   ')}));if(note)box.appendChild(h('div',{class:'mt5-note',text:note}));stage.appendChild(box);return box;}
var steps=[
 {name:'Fractions',mood:'neutral',narration:'A fraction is stacked: numerator over a bar over denominator. Three quarters plus one quarter is one whole.',prompt:'Read it aloud: what is on top, what is underneath?',lines:[P.fraction.markup],note:'Not 3/4 + 1/4 = 4/8: add the tops, keep the bottom.'},
 {name:'Mixed numbers',mood:'think',narration:'Two and one third: the whole number sits beside the fraction. As an improper fraction it is seven thirds.',prompt:'How many thirds are in 2 wholes?',lines:[P.mixed.markup],note:'2 1/3 is not 2 × 1/3.'},
 {name:'Powers',mood:'think',narration:'The small raised 3 is a power: 2 cubed means three 2s multiplied, which is 8.',prompt:'Is 2 cubed the same as 2 times 3?',lines:[P.power.markup],note:'2³ is not 2 × 3 = 6.'},
 {name:'Roots',mood:'focus',narration:'The root sign has a bar over everything inside it. The square root of 49 is 7; the cube root of 27 is 3.',prompt:'What number times itself makes 49?',lines:[P.root.markup]},
 {name:'Surds',mood:'focus',narration:'A surd is a root left exact. Root 12 is root 4 times root 3, and root 4 is 2, so it simplifies to 2 root 3.',prompt:'Which square number goes into 12?',lines:[P.surd.markup],note:'√12 is not 6: halving is not square rooting.',target:'result'},
 {name:'Standard form',mood:'focus',narration:'Standard form is a number from 1 up to 10, times a power of ten. 32 000 is 3.2 times 10 to the power 4.',prompt:'How many places does the point move?',lines:[P.sform.markup,P.small.markup],note:'32 × 10³ is not standard form: 32 is not less than 10.',target:'result'},
 {name:'All together',mood:'cheer',narration:'One markup for every engine: it looks right, and a screen reader says it right.',prompt:'Which one would you read aloud as “x to the power 6”?',lines:[P.algebra.markup,P.rational.markup]}];
function render(i,stage){stage.innerHTML='';var s=steps[i];cap(stage,'Maths text · '+s.name,'step '+(i+1)+'/'+steps.length);show(stage,s.lines,s.note,C.size);NOVA.scene.helperStrip(stage,i===steps.length-1?'cheer':'explain',s.name);}
NOVA.events.on('step',function(e){var d=e.detail||{};if(d.engine!=='F0-05')return;var s=steps[d.index];if(!s||!s.target)return;setTimeout(function(){var st=document.querySelector('#F0-05 .nova-stage'),t=st&&st.querySelector('.mt-role[data-role='+s.target+']');if(t)NOVA.scene.pointTo(st,t);},350);});
var def={id:'F0-05',title:'Maths text renderer',config:C,steps:steps,render:render,
 alt:'Maths text renderer: fractions, mixed numbers, powers, roots, surds and standard form typeset in large maths type with a spoken reading.',
 staticAlt:'3/4 + 1/4 = 1 as stacked fractions; 2 1/3 = 7/3; 2³ = 2 × 2 × 2 = 8; √49 = 7 and ∛27 = 3; √12 = √4 × √3 = 2√3; 32 000 = 3.2 × 10⁴ and 0.00056 = 5.6 × 10⁻⁴.',
 exploreIntro:'Explore: type markup and watch it typeset and read aloud, convert to standard form, and simplify a surd.',
 explore:function(panel,stage,api){var src=C.markup,size=C.size,sfx='45000',sn=12;
   function draw(){stage.innerHTML='';cap(stage,'Explore · live','size '+size.toFixed(1)+'×');var sfo=M.sf(+sfx),su=M.surd(sn),lines=[src];
     if(isFinite(+sfx)&&sfx!=='')lines.push(sfx+'='+sfo.src);if(su)lines.push('\\sqrt{'+sn+'}='+su.src);show(stage,lines,null,size);NOVA.scene.helperStrip(stage,'explain','Live preview');}
   function emit(k,v){NOVA.events.emit('value',{engine:'F0-05',control:k,value:v});}
   var ta=h('textarea',{'aria-label':'Maths markup'});ta.value=src;ta.oninput=function(){src=ta.value;draw();emit('markup',src);};
   var pre=h('select',{class:'nova-input','aria-label':'Preset'});Object.keys(P).forEach(function(k){pre.appendChild(h('option',{value:k,text:P[k].label}));});pre.onchange=function(){src=ta.value=P[pre.value].markup;draw();emit('preset',pre.value);};
   var sl=NOVA.ui.slider({label:'Size',min:.6,max:2,step:.1,value:size,engine:'F0-05',onChange:function(v){size=v;draw();}});
   var nf=NOVA.ui.entry({label:'Number to standard form',engine:'F0-05'});nf.input.value=sfx;nf.input.oninput=function(){sfx=nf.input.value.replace(/[\s,]/g,'');draw();};
   var sp=NOVA.ui.stepper({label:'Simplify √',value:sn,min:2,max:200,step:1,engine:'F0-05',onChange:function(v){sn=v;draw();}});
   panel.appendChild(h('label',{class:'pr-row'},['Preset ',pre]));panel.appendChild(ta);
   panel.appendChild(h('p',{class:'mt5-say',text:'Markup: \\frac{a}{b}  \\mixed{w}{a}{b}  x^{n}  \\sqrt{x}  \\sqrt[3]{x}  \\sf{m}{e}  \\r{result}{…}  \\times \\div \\pm \\pi'}));
   panel.appendChild(sl);panel.appendChild(nf);panel.appendChild(sp);draw();C._explore={set:function(t){src=ta.value=t;draw();}};},
 challenge:function(panel,api,stage){var k=0,pick=null;
   var T=[{q:'Write 45 000 in standard form: fill in A × 10^n.',kind:'sform'},{q:'Simplify √50 into the form a√b.',kind:'surd'},{q:'Which one means 2 cubed?',kind:'pick'}];
   var qp=h('p',{class:'pr-task'}),ctl=h('div'),A,B;
   function draw(lines){stage.innerHTML='';cap(stage,'Challenge '+(k+1)+' of 3',T[k].kind);show(stage,lines||[k===0?'45000=\\r{unknown}{A}\\times10^{\\r{unknown}{n}}':k===1?'\\sqrt{50}=\\r{unknown}{a}\\sqrt{\\r{unknown}{b}}':'2^{3}\\ ?'],null,1);NOVA.scene.helperStrip(stage,'think',T[k].q.split(':')[0].split('.')[0]);}
   function load(){qp.textContent=T[k].q;ctl.innerHTML='';pick=null;
     if(k<2){A=NOVA.ui.entry({label:k===0?'A':'a',engine:'F0-05'});B=NOVA.ui.entry({label:k===0?'n':'b',engine:'F0-05'});ctl.appendChild(h('div',{class:'pr-row'},[A,B]));}
     else{var o=h('div',{class:'mt5-opts',role:'group','aria-label':'Options'});['2^{3}','2\\times3','3^{2}','\\sqrt[3]{2}'].forEach(function(m){var b=h('button',{class:'nova-btn','aria-pressed':'false'});b.appendChild(M.render(m));b.onclick=function(){o.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed','false');});b.setAttribute('aria-pressed','true');pick=m;NOVA.events.emit('value',{engine:'F0-05',control:'pick',value:m});};o.appendChild(b);});ctl.appendChild(o);}draw();}
   function check(){var a=NOVA.ui.parseNum(A&&A.get()),b=NOVA.ui.parseNum(B&&B.get());
     if(k===0){var ok=a===4.5&&b===4;return [ok,ok?'Yes: 4.5 × 10⁴.':a===45&&b===3?'45 × 10³ is equal, but not standard form: the first number must be from 1 to less than 10.':a===4.5&&b===-4?'Big numbers get a positive power: 45 000 is bigger than 1.':a===4.5?'Count the places the point moves: 45 000 → 4.5 is 4 places.':'Make the first number 4.5, then count the places.',ok?['45000=\\r{result}{\\sf{4.5}{4}}']:null];}
     if(k===1){var ok2=a===5&&b===2;return [ok2,ok2?'Yes: √50 = √25 × √2 = 5√2.':a===25&&b===2?'25 is the square number inside; its root, 5, comes out.':a===2&&b===25?'Swapped: the number outside is the root of 25.':a*a*b===50?'Equal, but not fully simplified: use the biggest square factor, 25.':'Find the biggest square number that divides 50.',ok2?['\\sqrt{50}=\\sqrt{25}\\times\\sqrt{2}=\\r{result}{5\\sqrt{2}}']:null];}
     var ok3=pick==='2^{3}';return [ok3,ok3?'Yes: 2³ = 2 × 2 × 2 = 8.':pick==='2\\times3'?'That is 2 × 3 = 6. A power means repeated multiplying.':pick==='3^{2}'?'That is 3 squared = 9. The base is 2, the power is 3.':pick?'That is the cube root of 2, the opposite of cubing.':'Pick one of the options first.',ok3?['2^{3}=2\\times2\\times2=\\r{result}{8}']:null];}
   panel.appendChild(qp);panel.appendChild(ctl);
   panel.appendChild(h('div',{class:'pr-row'},[h('button',{class:'nova-btn primary',text:'Check',onclick:function(){var r=check();if(r[2])draw(r[2]);api.check(r[0],r[1]+(r[0]&&k<2?' Next task.':''),{task:k});if(r[0]&&k<2){var tm=setTimeout(function(){k++;load();},900);api.onCleanup(function(){clearTimeout(tm);});}}}),
     h('button',{class:'nova-btn ghost',text:'Hint',onclick:function(){api.hint(['Move the point until the number is between 1 and 10: 4.5. How many places did it move?','50 = 25 × 2, and 25 is a square number.','A power multiplies the base by itself: 2 × 2 × 2.'][k]);}})]));
   C._challenge={solve:function(){if(k<2){A.input.value=k===0?'4.5':'5';B.input.value=k===0?'4':'2';}else pick='2^{3}';}};load();}
};
var card=h('section',{class:'nova-card nova-engine',id:'F0-05','aria-labelledby':'F0-05-h'},[h('h2',{id:'F0-05-h',class:'nova-eh'},[h('span',{class:'nova-id',text:'05'}),h('span',{text:'Maths text renderer (fractions, powers, roots, surds, standard form)'})])]);
var spec={purpose:'Typesets maths properly and reads it aloud correctly: stacked fractions, mixed numbers, powers, roots with a bar, surds and standard form, from one small markup. Every engine uses it for labels, working and answers, so pupils always see the notation the way exams print it.',
 params:'markup (\\frac \\mixed ^ _ \\sqrt \\sqrt[n] \\sf \\r{role} \\times \\div \\pm \\pi \\le \\ge \\ne \\approx); size 0.6–2. Core: NOVA.mt.render / html / speak / parse, NOVA.mt.sf(x) (standard form), NOVA.mt.surd(n) (simplest a√b). Year groups: KS3 Years 7–9 (12–15), with GCSE extension.',
 presets:'fraction · mixed · power · algebra (x²)³ · root √49, ∛27 · surd √12 · standard form 32 000 · GCSE small 0.00056 · GCSE rationalise 1/√2',
 steps:'Fractions → Mixed numbers → Powers → Roots → Surds → Standard form → All together. Each step has a Sir Bob Maximus line, a Guided prompt, a spoken reading, the source markup and a misconception note. On Surds and Standard form the helper glides to point at the result.',
 interactions:'Watch: auto-play. Guided: step with prompts. Explore: type markup with a live preview and reading, presets, size slider, a number-to-standard-form converter and a √n simplifier. Challenge (3 tasks): 45 000 in standard form (4.5 × 10⁴); simplify √50 (5√2); pick which one is 2³. Events: value, correct, step, hintUsed.',
 traps:'32 × 10³ given as standard form · Positive vs negative power for small numbers · √12 read as 6 · Not using the biggest square factor (√50 = √25 × √2) · 2³ read as 2 × 3 · 2 1/3 read as 2 × 1/3 · Adding denominators',
 gcse:'Extension: negative powers and small numbers, rationalising denominators, cube roots, algebraic powers; linked: F0-01 tokens, F0-02 labels, F0-04 entry (parseNum), F0-11 assessment, F0-13 worked examples, F0-17 print'};
card.appendChild(NOVA.specCard(spec));
card.appendChild(h('p',{class:'purpose',style:'margin:6px 0 0'},[h('strong',{text:'Year groups: '}),'KS3 Years 7–9 (12–15). ',h('strong',{text:'Linked components: '}),'F0-01, F0-02, F0-04, F0-11, F0-13, F0-17.']));
var demo=h('div',{'aria-label':'Maths text renderer live demo'});card.appendChild(h('h3',{text:'Live demo · F0-05'}));card.appendChild(demo);G.appendChild(card);
window.F0_05=NOVA.mountEngine(demo,def);
var log=document.getElementById('log');var addLog=function(e){log.textContent=new Date(e.time).toLocaleTimeString()+' '+e.type+' '+JSON.stringify(e.detail)+'\n'+log.textContent.slice(0,6000);};NOVA.events.history().forEach(addLog);NOVA.events.on('*',addLog);
document.getElementById('clearlog').onclick=function(){log.textContent='';};
})();
</script>
</body>
</html>
