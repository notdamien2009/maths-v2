<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA F1-01 · Configurable number line</title>
<style>
@@CSS@@
/* ---- F1-01 local styles ---- */
.pr-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.pr-task{font:700 1.15rem var(--nova-font-chalk-write);color:#eef9ff;text-shadow:var(--nv-chalk-glow)}
.nl-strip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:6px 12px 0}
.nl-strip .k{font:700 .8rem var(--nova-font-chalk-draw);color:#cfe6ff}
.nl-strip .nv-ntile{font-size:1.2rem;min-height:40px;padding:4px 14px}
.nova-spec dd{white-space:pre-line}
.nova-stage>svg.nv-svg{display:block;width:100%;max-width:860px;height:auto;margin:4px auto 0}
.nova-stage>svg.nv-svg.nv-vert{max-width:400px}
@media print{.nova-tl,.nova-tabs,.nova-helperbar,.nova-panel{display:none!important}}
</style>
</head>
<body data-topic="number">
<div class="nova-wrap">
<header id="nova-header" data-run="F1 · Number line and scale · F1-01" data-title="Configurable number line" data-sub="One number line for integers, negatives, decimals and big numbers, with a vertical thermometer and a two-line comparer as presets."></header>
<main id="gallery"></main>
<section class="nova-card nova-logcard" aria-label="Event log">
<h2 style="font-size:1.1em">Event log (NOVA.events)</h2>
<div id="log" class="nova-log" role="log" aria-live="off"></div>
<button class="nova-btn" id="clearlog">Clear log</button>
</section>
</div>
<script>
@@JS@@
</script>
<script>
/* ===== F1-01 CONFIG: parameters + named presets ===== */
var NOVA_F1_01_CONFIG={
  startMode:'watch',
  preset:'integers',
  presets:{
    integers:  {label:'Integers 0 to 10',kind:'line',min:0,max:10,step:1,labelStep:1,value:7},
    negatives: {label:'Directed numbers −10 to 10',kind:'line',min:-10,max:10,step:1,labelStep:2,value:-4},
    tenths:    {label:'Decimals: tenths 0 to 1',kind:'line',min:0,max:1,step:0.1,labelStep:0.1,value:0.6},
    hundredths:{label:'Decimals: hundredths 2.3 to 2.4',kind:'line',min:2.3,max:2.4,step:0.01,labelStep:0.02,value:2.37},
    thousands: {label:'GCSE: thousands 0 to 10 000',kind:'line',min:0,max:10000,step:250,labelStep:2000,value:6750},
    thermometer:{label:'Thermometer −20 °C to 40 °C (F1-04)',kind:'vertical',min:-20,max:40,step:1,labelStep:10,value:-5,unit:'°C'},
    comparer:  {label:'Comparer: two values (F1-12)',kind:'compare',min:-10,max:10,step:1,labelStep:2,value:-6,value2:-2},
    fractions: {label:'Fractions on a line (F5-04, design TBD)',kind:'tbd',min:0,max:2,step:0.25,labelStep:1,value:0.75}
  }
};
</script>
<script>
/* ===== F1-01 ENGINE ===== */
(function(){
var h=NOVA.h,S=NOVA.svg,U=NOVA.ui,C=NOVA_F1_01_CONFIG,P=C.presets;
function fmt(v){return S.num(Math.round(v*1e6)/1e6);}
function fmtU(v,st){return fmt(v)+(st.unit?' '+st.unit:'');}
function clone(o){return JSON.parse(JSON.stringify(o));}
/* horizontal line: core axes numberLine draws a straight neon line at every labelled digit */
function hline(sv,st,y,x,w){return S.axes(sv,{x:x||28,y:y,w:w||304,h:0,xmin:st.min,xmax:st.max,ymin:0,ymax:0,ticks:st.labelStep,numberLine:true});}
function mark(sv,ax,v,role,label,hi,tag){var g=NOVA.neonRing(sv,ax.sx(v),ax.y0,{role:role,r:8,pulse:false});if(label)S.pill(sv,ax.sx(v),ax.y0-(hi?52:28),label,{role:role,size:13});if(tag&&g)g.setAttribute('data-maths',tag);return g;}
function strip(stage,items){var d=h('div',{class:'nl-strip'});items.forEach(function(it){d.appendChild(h('span',{class:'k',text:it[0]}));d.appendChild(NOVA.neonTile(String(it[1]).replace(/ /g,'\u00A0'),{role:it[2]||'result'}));});stage.appendChild(d);return d;}
/* vertical thermometer (F1-04 preset), drawn from neon core helpers only */
function vline(stage,st,v,o){o=o||{};var W=260,H=250,sv=S.root(W,H,'Vertical scale '+fmtU(st.min,st)+' to '+fmtU(st.max,st)+', reading '+fmtU(v,st)+'.'),x=90,top=18,bot=200;
  function sy(t){return bot-(t-st.min)/(st.max-st.min)*(bot-top);}
  NOVA.neonBox(sv,x-11,top-10,22,bot-top+14,{role:'given',r:11});
  for(var t=st.min;t<=st.max+1e-9;t+=st.labelStep){NOVA.neonLine(sv,x-22,sy(t),x+22,sy(t),{role:'given',width:2});NOVA.chalkText(sv,x-46,sy(t)+6,fmt(t),{size:17});}
  NOVA.neonLine(sv,x,bot+14,x,sy(v),{role:'error',width:8});NOVA.neonRing(sv,x,bot+30,{role:'error',r:16,pulse:false});
  if(o.from!=null){var a=NOVA.svg.arrow?null:null;NOVA.neonPath(sv,'M'+(x+40)+','+sy(o.from)+' C'+(x+90)+','+sy(o.from)+' '+(x+90)+','+sy(v)+' '+(x+40)+','+sy(v),{role:'op',width:3});S.pill(sv,x+122,(sy(o.from)+sy(v))/2+4,(v-o.from>0?'+':'\u2212')+fmt(Math.abs(v-o.from))+(st.unit?' '+st.unit:''),{role:'op',size:13});}
  var r=NOVA.neonRing(sv,x+30,sy(v),{role:'focus',r:7,pulse:false});if(r)r.setAttribute('data-maths','temp');S.pill(sv,x+66,sy(v)-(o.from!=null?26:22),fmtU(v,st),{role:'focus',size:13});
  sv.classList.add('nv-vert');stage.appendChild(sv);return sv;}
/* main drawer for one state */
function draw(stage,st,o){o=o||{};var sv,ax;
  if(st.kind==='vertical'){vline(stage,st,st.value,o);strip(stage,[['reads',fmtU(st.value,st),'focus']].concat(o.from!=null?[['change',(st.value-o.from>0?'+':'\u2212')+fmt(Math.abs(st.value-o.from)),'op']]:[]));return null;}
  if(st.kind==='compare'){sv=S.root(360,190,'Two number lines comparing '+fmt(st.value)+' and '+fmt(st.value2)+'.');var a1=hline(sv,st,64),a2=hline(sv,st,160);
    mark(sv,a1,st.value,'focus','A = '+fmt(st.value),false,'a');mark(sv,a2,st.value2,'result','B = '+fmt(st.value2),false,'b');
    stage.appendChild(sv);var sg=st.value<st.value2?'<':st.value>st.value2?'>':'=';strip(stage,[['compare',fmt(st.value)+' '+sg+' '+fmt(st.value2),'result'],['further right is bigger','\u2192','op']]);return {sv:sv,ax:a1};}
  sv=S.root(360,130,'Number line '+fmt(st.min)+' to '+fmt(st.max)+'.');ax=hline(sv,st,84);
  if(st.kind==='tbd'){var g=S.el('g',{class:'nv-frac-tbd-g'},sv);NOVA.chalkText(sv,180,30,'fraction design TBD',{size:13});}
  (o.pts||[]).forEach(function(p){mark(sv,ax,p.v,p.role||'focus',p.label,p.hi,p.tag);});
  if(o.hop){S.hop(sv,ax.sx(o.hop[0]),ax.sx(o.hop[1]),ax.y0-6,{role:'op',label:(o.hop[1]>o.hop[0]?'+':'\u2212')+fmt(Math.abs(o.hop[1]-o.hop[0])),height:34});}
  stage.appendChild(sv);return {sv:sv,ax:ax};}
function neighbours(st,v){var a=Math.floor(v/st.labelStep+1e-9)*st.labelStep,b=a+st.labelStep;if(Math.abs(v-a)<1e-9)return null;return [fmt(a),fmt(b)];}
var steps=[
 {name:'Build the line',mood:'neutral',narration:'A number line is a ruler for numbers: equal gaps, every whole number gets its own line, and it keeps going both ways.',prompt:'Are the gaps between the numbers equal?',st:P.integers,o:{pts:[]},chips:[['from','0','given'],['to','10','given'],['gap','1','op']]},
 {name:'Place a point',mood:'focus',narration:'Seven is seven equal steps from zero. The ring marks exactly where it sits.',prompt:'How many steps from 0 to 7?',st:P.integers,o:{pts:[{v:7,role:'focus',label:'7',tag:'pt'}],hop:[0,7]},chips:[['value','7','focus'],['between','6 and 8','given']],target:'pt'},
 {name:'Negatives',mood:'think',narration:'To the left of zero the numbers are negative. Minus four is four steps left of zero, so it is smaller than minus one.',prompt:'Which is smaller: −4 or −1?',st:P.negatives,o:{pts:[{v:-4,role:'focus',label:'\u22124',tag:'pt'},{v:-1,role:'result',label:'\u22121',hi:true}]},chips:[['order','\u22124 < \u22121','result']],target:'pt'},
 {name:'Decimals',mood:'think',narration:'Zoom into 0 to 1 and split it into ten equal parts. Each line is one tenth, so the ring is at 0.6.',prompt:'How many tenths is 0.6?',st:P.tenths,o:{pts:[{v:.6,role:'focus',label:'0.6',tag:'pt'}]},chips:[['value','0.6','focus'],['tenths','6','op']],target:'pt'},
 {name:'Compare',mood:'focus',narration:'Two lines, one scale. Minus six is further left than minus two, so minus six is less than minus two.',prompt:'Is −6 bigger or smaller than −2?',st:P.comparer,o:{}},
 {name:'Thermometer',mood:'think',narration:'Stand the line up and it becomes a thermometer. From minus five degrees, a rise of eight takes us to three degrees.',prompt:'What is −5 °C plus 8 degrees?',st:Object.assign(clone(P.thermometer),{value:3}),o:{from:-5}},
 {name:'Big numbers',mood:'cheer',narration:'The same line works for thousands. Each line is two thousand, so this point is six thousand seven hundred and fifty.',prompt:'Is 6750 nearer 6000 or 8000?',st:P.thousands,o:{pts:[{v:6750,role:'focus',label:'6750',tag:'pt'}]},chips:[['between','6000 and 8000','given'],['nearer','6000','result']]}];
function render(i,stage){stage.innerHTML='';var s=steps[i];NOVA.cap(stage,'Number line · '+s.name,'step '+(i+1)+'/'+steps.length);var r=draw(stage,s.st,s.o);if(s.chips)strip(stage,s.chips);NOVA.scene.helperStrip(stage,i===steps.length-1?'cheer':'explain',s.name);}
var def={id:'F1-01',title:'Configurable number line',config:C,steps:steps,render:render,
 alt:'Configurable number line: equal steps with a line at every labelled number, points marked with neon rings, negatives, decimals, a two-line comparer and a vertical thermometer.',
 staticAlt:'Number line 0 to 10 with 7 marked; −10 to 10 with −4 and −1; 0 to 1 in tenths with 0.6; comparer −6 < −2; thermometer −5 °C rising 8 to 3 °C; 0 to 10 000 with 6750 between 6000 and 8000.',
 exploreIntro:'Explore: pick a preset, then drag the ring, use the slider or the stepper. The chips show the value and its neighbours.',
 explore:function(panel,stage,api){var st=clone(P[C.preset]),key=C.preset,sl,sp;
   function paint(){stage.innerHTML='';NOVA.cap(stage,'Explore · '+st.label,fmtU(st.value,st));var r=draw(stage,st,{pts:st.kind==='line'||st.kind==='tbd'?[]:[]});
     if(r&&st.kind!=='compare')U.dragSnap(r.sv,r.ax,{y:r.ax.y0,value:st.value,min:st.min,max:st.max,step:st.step,role:'focus',label:'Value marker',engine:'F1-01',onChange:function(x){set(x,'drag');}});
     if(st.kind!=='vertical'&&st.kind!=='compare'){var nb=neighbours(st,st.value);strip(stage,[['value',fmtU(st.value,st),'focus']].concat(nb?[['between',nb[0]+' and '+nb[1],'given']]:[['on a labelled line','yes','result']]));}
     NOVA.scene.helperStrip(stage,'explain',fmtU(st.value,st));}
   function set(x,src){st.value=+(+x).toFixed(6);if(src!=='slider'&&sl)sl.input.value=st.value;if(sl)sl.querySelector('output').textContent=fmt(st.value);if(src==='drag'){var t=stage.querySelector('.nv-cap .tag');if(t)t.textContent=fmtU(st.value,st);var ch=stage.querySelectorAll('.nl-strip .nv-ntile');if(ch[0])ch[0].textContent=fmtU(st.value,st);var nb=neighbours(st,st.value);if(ch[1])ch[1].textContent=nb?nb[0]+' and '+nb[1]:'yes';}else paint();}
   var pre=h('select',{class:'nova-input','aria-label':'Preset'});Object.keys(P).forEach(function(k){pre.appendChild(h('option',{value:k,text:P[k].label}));});pre.value=key;
   var box=h('div');function build(){box.innerHTML='';sl=U.slider({label:st.kind==='compare'?'A':'Value',min:st.min,max:st.max,step:st.step,value:st.value,engine:'F1-01',onChange:function(x){set(x,'slider');}});box.appendChild(sl);
     sp=h('div',{class:'nova-row',role:'group','aria-label':'Stepper'},['Step ',h('button',{class:'nova-btn','aria-label':'Down one step',text:'\u2212',onclick:function(){set(NOVA.clamp(st.value-st.step,st.min,st.max),'stepper');NOVA.events.emit('value',{engine:'F1-01',control:'stepper',value:st.value});}}),h('button',{class:'nova-btn','aria-label':'Up one step',text:'+',onclick:function(){set(NOVA.clamp(st.value+st.step,st.min,st.max),'stepper');NOVA.events.emit('value',{engine:'F1-01',control:'stepper',value:st.value});}})]);box.appendChild(sp);
     if(st.kind==='compare'){box.appendChild(U.slider({label:'B',min:st.min,max:st.max,step:st.step,value:st.value2,engine:'F1-01',onChange:function(x){st.value2=x;paint();}}));}}
   pre.onchange=function(){key=pre.value;st=clone(P[key]);build();paint();NOVA.events.emit('value',{engine:'F1-01',control:'preset',value:key});};
   panel.appendChild(h('label',{class:'pr-row'},['Preset ',pre]));panel.appendChild(box);build();paint();C._explore={set:function(x){set(x,'api');},get:function(){return st.value;}};},
 challenge:function(panel,api,stage){var v=0,stN=clone(P.negatives),stT=clone(P.tenths);
   var tasks=[
    {q:'Drag the ring to −3.',build:function(ctl){ctl._v=function(){return v;};return function(){return v;};},check:function(x){var ok=x===-3;return [ok,ok?'Yes: three steps left of zero.':x===3?'That is +3. Negatives are to the LEFT of zero.':'Count three steps left from 0.'];},hint:'Start at 0 and move three lines to the left.',solve:function(){v=-3;paintC(0);}},
    {q:'What number is the ring on? (tenths line)',build:NOVA.entryTask('Value','F1-01'),check:function(x){var ok=Math.abs(x-0.7)<1e-9;return [ok,ok?'Yes: seven tenths, 0.7.':x===7?'Each line is one tenth, so 7 lines is 0.7, not 7.':x===0.07?'That is seven hundredths. Each gap here is a tenth.':'Count the tenths from 0.'];},hint:'The line from 0 to 1 is split into 10 equal parts.',solve:function(c){c._A.input.value='0.7';}},
    {q:'Which is greater: −6 or −2?',build:NOVA.choiceTask(['\u22126','\u22122','They are equal'],'F1-01'),check:function(x){var ok=x==='\u22122';return [ok,ok?'Yes: −2 is further right, so it is greater.':x==='\u22126'?'6 is bigger than 2, but −6 is further LEFT, so it is smaller.':'Pick one first.'];},hint:'Further right on the line means greater.',solve:function(c){c._G.set('\u22122');}}];
   function paintC(k){stage.innerHTML='';NOVA.cap(stage,'Challenge '+(k+1)+' of 3',['place','read','compare'][k]);
     if(k===0){var r=draw(stage,stN,{});U.dragSnap(r.sv,r.ax,{y:r.ax.y0,value:v,min:-10,max:10,step:1,role:'focus',label:'Value marker',engine:'F1-01',onChange:function(x){v=x;var t=stage.querySelector('.nl-strip .nv-ntile:last-child');if(t)t.textContent=fmt(x);}});strip(stage,[['target','\u22123','unknown'],['ring at',fmt(v),'focus']]);}
     else if(k===1){draw(stage,stT,{pts:[{v:.7,role:'unknown',label:'?'}]});strip(stage,[['each gap','one tenth','op']]);}
     else{draw(stage,{kind:'compare',min:-10,max:10,step:1,labelStep:2,value:-6,value2:-2},{});}
     NOVA.scene.helperStrip(stage,'think',['Place \u22123','Read it','Which is greater?'][k]);}
   NOVA.challengeRun(panel,api,tasks,paintC,C);}
};
NOVA.bankMount({id:'F1-01',num:'F1·01',title:'Configurable number line',def:def,linked:['F0-02','F0-04','F0-05','F0-11','F0-12','F1-02','F1-03'],
 spec:{purpose:'One configurable number line for locating, ordering and comparing integers, negatives, decimals and large numbers. Equal steps with a straight line at every labelled number; points marked by neon rings. Presets include the vertical thermometer (F1-04) and the two-line comparer (F1-12); fractions on a line (F5-04) are a placeholder until the fraction design is decided.',
  params:'kind (line, vertical, compare, tbd), min, max, step (snap), labelStep (digit lines and labels), value, value2 (comparer), unit. Core: NOVA.svg.axes({numberLine}), NOVA.neonRing / neonLine / neonBox / neonPath / chalkText / neonTile, NOVA.ui.dragSnap / slider. Year groups: KS3 Years 7–9 (12–15), with GCSE extension.',
  presets:'Integers 0–10 · Directed −10 to 10 · Tenths 0–1 · Hundredths 2.3–2.4 · GCSE thousands 0–10 000 · Thermometer −20 to 40 °C (F1-04) · Comparer (F1-12) · Fractions (F5-04, design TBD)',
  steps:'Build the line → Place a point → Negatives → Decimals → Compare → Thermometer → Big numbers. Each step has a Sir Bob line and a Guided prompt; the helper points to the marked value.',
  interactions:'Watch: auto-play. Guided: step with prompts. Explore: preset, drag the ring (arrow keys, Home, End), slider, stepper; the comparer has A and B sliders. Challenge (3 tasks): place −3; read 0.7 on a tenths line; choose the greater of −6 and −2. Events: value, correct, step, hintUsed.',
  traps:'Thinking −6 > −2 because 6 > 2 · Reading 7 tenths as 7 or 0.07 · Unequal gaps · Counting lines instead of gaps',
  gcse:'Extension: thousands with step 250, hundredths 2.3–2.4 for bounds and rounding; linked: F1-02 zoom, F1-03 jump arcs, F1-05 rounding'}});
var log=document.getElementById('log');var addLog=function(e){log.textContent=new Date(e.time).toLocaleTimeString()+' '+e.type+' '+JSON.stringify(e.detail)+'\n'+log.textContent.slice(0,6000);};NOVA.events.history().forEach(addLog);NOVA.events.on('*',addLog);
document.getElementById('clearlog').onclick=function(){log.textContent='';};
})();
</script>
