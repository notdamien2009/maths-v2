<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA F0-13 · Worked-example stepper</title>
<style>
@@CSS@@
/* ---- F0-13 local styles ---- */
.pr-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.pr-task{font-weight:700}
.rs-opts{display:flex;flex-wrap:wrap;gap:6px}
.rs-opts button[aria-pressed="true"]{outline:3px solid var(--m-focus)}
.nova-spec dd{white-space:pre-line}
.xx-h4{margin:0 0 4px;font:800 .68rem var(--nova-font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--v-muted)}
@media print{.nova-tl,.nova-tabs,.nova-helperbar,.nova-panel{display:none!important}}
.we-ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 12px 0}
.we-ph>span{height:30px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:9px;border:1px solid var(--v-line);font:800 .72rem var(--nova-font-ui);color:var(--v-muted)}
.we-ph>span.on{background:var(--topic-accent,var(--m-focus));color:#06111b;border-color:transparent}
.we-ph>span.done::before{content:'\2713';}
.we-ph span .sup{font:700 .58rem var(--nova-font-ui);opacity:.8}
.we-body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px;padding:8px 12px}
@media (max-width:480px){.we-body{grid-template-columns:1fr}}
.we-q{font:800 .9rem var(--nova-font-ui);margin:0 0 6px;height:22px;overflow:hidden;color:var(--v-ink)}
.we-lines{display:grid;grid-template-rows:repeat(4,40px);gap:5px;margin:0;padding:0;list-style:none}
.we-lines li{display:grid;grid-template-columns:20px 1fr;align-items:center;gap:8px;height:40px;padding:0 10px;border-radius:9px;border:1px solid var(--v-line);background:var(--v-panel2);font-size:1.08rem;color:var(--v-ink);overflow:hidden}
.we-lines li .k{font:800 .62rem var(--nova-font-ui);color:var(--v-muted)}
.we-lines li.now{border-color:var(--m-focus);box-shadow:0 0 0 1px var(--m-focus)}
.we-lines li.hide{opacity:.22}
.we-lines li.empty{opacity:.18}
.we-blank{display:inline-block;min-width:34px;text-align:center;padding:0 6px;border-radius:7px;border:1.5px dashed var(--m-unknown);color:var(--m-unknown);font-weight:800}
.we-blank::before{content:'\25CC ';font-size:.7em}
.we-blank.filled{border-style:solid;border-color:var(--m-result);color:var(--m-result)}.we-blank.filled::before{content:'\2713 '}
.we-why{display:grid;grid-template-rows:repeat(4,40px);gap:5px}
.we-why div{height:40px;display:flex;align-items:center;padding:0 9px;border-radius:9px;border:1px dashed var(--v-line);font:600 .72rem/1.25 var(--nova-font-ui);color:var(--v-muted);overflow:hidden}
.we-why div.now{border-style:solid;border-color:var(--m-support);color:var(--v-ink)}
.we-why div.hide{opacity:.2}
</style>
</head>
<body data-topic="algebra">
<div class="nova-wrap">
<header id="nova-header" data-run="F0 · Bank · F0-13" data-title="Worked-example stepper" data-sub="I do, we do, you do: full working with reasons, then blanks and fading support, then a question on your own."></header>
<main id="gallery"></main>
<section class="nova-card nova-logcard" aria-label="Event log">
<h2 style="font-size:1.1em">Event log (NOVA.events)</h2>
<div id="log" class="nova-log" role="log" aria-live="off"></div>
<button class="nova-btn" id="clearlog">Clear log</button>
</section>
</div>
<script>
@@JS@@
</script>
<script>
/* ===== F0-13 CONFIG: parameters + named presets (worked examples) ===== */
var NOVA_F0_13_CONFIG={
  startMode:'watch',
  preset:'linear',
  fade:true,          /* reasons fade out from I do to You do */
  presets:{
    linear:{label:'Solve 3x + 5 = 20',
      iDo:{q:'Solve 3x + 5 = 20',lines:[['3x + 5 = 20','Write the equation.'],['3x = 15','Subtract 5 from both sides.'],['x = 5','Divide both sides by 3.'],['Check: 3 × 5 + 5 = 20 \u2713','Substitute back to check.']]},
      weDo:{q:'Solve 4x \u2212 3 = 17',lines:[['4x \u2212 3 = 17','Write the equation.'],['4x = {20}','Add 3 to both sides.'],['x = {5}','Divide both sides by 4.'],['Check: 4 × 5 \u2212 3 = 17 \u2713','Substitute back.']]},
      youDo:{q:'Solve 2x + 7 = 19',answer:6,lines:[['2x + 7 = 19',''],['2x = ?',''],['x = ?',''],['','']]}},
    fraction:{label:'Find 3/5 of 40',
      iDo:{q:'Find 3/5 of 40',lines:[['40 ÷ 5 = 8','Find one fifth: divide by the denominator.'],['8 × 3 = 24','Three fifths: multiply by the numerator.'],['3/5 of 40 = 24','Write the answer.'],['','']]},
      weDo:{q:'Find 2/7 of 56',lines:[['56 ÷ 7 = {8}','One seventh.'],['8 × 2 = {16}','Two sevenths.'],['2/7 of 56 = 16','Answer.'],['','']]},
      youDo:{q:'Find 3/4 of 36',answer:27,lines:[['36 ÷ 4 = ?',''],['? × 3 = ?',''],['',''],['','']]}},
    percent:{label:'Increase 80 by 15%',
      iDo:{q:'Increase 80 by 15%',lines:[['10% of 80 = 8','Find 10% first.'],['5% of 80 = 4','Half of 10%.'],['15% = 8 + 4 = 12','Add to get 15%.'],['80 + 12 = 92','Add the increase.']]},
      weDo:{q:'Increase 60 by 15%',lines:[['10% of 60 = {6}','Find 10%.'],['5% of 60 = {3}','Half of 10%.'],['15% = 9','Add.'],['60 + 9 = {69}','Add the increase.']]},
      youDo:{q:'Increase 40 by 15%',answer:46,lines:[['10% of 40 = ?',''],['5% of 40 = ?',''],['',''],['','']]}},
    angles:{label:'Angles on a straight line',
      iDo:{q:'Find x: x and 130° lie on a straight line',lines:[['x + 130 = 180','Angles on a straight line add to 180°.'],['x = 180 \u2212 130','Subtract 130.'],['x = 50°','Answer with units.'],['','']]},
      weDo:{q:'Find y: y and 72° lie on a straight line',lines:[['y + 72 = {180}','Angles on a line.'],['y = {108}°','Subtract 72.'],['',''],['','']]},
      youDo:{q:'Find z: z and 35° lie on a straight line',answer:145,lines:[['z + 35 = ?',''],['z = ?',''],['',''],['','']]}},
    gcse:{label:'GCSE: Expand (x + 3)(x + 4)',
      iDo:{q:'Expand (x + 3)(x + 4)',lines:[['x × x = x\u00B2','First terms.'],['x × 4 + 3 × x = 7x','Outer and inner terms.'],['3 × 4 = 12','Last terms.'],['x\u00B2 + 7x + 12','Collect.']]},
      weDo:{q:'Expand (x + 2)(x + 5)',lines:[['x × x = x\u00B2','First.'],['5x + 2x = {7}x','Outer and inner.'],['2 × 5 = {10}','Last.'],['x\u00B2 + 7x + 10','Collect.']]},
      youDo:{q:'(x + 1)(x + 6) = x\u00B2 + bx + 6. Find b.',answer:7,lines:[['x × x = x\u00B2',''],['6x + 1x = ?',''],['1 × 6 = 6',''],['','']]}}
  }
};
</script>
<script>
/* ===== F0-13 ENGINE ===== */
(function(){
var h=NOVA.h,C=NOVA_F0_13_CONFIG;
var PH=['iDo','weDo','youDo'],PHN={iDo:'I do',weDo:'We do',youDo:'You do'};
function blanks(src,filled){var parts=[],re=/\{([^}]+)\}/g,m,last=0,i=0;while((m=re.exec(src))){parts.push(document.createTextNode(src.slice(last,m.index)));var f=filled&&filled[i];parts.push(h('span',{class:'we-blank'+(f?' filled':''),'data-maths':f?null:'blank'+i,'aria-label':f?'filled '+m[1]:'blank',text:f?m[1]:'?'}));last=re.lastIndex;i++;}parts.push(document.createTextNode(src.slice(last)));return parts;}
function view(stage,ex,o){var ph=h('div',{class:'we-ph',role:'list','aria-label':'Phases'});PH.forEach(function(p,i){var cur=PH.indexOf(o.phase);ph.appendChild(h('span',{role:'listitem',class:(p===o.phase?'on':'')+(i<cur?' done':'')},[PHN[p],h('span',{class:'sup',text:['· watch','· together','· solo'][i]})]));});stage.appendChild(ph);
  var P=ex[o.phase],b=h('div',{class:'we-body'}),L=h('div'),R=h('div');L.appendChild(h('div',{class:'we-q',text:P.q}));var ul=h('ul',{class:'we-lines','aria-label':'Working'}),wy=h('div',{class:'we-why','aria-label':'Reasons'});
  for(var i=0;i<4;i++){var ln=P.lines[i]||['',''];if(!ln[0]){ul.appendChild(h('li',{class:'empty'},[h('span',{class:'k',text:''}),h('span',{text:''})]));wy.appendChild(h('div',{class:'hide',text:''}));continue;}
    var shown=o.upto==null||i<=o.upto,li=h('li',{class:(i===o.upto?'now':'')+(shown?'':' hide'),'data-maths':i===o.upto?'line':null},[h('span',{class:'k',text:String(i+1)}),h('span',{},shown?blanks(ln[0],o.filled&&o.filled[i]):['\u2026'])]);ul.appendChild(li);
    var why=o.phase==='youDo'||(C.fade&&o.phase==='weDo'&&i>1)?'':ln[1];wy.appendChild(h('div',{class:(i===o.upto?'now':'')+(shown&&why?'':' hide'),text:shown?why||(o.phase==='youDo'?'Your turn.':'Try it: why?'):''}));}
  L.appendChild(ul);R.appendChild(h('h4',{class:'xx-h4',text:'Why'}));R.appendChild(wy);b.appendChild(L);b.appendChild(R);stage.appendChild(b);}
var EX=C.presets.linear;
var DEMO=[{phase:'iDo',upto:0},{phase:'iDo',upto:1,target:'line'},{phase:'iDo',upto:3},{phase:'weDo',upto:1,target:'blank0'},{phase:'weDo',upto:2,filled:{1:[1]}},{phase:'youDo',upto:3},{phase:'youDo',upto:3}];
var steps=[
 {name:'I do: set up',mood:'neutral',narration:'I do: I solve one while you watch. First, write the equation: 3x + 5 = 20.',prompt:'What is the unknown?'},
 {name:'I do: undo +5',mood:'think',narration:'Subtract 5 from both sides to undo the plus 5. That leaves 3x = 15. Each line has its reason beside it.',prompt:'Why subtract 5?',target:'line'},
 {name:'I do: undo ×3',mood:'cheer',narration:'Divide both sides by 3: x = 5. Then check by substituting back. 3 times 5 plus 5 is 20.',prompt:'How do we check?'},
 {name:'We do: blanks',mood:'think',narration:'We do: a similar one together. 4x − 3 = 17. Add 3 to both sides. What goes in the blank?',prompt:'4x = ?',target:'blank0'},
 {name:'We do: fade',mood:'think',narration:'4x = 20. Now the reasons start to fade: you supply the why. Divide by 4 to get x.',prompt:'x = ?'},
 {name:'You do',mood:'focus',narration:'You do: 2x + 7 = 19 on your own. No reasons, no blanks filled. Same steps as before.',prompt:'Solve 2x + 7 = 19.'},
 {name:'Check',mood:'cheer',narration:'Subtract 7, then divide by 2: x = 6. I do, we do, you do: support fades as confidence grows.',prompt:'What is x?'}];
function render(i,stage){stage.innerHTML='';var s=steps[i],d=DEMO[i];NOVA.cap(stage,'Worked example · '+s.name,'step '+(i+1)+'/'+steps.length);view(stage,EX,d);NOVA.scene.helperStrip(stage,i===steps.length-1?'cheer':'explain',PHN[d.phase]);}
var def={id:'F0-13',title:'Worked-example stepper',config:C,steps:steps,render:render,
 alt:'Worked-example stepper: I do, We do, You do phase tabs above a four-line working panel with a reasons column; blanks appear in We do and the reasons fade out by You do.',
 staticAlt:'I do: 3x + 5 = 20 → 3x = 15 (subtract 5) → x = 5 (divide by 3) → check 3 × 5 + 5 = 20. We do: 4x − 3 = 17 → 4x = [20] → x = [5]. You do: 2x + 7 = 19 (x = 6).',
 exploreIntro:'Explore: choose an example and a phase, reveal lines one by one, fill We do blanks and try the You do question.',
 explore:function(panel,stage,api){var ex=C.presets[C.preset],phase='iDo',upto=0,filled={};
   function draw(){stage.innerHTML='';NOVA.cap(stage,'Explore · '+PHN[phase],ex.label);view(stage,ex,{phase:phase,upto:upto,filled:filled});NOVA.scene.helperStrip(stage,'explain',PHN[phase]);}
   function val(k,v){NOVA.events.emit('value',{engine:'F0-13',key:k,value:v});}
   function nLines(){return ex[phase].lines.filter(function(l){return l[0];}).length;}
   var pre=h('select',{class:'nova-input','aria-label':'Example'});Object.keys(C.presets).forEach(function(k){pre.appendChild(h('option',{value:k,text:C.presets[k].label}));});pre.onchange=function(){ex=C.presets[pre.value];upto=0;filled={};val('preset',pre.value);draw();};
   var phs=NOVA.ui.choice(PH.map(function(p){return {label:PHN[p],value:p};}),function(v){phase=v;upto=0;filled={};draw();},{value:phase,engine:'F0-13',key:'phase',label:'Phase'});
   var e=NOVA.ui.entry({label:'Blank / answer',engine:'F0-13-ui'});
   panel.appendChild(h('label',{class:'pr-row'},['Example ',pre]));panel.appendChild(h('div',{class:'pr-row'},[h('span',{class:'pr-task',text:'Phase'}),phs]));
   panel.appendChild(h('div',{class:'pr-row'},[h('button',{class:'nova-btn',text:'\u25C0 Line',onclick:function(){upto=Math.max(0,upto-1);draw();}}),h('button',{class:'nova-btn',text:'Line \u25B6',onclick:function(){upto=Math.min(nLines()-1,upto+1);val('line',upto);draw();}})]));panel.appendChild(e);
   panel.appendChild(h('div',{class:'pr-row'},[h('button',{class:'nova-btn primary',text:'Check',onclick:function(){var v=NOVA.ui.parseNum(e.get());
     if(phase==='youDo'){var ok=v===ex.youDo.answer;api.check(ok,ok?'Yes! '+ex.youDo.q+': '+ex.youDo.answer+'.':'Not yet. Follow the I do steps.',{phase:phase});return;}
     if(phase==='weDo'){var ln=ex.weDo.lines[upto][0],m=/\{([^}]+)\}/.exec(ln);if(!m){api.check(false,'This line has no blank. Move to a line with a ?',{phase:phase});return;}var ok2=NOVA.ui.parseNum(m[1])===v;if(ok2){filled[upto]=[1];draw();}api.check(ok2,ok2?'Yes, '+m[1]+'.':'Not quite. Use the reason on the line above.',{phase:phase});return;}
     api.check(true,'In I do, just watch the reasons. Switch to We do to try.',{phase:phase});}}),h('button',{class:'nova-btn ghost',text:'Hint',onclick:function(){api.hint(ex.iDo.lines[Math.min(upto,ex.iDo.lines.length-1)][1]||'Look at the I do example.');}})]));
   draw();C._explore={state:function(){return {phase:phase,upto:upto};}};},
 challenge:function(panel,api,stage){
   var tasks=[
    {q:'We do: 4x − 3 = 17. Fill the blank: 4x = ?',build:NOVA.entryTask('4x =','F0-13'),check:function(v){var ok=v===20;return [ok,ok?'Yes: add 3 to both sides, 17 + 3 = 20.':v===14?'That subtracts 3. To undo − 3, add 3.':'Undo the − 3 on both sides.'];},hint:'The inverse of subtracting 3 is adding 3.',solve:function(c){c._A.input.value='20';}},
    {q:'Next line: 4x = 20, so x = ?',build:NOVA.entryTask('x =','F0-13'),check:function(v){var ok=v===5;return [ok,ok?'Yes: 20 ÷ 4 = 5.':v===16?'That subtracts 4. 4x means 4 times x, so divide.':v===80?'Divide, do not multiply.':'Undo × 4 by dividing by 4.'];},hint:'4x means 4 × x.',solve:function(c){c._A.input.value='5';}},
    {q:'You do: solve 2x + 7 = 19.',build:NOVA.entryTask('x =','F0-13'),check:function(v){var ok=v===6;return [ok,ok?'Yes: 2x = 12, x = 6. Check: 2 × 6 + 7 = 19.':v===13?'Subtract 7 first, then divide by 2.':v===12?'That is 2x. Divide by 2.':'Follow the same two steps as I do.'];},hint:'Subtract 7 from both sides first.',solve:function(c){c._A.input.value='6';}}];
   NOVA.challengeRun(panel,api,tasks,function(k){stage.innerHTML='';NOVA.cap(stage,'Challenge '+(k+1)+' of 3',['we do','we do','you do'][k]);view(stage,EX,k<2?{phase:'weDo',upto:k+1,filled:k===1?{1:[1]}:{}}:{phase:'youDo',upto:2});NOVA.scene.helperStrip(stage,'think',['Fill the blank','x = ?','Your turn'][k]);},C);}
};
NOVA.bankMount({id:'F0-13',num:'13',title:'Worked-example stepper (I do, we do, you do)',def:def,linked:['F0-03','F0-05','F0-08','F0-11','F0-12'],
 spec:{purpose:'A generic worked-example engine for any topic: I do (full working with reasons), We do (same method with blanks and fading reasons), You do (solo question, checked). Support fades as pupils take over. Presets cover equations, fractions of amounts, percentage change, angles and GCSE expanding brackets.',
  params:'preset; fade on | off; per example: iDo / weDo / youDo with q, lines [maths, reason], {blanks} in We do, youDo.answer. Year groups: KS3 Years 7–9 (12–15), with GCSE extension.',
  presets:'Solve 3x + 5 = 20 · Find 3/5 of 40 · Increase 80 by 15% · Angles on a straight line · GCSE expand (x + 3)(x + 4)',
  steps:'I do: set up → I do: undo +5 → I do: undo ×3 → We do: blanks → We do: fade → You do → Check. Each step has a Sir Bob line and a Guided prompt. The helper glides to the current line and the first blank.',
  interactions:'Watch: auto-play. Guided: step with prompts. Explore: choose example and phase, reveal lines, fill We do blanks (Check), answer You do (Check), Hint shows the matching I do reason. Challenge (3 tasks): 4x = 20; x = 5; solve 2x + 7 = 19 (6). Events: value, correct, step, hintUsed.',
  traps:'Undoing − 3 by subtracting · Treating 4x as 4 + x · Dividing before subtracting the constant · Forgetting to check by substitution',
  gcse:'Extension: expanding double brackets; linked: F0-05 maths text, F0-08 narration, F0-11 marking, F0-12 game rounds'}});
})();
</script>
<script>
(function(){var log=document.getElementById('log');var addLog=function(e){log.textContent=new Date(e.time).toLocaleTimeString()+' '+e.type+' '+JSON.stringify(e.detail)+'\n'+log.textContent.slice(0,6000);};NOVA.events.history().forEach(addLog);NOVA.events.on('*',addLog);
document.getElementById('clearlog').onclick=function(){log.textContent='';};})();
</script>
</body>
