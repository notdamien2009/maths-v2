.f12-sv[role=application]:focus-visible{outline:2px dashed var(--m-focus);outline-offset:3px;border-radius:12px}

<body data-topic="geometry">
<div class="nova-wrap">
<header id="nova-header" data-run="F12 · 2D shapes, perimeter and area · F12-09" data-title="Kite and rhombus area" data-sub="Box in a kite or rhombus to see why its area is half the product of the diagonals."></header>

<script>
/* ===== F12-09 CONFIG: parameters + named presets ===== */
var NOVA_F12_09_CONFIG={
  startMode:'watch',
  preset:'kite',
  unit:'cm',
  presets:{
    kite:   {label:'Kite',d1:8,d2:6,p:.35},
    rhombus:{label:'Rhombus',d1:8,d2:6,p:.5},
    tall:   {label:'Tall thin kite',d1:10,d2:4,p:.3},
    wide:   {label:'Wide kite',d1:6,d2:9,p:.6}
  }
};
/* ===== F12-09 ENGINE ===== */
(function(){
var h=NOVA.h,S=NOVA.svg,U=NOVA.ui,F=NOVA.f12,C=NOVA_F12_09_CONFIG,P=C.presets,strip=F.strip,fmt=F.fmt,clone=F.clone,UN=C.unit,VW=440,VH=280;
function r2(x){return Math.round(x*100)/100;}
/* st={d1 (vertical diagonal),d2 (horizontal diagonal),p (where the diagonals cross, 0..1 down d1)}; o.view: diag | box | pieces; o.sides */
function draw(stage,st,o){o=o||{};var d1=st.d1,d2=st.d2,p=st.p,T=[d2/2,0],R=[d2,p*d1],Bt=[d2/2,d1],L=[0,p*d1],X=[d2/2,p*d1],rect=[[0,0],[d2,0],[d2,d1],[0,d1]],m=F.map(rect,VW,VH,34,60),view=o.view||'diag',
  sv=S.root(VW,VH,(st.p===.5?'Rhombus':'Kite')+' with diagonals '+d1+' '+UN+' and '+d2+' '+UN+'.');sv.classList.add('f12-sv');
  if(view!=='diag')NOVA.neonShape(sv,m(rect),{role:'unknown',fill:false,width:1.8,dash:'8 6'});
  if(view==='pieces'){[[[0,0],T,L],[T,[d2,0],R],[Bt,[d2,d1],R],[L,[0,d1],Bt]].forEach(function(t){NOVA.neonShape(sv,m(t),{role:'op',hatch:'diag',width:2});});
    [[T,L,X],[T,R,X],[Bt,L,X],[Bt,R,X]].forEach(function(t){NOVA.neonShape(sv,m(t),{role:'result',width:2});});}
  var K=NOVA.neonShape(sv,m([T,R,Bt,L]),{role:view==='pieces'?'result':'op',fill:view!=='pieces',hatch:view==='pieces'?null:'cross',width:3});K.setAttribute('data-maths','shape');
  var A=m([T,Bt]),B=m([L,R]),Xs=m([X])[0];F.dash(sv,A[0],A[1],'focus',2.2);F.dash(sv,B[0],B[1],'op',2.2);
  NOVA.rightAngle(sv,Xs,[Xs[0]+10,Xs[1]],[Xs[0],Xs[1]-10],{size:10,role:'support'});
  S.pill(sv,A[0][0]+30,A[0][1]-14,fmt(d1)+' '+UN,{role:'focus',size:12});S.pill(sv,B[1][0]+8,B[1][1]-18,fmt(d2)+' '+UN,{role:'op',size:12});
  var Q=m([T,R,Bt,L]);if(Math.abs(p-.5)<1e-9){[0,1,2,3].forEach(function(i){var a=Q[i],b=Q[(i+1)%4];NOVA.eqTick(sv,a[0],a[1],b[0],b[1],1);});}else{
    NOVA.eqTick(sv,Q[0][0],Q[0][1],Q[1][0],Q[1][1],1);NOVA.eqTick(sv,Q[3][0],Q[3][1],Q[0][0],Q[0][1],1);NOVA.eqTick(sv,Q[1][0],Q[1][1],Q[2][0],Q[2][1],2);NOVA.eqTick(sv,Q[2][0],Q[2][1],Q[3][0],Q[3][1],2);}
  if(o.sides){var sd=Math.hypot(d2/2,p*d1),mid=[(Q[3][0]+Q[0][0])/2-36,(Q[3][1]+Q[0][1])/2-4];S.pill(sv,mid[0],mid[1],r2(sd)+' '+UN,{role:'error',size:12});}
  stage.appendChild(sv);}
function chips(stage,st,o){o=o||{};var items=[['diagonals',fmt(st.d1)+' and '+fmt(st.d2),'given']];if(o.box)items.push(['box',st.d1+' × '+st.d2+' = '+st.d1*st.d2,'op']);items.push(['area','½ × '+st.d1+' × '+st.d2+' = '+fmt(st.d1*st.d2/2)+' '+UN+'²','result']);if(o.side)items.push(['sides × sides','not the area','error']);strip(stage,items);}
var K1={d1:8,d2:6,p:.35},R1={d1:8,d2:6,p:.5};
var steps=[
 {name:'A kite and its diagonals',mood:'neutral',narration:'A kite has two diagonals. They cross at a right angle. The long one is 8 and the short one is 6. We will use the diagonals to find the area.',prompt:'Where do the diagonals cross?',st:K1,o:{view:'diag'},c:{}},
 {name:'Box it in',mood:'focus',narration:'Draw a rectangle round the kite, 6 wide and 8 tall. Its area is 6 times 8, which is 48. The kite fits snugly inside, touching all four sides.',prompt:'What is the area of the box?',st:K1,o:{view:'box'},c:{box:1}},
 {name:'The corner pieces',mood:'think',narration:'The four corner triangles outside the kite each match a triangle inside the kite beside them, same base and same height. So the outside and the inside have equal area.',prompt:'How does each corner piece compare with the piece beside it?',st:K1,o:{view:'pieces'},c:{box:1},target:'shape'},
 {name:'Half of the box',mood:'cheer',narration:'The kite is exactly half of the box: half times 8 times 6, which is 24 square centimetres.',prompt:'What is half of 48?',st:K1,o:{view:'box'},c:{box:1},target:'shape'},
 {name:'A rhombus is the same',mood:'cheer',narration:'A rhombus is a kite whose diagonals cut each other in half. The rule is the same: half times 8 times 6 is 24.',prompt:'Do the diagonals bisect each other in a rhombus?',st:R1,o:{view:'box'},c:{box:1}},
 {name:'Not side times side',mood:'think',narration:'The rhombus has sides of 5. Squaring the side gives 25, which is not the area. Use the diagonals: 24.',prompt:'Why is 5 × 5 wrong?',st:R1,o:{view:'diag',sides:1},c:{side:1}}];
function render(i,stage){stage.innerHTML='';var s=steps[i];NOVA.cap(stage,'Kite and rhombus area · '+s.name,'step '+(i+1)+'/'+steps.length);draw(stage,s.st,s.o);chips(stage,s.st,s.c);NOVA.scene.helperStrip(stage,i===steps.length-1?'think':'explain',s.name);}
var def={id:'F12-09',title:'Kite and rhombus area',config:C,steps:steps,render:render,
 alt:'Kite and rhombus area: a rectangle drawn round the kite shows that the kite is half of d1 times d2; a rhombus works the same way.',
 staticAlt:'Kite with diagonals 8 and 6: the surrounding box is 48, so the kite is 24. A rhombus with diagonals 8 and 6 also has area 24, although its sides are 5.',
 exploreIntro:'Explore: change the two diagonals and where they cross. Switch the view to see the box and the matching corner pieces. A rhombus is the kite where the diagonals cross in the middle.',
 explore:function(panel,stage,api){var key=C.preset,st=clone(P[key]),view='diag',box=h('div');
   function pg(){stage.innerHTML='';NOVA.cap(stage,'Explore · '+(Math.abs(st.p-.5)<1e-9?'Rhombus':'Kite'),'area '+fmt(st.d1*st.d2/2));draw(stage,st,{view:view,sides:true});chips(stage,st,{box:view!=='diag'});NOVA.scene.helperStrip(stage,'explain','½ × d₁ × d₂');}
   function build(){box.innerHTML='';
     box.appendChild(U.slider({label:'Long diagonal',min:4,max:10,step:1,value:st.d1,engine:'F12-09',onChange:function(v){st.d1=v;pg();}}));
     box.appendChild(U.slider({label:'Short diagonal',min:3,max:10,step:1,value:st.d2,engine:'F12-09',onChange:function(v){st.d2=v;pg();}}));
     box.appendChild(U.slider({label:'Crossing point (0.5 = rhombus)',min:.2,max:.8,step:.05,value:st.p,engine:'F12-09',onChange:function(v){st.p=Math.round(v*100)/100;pg();}}));}
   var pre=h('select',{class:'nova-input','aria-label':'Shape'});Object.keys(P).forEach(function(k){pre.appendChild(h('option',{value:k,text:P[k].label}));});pre.value=key;
   pre.onchange=function(){key=pre.value;st=clone(P[key]);build();pg();NOVA.events.emit('value',{engine:'F12-09',control:'preset',value:key});};
   var vw=h('select',{class:'nova-input','aria-label':'View'});[['diag','Diagonals'],['box','Box it in'],['pieces','Corner pieces']].forEach(function(o){vw.appendChild(h('option',{value:o[0],text:o[1]}));});vw.onchange=function(){view=vw.value;pg();NOVA.events.emit('value',{engine:'F12-09',control:'view',value:view});};
   panel.appendChild(h('label',{class:'pr-row'},['Shape ',pre]));panel.appendChild(h('label',{class:'pr-row'},['View ',vw]));panel.appendChild(box);build();pg();},
 challenge:function(panel,api,stage){var T1={d1:10,d2:6,p:.4},T2={d1:8,d2:6,p:.5},T3={d1:8,d2:6,p:.5};
   var tasks=[
    {q:'A kite has diagonals 10 cm and 6 cm. What is its area?',build:NOVA.entryTask('Area (cm²)','F12-09'),check:function(x){var ok=x===30;return [ok,ok?'Yes: ½ × 10 × 6 = 30 cm².':x===60?'60 is the box. The kite is half of the box.':x===16?'Do not add the diagonals. Multiply, then halve.':'Half times one diagonal times the other.'];},hint:'Box is 10 × 6. The kite is half of it.',solve:function(c){c._A.input.value='30';}},
    {q:'A rhombus has area 24 cm² and one diagonal of 8 cm. How long is the other diagonal?',build:NOVA.entryTask('Other diagonal (cm)','F12-09'),check:function(x){var ok=x===6;return [ok,ok?'Yes: ½ × 8 × 6 = 24.':x===3?'That halved twice. Double the area first: 48 ÷ 8 = 6.':x===16?'That is 24 − 8. Work backwards: double the area, then divide by 8.':'Double 24 to get 48, then divide by 8.'];},hint:'Double the area, then divide by the known diagonal.',solve:function(c){c._A.input.value='6';}},
    {q:'A rhombus has sides of 5 cm and diagonals of 6 cm and 8 cm. Which gives its area?',build:NOVA.choiceTask(['½ × 6 × 8 = 24','5 × 5 = 25','6 × 8 = 48'],'F12-09'),check:function(x){var ok=x==='½ × 6 × 8 = 24';return [ok,ok?'Yes: half the product of the diagonals.':x==='5 × 5 = 25'?'Side times side is only right for a square.':x==='6 × 8 = 48'?'That is the box. The rhombus is half of it.':'Pick one first.'];},hint:'The rule uses the diagonals, not the sides.',solve:function(c){c._G.set('½ × 6 × 8 = 24');}}];
   function paintC(k){stage.innerHTML='';NOVA.cap(stage,'Challenge '+(k+1)+' of 3',['kite','work backwards','which rule'][k]);var s=[T1,T2,T3][k];draw(stage,s,{view:k===0?'box':'diag',sides:k===2});strip(stage,k===1?[['area','24 cm²','result'],['other diagonal','?','unknown']]:k===2?[['sides','5 cm','error'],['diagonals','6 and 8','given']]:[['find','the area','focus']]);NOVA.scene.helperStrip(stage,'think',['Half the box','Work backwards','Diagonals'][k]);}
   NOVA.challengeRun(panel,api,tasks,paintC,C);}
};
NOVA.bankMount({id:'F12-09',num:'F12·09',title:'Kite and rhombus area',def:def,linked:['F0-02','F0-11','F12-01','F12-06','F12-07','F12-08'],
 spec:{purpose:'Why the area of a kite or rhombus is half the product of its diagonals. A rectangle drawn round the kite touches all four vertices; each corner triangle matches the inner triangle beside it, so the kite is half of the box. A rhombus is the special kite where the diagonals bisect each other.',
  params:'preset (kite, rhombus, tall, wide); long diagonal d1, short diagonal d2, crossing point p (0 to 1 down d1; 0.5 is a rhombus); view (diagonals, box, pieces); unit cm. Core: NOVA.neonShape / eqTick / rightAngle / neonTile, NOVA.f12.map / dash. Year groups: KS3 Years 7–9 (12–15).',
  presets:'Kite · Rhombus · Tall thin kite · Wide kite',
  steps:'A kite and its diagonals → Box it in → The corner pieces → Half of the box → A rhombus is the same → Not side times side. Each step has a Sir Bob line and a Guided prompt.',
  interactions:'Watch: auto-play. Guided: step with prompts. Explore: preset, view, diagonals and crossing-point sliders; chips show the box and the area. Challenge (3 tasks): kite from diagonals; missing diagonal from area; choose the correct rule for a rhombus when the sides are also given. Events: value, correct, step, hintUsed.',
  traps:'Using side times side for a rhombus · forgetting to halve · adding the diagonals · halving twice when working backwards',
  gcse:'Extension: area from diagonals in coordinate geometry, trigonometric area ½ab sin C for a rhombus; linked: F12-01 family tree, F12-06 parallelogram, F12-08 trapezium'}});
var log=document.getElementById('log');var addLog=function(e){log.textContent=new Date(e.time).toLocaleTimeString()+' '+e.type+' '+JSON.stringify(e.detail)+'\n'+log.textContent.slice(0,6000);};NOVA.events.history().forEach(addLog);NOVA.events.on('*',addLog);
document.getElementById('clearlog').onclick=function(){log.textContent='';};
})();

</script>
