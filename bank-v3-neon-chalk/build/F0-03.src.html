<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA F0-03 · Animation timeline (play/pause/step/scrub, reduced motion)</title>
<style>
@@CSS@@
/* ---- F0-03 local styles ---- */
.pr-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.pr-row label{display:flex;gap:6px;align-items:center;font-size:.85rem}
.pr-row input[type=range]{width:150px}
.pr-out{font:800 .9rem var(--nova-font-maths);color:var(--v-ink)}
.pr-task{font-weight:700}
.tl-list{display:flex;flex-wrap:wrap;gap:4px;padding:6px 12px 0;margin:0;list-style:none}
.tl-list button{font:700 .68rem var(--nova-font-ui);padding:3px 7px;border-radius:999px;border:1px solid var(--v-line);background:var(--v-panel);color:var(--v-muted);cursor:pointer}
.tl-list button[aria-current="step"]{border-color:var(--m-focus);color:var(--v-ink);box-shadow:0 0 0 2px color-mix(in srgb,var(--m-focus) 35%,transparent)}
.tl-sum{text-align:center;font:700 1.25rem var(--nova-font-maths);color:var(--v-ink);padding:4px 0 0}
.nova-spec dd{white-space:pre-line}
@media print{.nova-tl,.nova-tabs,.nova-helperbar,.nova-panel{display:none!important}}
</style>
</head>
<body data-topic="number">
<div class="nova-wrap">
<header id="nova-header" data-run="F0 · Bank · F0-03" data-title="Animation timeline" data-sub="Named steps with play, pause, step, scrub, speed and reduced motion: the clock every NOVA animation runs on."></header>
<main id="gallery"></main>
<section class="nova-card nova-logcard" aria-label="Event log">
<h2 style="font-size:1.1em">Event log (NOVA.events)</h2>
<div id="log" class="nova-log" role="log" aria-live="off"></div>
<button class="nova-btn" id="clearlog">Clear log</button>
</section>
</div>
<script>
@@JS@@
</script>
<script>
/* ===== F0-03 CONFIG: parameters + named presets ===== */
var NOVA_F0_03_CONFIG={
  startMode:'watch',
  start:0,          /* where the helper starts on the number line */
  jumps:3,          /* number of equal jumps (named steps "Jump 1..n") */
  size:4,           /* signed jump size */
  max:16,           /* number line end (min is derived) */
  speed:1,          /* playback speed 0.25-4 */
  stepMs:1500,      /* time per step at speed 1 */
  presets:{
    times:    {label:'Repeated addition  3 × 4',start:0,jumps:3,size:4,max:16},
    fives:    {label:'Counting in 5s  4 × 5',start:0,jumps:4,size:5,max:24},
    countdown:{label:'Counting back  20 − 3 × 6',start:20,jumps:3,size:-6,max:20},
    negative: {label:'Into negatives  4 − 3 × 3',start:4,jumps:3,size:-3,max:8},
    decimal:  {label:'Decimal steps  4 × 0.5',start:0,jumps:4,size:0.5,max:3},
    sequence: {label:'GCSE: linear sequence 3, 7, 11, 15 (4n − 1)',start:3,jumps:3,size:4,max:16}
  }
};
</script>
<script>
/* ===== F0-03 ENGINE ===== */
(function(){
var h=NOVA.h,S=NOVA.svg,E=S.el,C=NOVA_F0_03_CONFIG,G=document.getElementById('gallery'),W=360,H=168;
function fmt(v){return S.num(Math.round(v*1000)/1000);}
function range(st){var a=st.start,b=st.start+st.jumps*st.size,lo=Math.min(a,b),hi=Math.max(a,b),span=hi-lo||1,step=span<=4?(Math.abs(st.size)<1?0.5:1):span<=24?(span<=12?1:2):5;
  lo=Math.floor((lo-step*.5)/step)*step;hi=Math.ceil((hi+step*.5)/step)*step;return {min:lo,max:hi,step:step};}
function makeSteps(st){var s=[{name:'Start',mood:'neutral',narration:'The helper starts at '+fmt(st.start)+'. Nothing has happened yet: that is step zero, not a jump.',prompt:'Where does the helper start? Is that a jump?'}];
  for(var i=1;i<=st.jumps;i++){var v=st.start+i*st.size;s.push({name:'Jump '+i,mood:i===st.jumps?'focus':'think',tween:900,narration:'Jump '+i+': '+(st.size<0?'back ':'')+fmt(Math.abs(st.size))+' to '+fmt(v)+'. Total moved so far: '+i+' × '+fmt(st.size)+' = '+fmt(i*st.size)+'.',prompt:'Before you step: where will jump '+i+' land?'});}
  s.push({name:'Total',mood:'cheer',narration:fmt(st.jumps)+' jumps of '+fmt(st.size)+' from '+fmt(st.start)+' lands on '+fmt(st.start+st.jumps*st.size)+'. Count jumps, not tick marks.',prompt:'Write it as a calculation.'});return s;}
/* frame(stage, p, st): fully continuous. p in [0, jumps+1]. Jump k is in flight for p in (k-1, k). */
function frame(stage,p,st){var r=range(st),sv=S.root(W,H,''),ax=S.axes(sv,{x:24,y:100,w:312,h:0,xmin:r.min,xmax:r.max,ymin:0,ymax:0,ticks:r.step,numberLine:true});
  var done=Math.min(st.jumps,Math.floor(p+1e-6)),f=Math.min(1,p-done),fl=p<st.jumps&&f>1e-6;
  S.point(sv,ax.sx(st.start),ax.y0,{role:'given',r:5,glow:false});
  for(var k=1;k<=st.jumps;k++){var a=st.start+(k-1)*st.size,b=a+st.size;if(k<=done||(k===done+1&&fl)){var hp=S.hop(sv,ax.sx(a),ax.sx(b),ax.y0-6,{role:st.size<0?'focus':'op',label:(k<=done?(st.size<0?'\u2212':'+')+fmt(Math.abs(st.size)):null),height:30});if(k===done+1)S.drawOn(hp.path,f);}}
  var pos,lift=0;if(fl){var a2=st.start+done*st.size;pos=a2+st.size*NOVA.ease(f);lift=Math.sin(Math.PI*f)*34;}else pos=st.start+done*st.size;
  if(done>0)S.point(sv,ax.sx(pos),ax.y0,{role:p>=st.jumps+1-1e-6?'result':'focus',r:5,glow:false});
  /* the jumper is a maths token (focus marker riding the hop), not the tutor helper: the helper stays docked */
  var tk=S.point(sv,ax.sx(pos),ax.y0-6-lift,{role:'focus',r:7,glow:true});if(tk&&tk.setAttribute)tk.setAttribute('class',(tk.getAttribute('class')||'')+' tl-token');
  if(p>=st.jumps+1-1e-6&&st.jumps>0){var br=S.brace(sv,ax.sx(st.start+st.jumps*st.size),ax.y0+30,ax.sx(st.start),ax.y0+30,{role:'support',depth:5,label:fmt(st.jumps)+' × '+fmt(st.size)});var bg=br&&(br.g||br.el||br);if(bg&&bg.setAttribute)bg.setAttribute('data-target','total');}
  sv.setAttribute('aria-label','Number line '+fmt(r.min)+' to '+fmt(r.max)+'. Start '+fmt(st.start)+', '+done+' of '+st.jumps+' jumps of '+fmt(st.size)+' done, helper at '+fmt(pos)+'.');
  stage.appendChild(sv);return {pos:pos,done:done};}
function cap(stage,left,tag){stage.appendChild(h('div',{class:'nv-cap'},[h('span',{text:left}),tag?h('span',{class:'tag',text:tag}):null]));}
function sumLine(stage,st,done){var parts=[fmt(st.start)];for(var i=0;i<done;i++)parts.push((st.size<0?'\u2212 ':'+ ')+fmt(Math.abs(st.size)));stage.appendChild(h('div',{class:'tl-sum','aria-live':'polite',text:parts.join(' ')+' = '+fmt(st.start+done*st.size)}));}
var steps=makeSteps(C),eng;
function stepList(stage,cur){var ul=h('ul',{class:'tl-list','aria-label':'Named steps'});steps.forEach(function(s,i){var b=h('button',{text:s.name,'aria-current':i===cur?'step':'false',onclick:function(){eng.timeline.pause();eng.timeline.go(i,'list');}});ul.appendChild(h('li',{},[b]));});stage.appendChild(ul);}
function renderAt(p,stage){stage.innerHTML='';var i=Math.round(p);cap(stage,'Timeline · '+steps[Math.min(i,steps.length-1)].name,'p = '+p.toFixed(2));stepList(stage,i);var r=frame(stage,p,C);sumLine(stage,C,r.done);var s0=steps[Math.min(i,steps.length-1)];NOVA.scene.helperStrip(stage,p>=steps.length-1-1e-6?'cheer':'explain',s0.name==='Start'?'Start at '+fmt(C.start):s0.name==='Total'?fmt(C.jumps)+' × '+fmt(C.size)+' = '+fmt(C.jumps*C.size):s0.name);}
/* v1.5 point-to: on the Total step the helper glides to the calculation, then home */
NOVA.events.on('step',function(e){var d=e.detail||{};if(d.engine!=='F0-03'||d.name!=='Total'||!eng)return;setTimeout(function(){var st=document.querySelector('#F0-03 .nova-stage'),t=st&&(st.querySelector('[data-target=total]')||st.querySelector('.tl-sum'));if(t)NOVA.scene.pointTo(st,t);},350);});
function slider(lbl,min,max,step,val,on){var inp=h('input',{type:'range',min:min,max:max,step:step,value:val,'aria-label':lbl}),out=h('span',{class:'pr-out',text:fmt(val)});inp.oninput=function(){out.textContent=fmt(+inp.value);on(+inp.value);};return h('label',{},[lbl+' ',inp,out]);}
var def={id:'F0-03',title:'Animation timeline',config:C,steps:steps,render:function(i,st){renderAt(i,st);},renderAt:renderAt,
 alt:'Animation timeline: a helper makes equal jumps along a number line, one named step per jump.',
 staticAlt:'Number line 0 to 14. Start at 0 (blue square). Three cyan hop arrows of +4 land on 4, 8 and 12; 12 is the result. A brace underneath reads 3 × 4. Calculation: 0 + 4 + 4 + 4 = 12.',
 exploreIntro:'Explore: change the jumps and the speed, scrub any frame, and preview reduced motion.',
 explore:function(panel,stage,api){var st=JSON.parse(JSON.stringify(C)),p=0,anim=null;
   function draw(){stage.innerHTML='';cap(stage,'Explore · frame','p = '+p.toFixed(2));var r=frame(stage,p,st);sumLine(stage,st,r.done);NOVA.scene.helperStrip(stage,'explain',st.jumps+' × '+fmt(st.size)+' from '+fmt(st.start));}
   function emit(k,v){NOVA.events.emit('value',{engine:'F0-03',control:k,value:v});}
   var fr=h('input',{type:'range',min:0,max:st.jumps+1,step:.01,value:0,'aria-label':'Frame'});fr.oninput=function(){p=+fr.value;stop();draw();emit('frame',p);};
   function stop(){if(anim){anim.stop();anim=null;}}
   function play(){stop();var from=p,to=st.jumps+1;if(from>=to-.01)from=0;anim=NOVA.tween((to-from)*C.stepMs/st.speed,function(t){p=from+(to-from)*t;fr.value=p;draw();},function(){anim=null;});}
   var pre=h('select',{class:'nova-input','aria-label':'Preset'});Object.keys(C.presets).forEach(function(k){pre.appendChild(h('option',{value:k,text:C.presets[k].label}));});
   pre.onchange=function(){var q=C.presets[pre.value];['start','jumps','size','max'].forEach(function(k){st[k]=q[k];});p=0;fr.max=st.jumps+1;fr.value=0;build();draw();emit('preset',pre.value);};
   var box=h('div');function build(){box.innerHTML='';
     box.appendChild(h('div',{class:'pr-row'},[slider('Jumps',1,8,1,st.jumps,function(v){st.jumps=v;fr.max=v+1;p=Math.min(p,v+1);draw();emit('jumps',v);})]));
     box.appendChild(h('div',{class:'pr-row'},[slider('Size',-6,6,Math.abs(st.size)<1?0.5:1,st.size,function(v){st.size=v||1;draw();emit('size',st.size);})]));
     box.appendChild(h('div',{class:'pr-row'},[slider('Speed',.25,4,.25,st.speed,function(v){st.speed=v;if(eng)eng.timeline.setSpeed(v);})]));}
   var rm=h('input',{type:'checkbox'});rm.checked=NOVA.reducedMotion();rm.onchange=function(){NOVA.setReducedMotion(rm.checked);if(rm.checked){stop();p=st.jumps+1;fr.value=p;draw();}};
   panel.appendChild(h('label',{class:'pr-row'},['Preset ',pre]));panel.appendChild(box);
   panel.appendChild(h('label',{class:'pr-row'},['Frame ',fr]));
   panel.appendChild(h('div',{class:'pr-row'},[h('button',{class:'nova-btn primary',text:'Play',onclick:play}),h('button',{class:'nova-btn',text:'Pause',onclick:stop}),h('button',{class:'nova-btn ghost',text:'Reset',onclick:function(){stop();p=0;fr.value=0;draw();}})]));
   panel.appendChild(h('label',{class:'pr-row'},[rm,' Preview reduced motion (jumps straight to the end state)']));
   build();draw();api.onCleanup(stop);C._explore={set:function(o){Object.assign(st,o);draw();},frame:function(v){p=v;draw();},state:st};},
 challenge:function(panel,api,stage){var st={start:0,jumps:3,size:4},k=0,p=0;
   var T=[
    {q:'Scrub to the exact frame where the helper first lands on 8.',kind:'frame',check:function(){return Math.abs(p-2)<.02;},why:function(){return p>2.02&&p<3?'Too far: it is in the air on jump 3.':Math.abs(p-3)<.02?'That is 12. Go back one jump.':'Not on 8 yet. Each whole step is one landing.';},hint:'8 = 2 jumps of 4, so step 2.'},
    {q:'How many jumps of 4 from 0 reach 20?',kind:'entry',ans:5,why:function(v){return v===6?'You counted the start as a jump. Count the hops, not the marks.':v===16?'That is the distance after 4 jumps. How many jumps make 20?':'Try 20 ÷ 4.';},hint:'Each jump adds 4. 4, 8, 12, 16, 20.'},
    {q:'From 20, jumping back 6 three times, where do you land?',kind:'entry',ans:2,set:{start:20,jumps:3,size:-6},why:function(v){return v===38?'Check the direction: back means subtract.':'20 − 6 − 6 − 6.';},hint:'Back 6, three times: 20 − 18.'}];
   var qp=h('p',{class:'pr-task'}),ctl=h('div'),ent=h('input',{class:'nova-input',type:'number','aria-label':'Answer',style:'width:90px'});
   function draw(){stage.innerHTML='';cap(stage,'Challenge '+(k+1)+' of 3',T[k].kind);frame(stage,T[k].kind==='frame'?p:0,st);NOVA.scene.helperStrip(stage,'think',T[k].q.split(/[.?]/)[0]);}
   function load(){qp.textContent=T[k].q;ctl.innerHTML='';if(T[k].set)Object.assign(st,T[k].set);p=0;
     if(T[k].kind==='frame'){var fr=h('input',{type:'range',min:0,max:4,step:.01,value:0,'aria-label':'Frame'});fr.oninput=function(){p=+fr.value;NOVA.events.emit('value',{engine:'F0-03',control:'frame',value:p});draw();};
       fr.addEventListener('keydown',function(e){var d={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];if(!d)return;e.preventDefault();p=NOVA.clamp(Math.round(p)+d,0,4);fr.value=p;draw();});
       ctl.appendChild(h('label',{class:'pr-row'},['Frame ',fr]));}
     else{ent.value='';ctl.appendChild(h('label',{class:'pr-row'},['Answer ',ent]));}draw();}
   panel.appendChild(qp);panel.appendChild(ctl);
   var row=h('div',{class:'pr-row'},[h('button',{class:'nova-btn primary',text:'Check',onclick:function(){var t=T[k],v=+ent.value,ok=t.kind==='frame'?t.check():v===t.ans;
      api.check(ok,ok?(k<2?'Yes. Next task.':'Yes, 2. All three done.'):t.why(v),{task:k,frame:p,entry:ent.value});if(ok&&k<2){var tm=setTimeout(function(){k++;load();},700);api.onCleanup(function(){clearTimeout(tm);});}}}),
     h('button',{class:'nova-btn ghost',text:'Hint',onclick:function(){api.hint(T[k].hint);}})]);panel.appendChild(row);
   C._challenge={frame:function(v){p=v;draw();},entry:ent};load();}
};
var card=h('section',{class:'nova-card nova-engine',id:'F0-03','aria-labelledby':'F0-03-h'},[h('h2',{id:'F0-03-h',class:'nova-eh'},[h('span',{class:'nova-id',text:'03'}),h('span',{text:'Animation timeline (play/pause/step/scrub, reduced motion)'})])]);
var spec={purpose:'The clock every NOVA animation runs on: a named step sequence with play, pause, step back and forward, smooth scrub, speed, a jump-to-step list and reduced motion. The demo shows repeated addition as equal jumps, one named step per jump, so pupils link a frame of the animation to a line of working.',
 params:'start; jumps (named steps Jump 1…n); size (signed); max; speed (0.25–4); stepMs (time per step). Core: Timeline.go / next / back / play / pause / reset / scrubTo / setSpeed / goName / progress, NOVA.setReducedMotion. Year groups: KS3 Years 7–9 (12–15), with GCSE extension.',
 presets:'times 3 × 4 · fives 4 × 5 · countdown 20 − 3 × 6 · negative 4 − 3 × 3 · decimal 4 × 0.5 · sequence 3, 7, 11, 15 (4n − 1, GCSE)',
 steps:'Start → Jump 1 → Jump 2 → Jump 3 → Total (built from the config, so n jumps give n + 2 steps). In-between frames are drawn, so scrub glides mid-jump. Reduced motion shows each end state with no tween. Each step has a Sir Bob Maximus narration line and a Guided prompt.',
 interactions:'Watch: auto-play. Guided: step with prompts. Explore: preset, jumps, size and speed sliders, a frame scrubber, Play/Pause/Reset and a reduced-motion preview. Challenge (3 tasks): scrub to the exact landing on 8 (frame 2); jumps of 4 to reach 20 (5); from 20 back 6 three times (2). Events: value, correct, step, hintUsed.',
 traps:'Counting the start as a jump (off by one: 6 instead of 5) · Confusing distance with number of jumps (16 vs 4) · Wrong direction for "back" (38 instead of 2) · Reading a mid-air frame as a landing',
 gcse:'Extension: the sequence preset links jumps to the nth term (4n − 1); the same timeline drives later transformation and graph animations; linked: F0-02 primitives, F0-04 interaction kit, F0-07 events, F0-08 Bob narration, F0-13 worked-example stepper'};
card.appendChild(NOVA.specCard(spec));
card.appendChild(h('p',{class:'purpose',style:'margin:6px 0 0'},[h('strong',{text:'Year groups: '}),'KS3 Years 7–9 (12–15). ',h('strong',{text:'Linked components: '}),'F0-02, F0-04, F0-07, F0-08, F0-13, F0-17.']));
var demo=h('div',{'aria-label':'Animation timeline live demo'});card.appendChild(h('h3',{text:'Live demo · F0-03'}));card.appendChild(demo);G.appendChild(card);
eng=window.F0_03=NOVA.mountEngine(demo,def);
var log=document.getElementById('log');var addLog=function(e){log.textContent=new Date(e.time).toLocaleTimeString()+' '+e.type+' '+JSON.stringify(e.detail)+'\n'+log.textContent.slice(0,6000);};NOVA.events.history().forEach(addLog);NOVA.events.on('*',addLog);
document.getElementById('clearlog').onclick=function(){log.textContent='';};
})();
</script>
</body>
