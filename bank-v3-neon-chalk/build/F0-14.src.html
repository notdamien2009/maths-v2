<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA F0-14 · Axes and plotting primitive</title>
<style>
@@CSS@@
/* ---- F0-14 local styles ---- */
.pr-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.pr-task{font-weight:700}
.rs-opts{display:flex;flex-wrap:wrap;gap:6px}
.rs-opts button[aria-pressed="true"]{outline:3px solid var(--m-focus)}
.nova-spec dd{white-space:pre-line}
.xx-h4{margin:0 0 4px;font:800 .68rem var(--nova-font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--v-muted)}
@media print{.nova-tl,.nova-tabs,.nova-helperbar,.nova-panel{display:none!important}}
.pl-wrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px;padding:6px 12px}
@media (max-width:480px){.pl-wrap{grid-template-columns:1fr}}
.pl-svg{display:block;width:100%;height:auto;touch-action:none}
.pl-info{display:grid;grid-template-rows:repeat(4,34px);gap:5px}
.pl-info div{height:34px;display:flex;align-items:center;gap:6px;padding:0 9px;border-radius:9px;border:1px solid var(--v-line);background:var(--v-panel2);font:700 .74rem var(--nova-font-ui);color:var(--v-ink);overflow:hidden;white-space:nowrap}
.pl-info div.hl{border-color:var(--m-focus);box-shadow:0 0 0 1px var(--m-focus)}
.pl-info div.empty{opacity:.25}
</style>
</head>
<body data-topic="algebra">
<div class="nova-wrap">
<header id="nova-header" data-run="F0 · Bank · F0-14" data-title="Axes and plotting primitive" data-sub="Cartesian axes, straight lines and curves, scatter graphs and bar charts from one plotting layer, with shapes and patterns as well as colour."></header>
<main id="gallery"></main>
<section class="nova-card nova-logcard" aria-label="Event log">
<h2 style="font-size:1.1em">Event log (NOVA.events)</h2>
<div id="log" class="nova-log" role="log" aria-live="off"></div>
<button class="nova-btn" id="clearlog">Clear log</button>
</section>
</div>
<script>
@@JS@@
</script>
<script>
/* ===== F0-14 CONFIG: parameters + named presets ===== */
var NOVA_F0_14_CONFIG={
  startMode:'watch',
  type:'line',        /* line | scatter | bar */
  m:2, c:1,           /* y = mx + c for line mode */
  x:[-1,5], y:[-2,12], xStep:1, yStep:2,
  presets:{
    line:   {label:'Straight line y = 2x + 1',type:'line',m:2,c:1,x:[-1,5],y:[-2,12],xStep:1,yStep:2},
    negative:{label:'Negative gradient y = −x + 4',type:'line',m:-1,c:4,x:[-2,6],y:[-3,7],xStep:1,yStep:1},
    scatter:{label:'Scatter: height vs arm span (cm)',type:'scatter',x:[140,180],y:[140,180],xStep:10,yStep:10,data:[[145,143],[150,152],[152,150],[158,160],[160,157],[165,166],[168,170],[172,171],[175,178]]},
    bars:   {label:'Bar chart: favourite fruit',type:'bar',y:[0,12],yStep:2,data:[['Apple',7],['Banana',4],['Grape',9],['Kiwi',3]]},
    gcse:   {label:'GCSE: quadratic y = x² − 2x − 3',type:'curve',x:[-2,4],y:[-5,6],xStep:1,yStep:1}
  }
};
</script>
<script>
/* ===== F0-14 ENGINE ===== */
(function(){
var h=NOVA.h,S=NOVA.svg,C=NOVA_F0_14_CONFIG;
function fmt(v){return NOVA.svg.num?NOVA.svg.num(+(+v).toFixed(2)):String(+(+v).toFixed(2));}
function eqn(m,c){return 'y = '+(m===1?'':m===-1?'\u2212':fmt(m))+'x'+(c?(c>0?' + ':' \u2212 ')+fmt(Math.abs(c)):'');}
function chart(stage,o){var w=h('div',{class:'pl-wrap'}),L=h('div'),R=h('div',{class:'pl-info'});var sv=S.root(300,210,o.alt||'Chart');sv.setAttribute('class','nv-svg pl-svg');L.appendChild(sv);
  var P=NOVA.plot.frame(sv,{x0:34,y0:10,w:252,h:172,x:o.x||[0,1],y:o.y,xStep:o.xStep,yStep:o.yStep,xLabel:o.type==='bar'?null:'x',yLabel:'y',categories:o.type==='bar'?o.data.map(function(d){return d[0];}):null});
  if(o.type==='line'||o.type==='curve'){var f=o.type==='curve'?function(x){return x*x-2*x-3;}:function(x){return o.m*x+o.c;};if(o.showLine!==false)P.line(f,{role:'focus',tag:'line'});
    if(o.pts)P.points(o.pts.map(function(x){return [x,f(x),'('+fmt(x)+', '+fmt(f(x))+')',null];}),{role:'given',shape:'circle'});
    if(o.read!=null){var yv=f(o.read);S.el('path',{d:'M'+P.X(o.read)+','+P.Y(o.y[0]<=0?0:o.y[0])+' V'+P.Y(yv)+' H'+P.X(o.x[0]<=0?0:o.x[0]),'stroke-dasharray':'4 3','stroke-width':1.6,fill:'none',css:'stroke:var(--m-result)'},sv);NOVA.plot.marker(sv,P.X(o.read),P.Y(yv),'diamond',5,'fill:var(--m-result)',{'data-maths':'read'});}
    if(o.cMark){NOVA.plot.marker(sv,P.X(0),P.Y(o.c),'square',4.5,'fill:var(--m-support)',{'data-maths':'c'});}
    if(o.tri){var x1=o.tri[0],x2=o.tri[1];S.el('path',{d:'M'+P.X(x1)+','+P.Y(f(x1))+' H'+P.X(x2)+' V'+P.Y(f(x2)),fill:'none','stroke-width':1.8,'stroke-dasharray':'5 3',css:'stroke:var(--m-op)','data-maths':'tri'},sv);
      var t1=S.el('text',{x:(P.X(x1)+P.X(x2))/2,y:P.Y(f(x1))+14,'text-anchor':'middle',css:'fill:var(--m-op);font:800 10px var(--nova-font-ui)'},sv);t1.textContent='+'+fmt(x2-x1);var t2=S.el('text',{x:P.X(x2)+5,y:(P.Y(f(x1))+P.Y(f(x2)))/2+3,css:'fill:var(--m-op);font:800 10px var(--nova-font-ui)'},sv);t2.textContent=(f(x2)-f(x1)>=0?'+':'')+fmt(f(x2)-f(x1));}}
  else if(o.type==='scatter'){P.points(o.data.map(function(d){return [d[0],d[1],'',null];}),{role:'given',shape:'circle',r:4});if(o.trend)P.line(function(x){return x;},{role:'support',dash:'6 4',tag:'trend'});if(o.extra)P.points([[o.extra[0],o.extra[1],'('+o.extra[0]+', '+o.extra[1]+')','extra']],{role:'focus',shape:'diamond',r:5});}
  else{P.bars(o.data.map(function(d,i){return [d[0],d[1],o.hl===i?'focus':'given',o.hl===i?'bar':null];}),{});}
  var info=o.info||[];for(var i=0;i<4;i++){var t=info[i];R.appendChild(h('div',{class:t?(t.hl?'hl':''):'empty',text:t?t.t:''}));}
  w.appendChild(L);w.appendChild(R);stage.appendChild(w);return {P:P,sv:sv};}
var LN={type:'line',m:2,c:1,x:[-1,5],y:[-2,12],xStep:1,yStep:2},SC=C.presets.scatter,BR=C.presets.bars;
function L(o){return Object.assign({},LN,o);}
var DEMO=[L({showLine:false,info:[{t:'x from −1 to 5, step 1'},{t:'y from −2 to 12, step 2'},{t:'Axes cross at (0, 0)'}]}),
 L({showLine:false,pts:[0,1,2],info:[{t:'x = 0 → y = 1'},{t:'x = 1 → y = 3'},{t:'x = 2 → y = 5',hl:1}]}),
 L({pts:[0,1,2,3],info:[{t:eqn(2,1),hl:1},{t:'Points line up: a straight line'},{t:'(across, up): x first'}]}),
 L({tri:[1,2],cMark:true,info:[{t:'Gradient m = 2 (up 2 per 1 across)',hl:1},{t:'Intercept c = 1 at (0, 1)'},{t:eqn(2,1)}],target:'tri'}),
 Object.assign({},SC,{trend:true,info:[{t:'Each point = one pupil'},{t:'Positive correlation',hl:1},{t:'Trend line: span ≈ height'}]}),
 Object.assign({},BR,{hl:2,info:[{t:'Grape is the mode (9)',hl:1},{t:'Total 23 pupils'},{t:'Bars share one scale'}],target:'bar'}),
 L({read:3,info:[{t:'Read x = 3 up to the line'},{t:'y = 2 × 3 + 1 = 7',hl:1},{t:eqn(2,1)}],target:'read'})];
var steps=[
 {name:'Axes',mood:'neutral',narration:'Every chart starts with axes and a scale. x goes across from −1 to 5; y goes up in steps of 2.',prompt:'What is the y step?'},
 {name:'Plot points',mood:'think',narration:'For y = 2x + 1: when x is 0, y is 1; x is 1, y is 3; x is 2, y is 5. Coordinates are (across, up).',prompt:'Where does (2, 5) go?'},
 {name:'Line',mood:'think',narration:'The points line up, so join them with a straight line: y = 2x + 1.',prompt:'Why is it straight?'},
 {name:'Gradient and intercept',mood:'focus',narration:'Up 2 for every 1 across: the gradient is 2. The line crosses the y axis at 1: the intercept.',prompt:'What is the gradient?',target:'tri'},
 {name:'Scatter',mood:'think',narration:'Scatter graphs show pairs of data. Taller pupils tend to have longer arm spans: positive correlation.',prompt:'What kind of correlation?'},
 {name:'Bars',mood:'focus',narration:'Bar charts compare categories on one scale. Grape is the most popular, with 9 votes. Patterns tell the bars apart without colour.',prompt:'Which fruit is the mode?',target:'bar'},
 {name:'Read a value',mood:'cheer',narration:'To read a value, go up from x = 3 to the line, then across: y = 7.',prompt:'What is y when x = 3?',target:'read'}];
function render(i,stage){stage.innerHTML='';var s=steps[i];NOVA.cap(stage,'Plotting · '+s.name,'step '+(i+1)+'/'+steps.length);chart(stage,DEMO[i]);NOVA.scene.helperStrip(stage,i===steps.length-1?'cheer':'explain',s.name);}
var def={id:'F0-14',title:'Axes and plotting primitive',config:C,steps:steps,render:render,
 alt:'Axes and plotting primitive: Cartesian axes with the line y = 2x + 1, plotted points, a gradient triangle; a scatter graph with a trend line; a patterned bar chart.',
 staticAlt:'y = 2x + 1 through (0, 1), (1, 3), (2, 5), (3, 7): gradient 2, intercept 1. Scatter of height against arm span shows positive correlation. Bar chart: Apple 7, Banana 4, Grape 9, Kiwi 3. Reading x = 3 gives y = 7.',
 exploreIntro:'Explore: choose a chart, change m and c with the sliders, or tap the grid to add a point (it snaps to the scale).',
 explore:function(panel,stage,api){var st=Object.assign({},C.presets.line),added=[];
   function draw(){stage.innerHTML='';NOVA.cap(stage,'Explore · '+st.label,st.type==='line'?eqn(st.m,st.c):st.type);var o=Object.assign({},st);
     if(st.type==='line')o.info=[{t:eqn(st.m,st.c),hl:1},{t:'Gradient '+fmt(st.m)},{t:'Intercept (0, '+fmt(st.c)+')'},{t:added.length?'Last point ('+added[added.length-1].join(', ')+')':'Tap the grid to add a point'}];
     else if(st.type==='scatter')o.info=[{t:st.data.length+' pupils'},{t:'Positive correlation'},{t:added.length?'Added ('+added[added.length-1].join(', ')+')':'Tap to add a pupil'}];
     else if(st.type==='bar')o.info=st.data.map(function(d){return {t:d[0]+': '+d[1]};});else o.info=[{t:'y = x² − 2x − 3'},{t:'Roots x = −1 and x = 3'},{t:'Turning point (1, −4)'}];
     if(st.type==='scatter'&&added.length)o.extra=added[added.length-1];
     var r=chart(stage,o);if(st.type==='line'&&added.length)r.P.points(added.map(function(p){var on=Math.abs(st.m*p[0]+st.c-p[1])<1e-9;return [p[0],p[1],on?'on':'off',null];}),{role:'op',shape:'square',r:4});
     r.sv.addEventListener('pointerdown',function(ev){if(st.type==='bar')return;var pt=r.sv.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;var q=pt.matrixTransform(r.sv.getScreenCTM().inverse()),d=r.P.toData(q.x,q.y);var sx=st.xStep||1,sy=st.type==='scatter'?1:(st.yStep>1?1:st.yStep||1);
       var p=[Math.round(d[0]/sx)*sx,Math.round(d[1]/sy)*sy];if(p[0]<st.x[0]||p[0]>st.x[1]||p[1]<st.y[0]||p[1]>st.y[1])return;added.push(p);if(added.length>6)added.shift();NOVA.events.emit('value',{engine:'F0-14',key:'point',value:p});draw();});
     NOVA.scene.helperStrip(stage,'explain',st.type);}
   var pre=h('select',{class:'nova-input','aria-label':'Chart'});Object.keys(C.presets).forEach(function(k){pre.appendChild(h('option',{value:k,text:C.presets[k].label}));});pre.onchange=function(){st=Object.assign({},C.presets[pre.value]);added=[];sm.set&&sm.set(st.m||0);NOVA.events.emit('value',{engine:'F0-14',key:'preset',value:pre.value});draw();};
   var sm=NOVA.ui.slider({label:'Gradient m',min:-3,max:3,step:0.5,value:st.m,engine:'F0-14',onChange:function(v){if(st.type==='line'){st.m=v;draw();}}});
   var scn=NOVA.ui.slider({label:'Intercept c',min:-2,max:6,step:1,value:st.c,engine:'F0-14',onChange:function(v){if(st.type==='line'){st.c=v;draw();}}});
   panel.appendChild(h('label',{class:'pr-row'},['Chart ',pre]));panel.appendChild(sm);panel.appendChild(scn);
   panel.appendChild(h('div',{class:'pr-row'},[h('button',{class:'nova-btn',text:'Clear points',onclick:function(){added=[];draw();}}),h('button',{class:'nova-btn primary',text:'Check last point',onclick:function(){var p=added[added.length-1];if(!p||st.type!=='line'){api.check(false,'Add a point on the line chart first.',{});return;}var ok=Math.abs(st.m*p[0]+st.c-p[1])<1e-9;api.check(ok,ok?'('+p.join(', ')+') is on '+eqn(st.m,st.c)+'.':'('+p.join(', ')+') is off the line: '+fmt(st.m)+' × '+p[0]+' + '+fmt(st.c)+' = '+fmt(st.m*p[0]+st.c)+'.',{point:p});}})]));
   draw();C._explore={state:st,points:added};},
 challenge:function(panel,api,stage){
   var tasks=[
    {q:'On y = 2x + 1, what is y when x = 4?',build:NOVA.entryTask('y =','F0-14'),check:function(v){var ok=v===9;return [ok,ok?'Yes: 2 × 4 + 1 = 9.':v===7?'That is x = 3. Go up from x = 4.':v===8?'Do not forget the + 1.':v===6?'2 × 4 is 8, not 4 + 2.':'Substitute x = 4 into 2x + 1.'];},hint:'Work out 2 × 4, then add 1.',solve:function(c){c._A.input.value='9';}},
    {q:'Which marked point is (3, 1)?',build:NOVA.choiceTask(['the diamond','the square'],'F0-14'),check:function(v){var ok=v==='the diamond';return [ok,ok?'Yes: 3 across, 1 up.':v?'The square is (1, 3): x comes first, across before up.':'Pick one first.'];},hint:'Along the corridor, then up the stairs: x first.',solve:function(c){c._G.set('the diamond');}},
    {q:'How many more pupils chose Grape than Banana?',build:NOVA.entryTask('more =','F0-14'),check:function(v){var ok=v===5;return [ok,ok?'Yes: 9 − 4 = 5.':v===13?'That adds them. "How many more" means subtract.':'Read both bar heights, then subtract.'];},hint:'Grape 9, Banana 4.',solve:function(c){c._A.input.value='5';}}];
   NOVA.challengeRun(panel,api,tasks,function(k){stage.innerHTML='';NOVA.cap(stage,'Challenge '+(k+1)+' of 3',['read','coordinates','bars'][k]);
     if(k===0)chart(stage,L({info:[{t:eqn(2,1)},{t:'x = 4 → y = ?',hl:1}]}));
     else if(k===1){var r=chart(stage,L({showLine:false,info:[{t:'Two points are marked'},{t:'Which is (3, 1)?',hl:1}]}));NOVA.plot.marker(r.sv,r.P.X(3),r.P.Y(1),'diamond',5.5,'fill:var(--m-focus)');NOVA.plot.marker(r.sv,r.P.X(1),r.P.Y(3),'square',5,'fill:var(--m-op)');}
     else chart(stage,Object.assign({},BR,{info:[{t:'Grape vs Banana',hl:1}]}));NOVA.scene.helperStrip(stage,'think',['y = ?','(3, 1)?','How many more?'][k]);},C);}
};
NOVA.bankMount({id:'F0-14',num:'14',title:'Axes and plotting primitive (Cartesian, scatter, bars)',def:def,linked:['F0-02','F0-04','F0-11','F0-13','F0-15'],
 spec:{purpose:'One plotting layer for every graph in the course: Cartesian axes with any scale and negative quadrants, straight lines and curves from a function, plotted points with shape cues, gradient triangles and read-offs, scatter graphs with trend lines and patterned bar charts.',
  params:'type line | scatter | bar | curve; m, c; x and y ranges; xStep, yStep; data. Core: NOVA.plot.frame(svg, opts) → X, Y, toData, line(fn | points), points([[x,y,label]], {shape}), bars([[cat,val]]); NOVA.plot.marker(shape). Year groups: KS3 Years 7–9 (12–15), with GCSE extension.',
  presets:'y = 2x + 1 · y = −x + 4 · Scatter height vs arm span · Bar chart favourite fruit · GCSE quadratic y = x² − 2x − 3',
  steps:'Axes → Plot points → Line → Gradient and intercept → Scatter → Bars → Read a value. Each step has a Sir Bob line and a Guided prompt. The helper glides to the gradient triangle, the tallest bar and the read-off.',
  interactions:'Watch: auto-play. Guided: step with prompts. Explore: chart preset, m and c sliders, tap the grid to add snapped points (on or off the line), Check last point. Challenge (3 tasks): y when x = 4 (9); pick (3, 1) not (1, 3); Grape − Banana (5). Events: value, correct, step, hintUsed.',
  traps:'Plotting (y, x) instead of (x, y) · Forgetting + c · Reading the gradient as the intercept · Adding instead of finding the difference on bar charts',
  gcse:'Extension: quadratic curves, roots and turning points; linked: F0-15 table of values, F0-16 geometry canvas, F0-11 marking'}});
})();
</script>
<script>
(function(){var log=document.getElementById('log');var addLog=function(e){log.textContent=new Date(e.time).toLocaleTimeString()+' '+e.type+' '+JSON.stringify(e.detail)+'\n'+log.textContent.slice(0,6000);};NOVA.events.history().forEach(addLog);NOVA.events.on('*',addLog);
document.getElementById('clearlog').onclick=function(){log.textContent='';};})();
</script>
