<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA F0-10 · Gallery page shell</title>
<style>
@@CSS@@
/* ---- F0-10 local styles ---- */
.pr-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.pr-task{font-weight:700}
.rs-opts{display:flex;flex-wrap:wrap;gap:6px}
.rs-opts button[aria-pressed="true"]{outline:3px solid var(--m-focus)}
.nova-spec dd{white-space:pre-line}
.xx-h4{margin:0 0 4px;font:800 .68rem var(--nova-font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--v-muted)}
@media print{.nova-tl,.nova-tabs,.nova-helperbar,.nova-panel{display:none!important}}
.gs-shell{margin:8px 12px;border-radius:12px;border:1px solid var(--v-line);background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);overflow:hidden}
.gs-top{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-bottom:1px solid var(--v-line);background:linear-gradient(90deg,var(--topic-glow,rgba(43,220,243,.12)),transparent)}
.gs-top b{font:800 .78rem var(--nova-font-ui)}.gs-top .dot{width:16px;height:16px;border-radius:5px;background:var(--topic-accent,var(--m-focus))}
.gs-top .q{margin-left:auto;font:600 .68rem var(--nova-font-mono,monospace);padding:2px 8px;border-radius:999px;border:1px solid var(--v-line);color:var(--v-muted);min-width:70px;height:18px;overflow:hidden}
.gs-chips{display:flex;gap:5px;padding:6px 10px;height:30px;overflow:hidden;flex-wrap:wrap}
.gs-chips span{font:800 .64rem var(--nova-font-ui);padding:3px 8px;border-radius:999px;border:1px solid var(--v-line);color:var(--v-muted);height:14px}
.gs-chips span.on{background:var(--topic-accent,var(--m-focus));border-color:transparent;color:#06111b}
.gs-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,66px);gap:6px;padding:4px 10px 10px}
@media (max-width:480px){.gs-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,58px)}.gs-grid .t6{display:none}}
.gs-tile{position:relative;border-radius:9px;border:1px solid var(--v-line);background:var(--v-panel2);padding:6px 8px 6px 12px;overflow:hidden;font:700 .7rem/1.25 var(--nova-font-ui);color:var(--v-ink)}
.gs-tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--topic-accent,var(--m-focus))}
.gs-tile small{display:block;color:var(--v-muted);font:800 .6rem var(--nova-font-mono,monospace)}
.gs-tile i{position:absolute;right:6px;bottom:5px;font:800 .58rem var(--nova-font-ui);font-style:normal;padding:1px 6px;border-radius:999px}
.gs-tile i.b{background:var(--m-result);color:#06111b}.gs-tile i.b::before{content:'\2713 '}
.gs-tile i.p{border:1px dashed var(--v-muted);color:var(--v-muted)}.gs-tile i.p::before{content:'\25CC '}
.gs-tile.empty{opacity:.25}.gs-tile.more{display:grid;place-items:center;color:var(--v-muted)}
.gs-tile.hl{box-shadow:0 0 0 2px var(--topic-accent,var(--m-focus))}
.gs-shell.print{background:#fff;color:#111}.gs-shell.print .gs-tile{background:#fff;color:#111;border-color:#999}.gs-shell.print .gs-top{background:#eee}.gs-shell.print .gs-tile small{color:#444}
</style>
</head>
<body data-topic="number">
<div class="nova-wrap">
<header id="nova-header" data-run="F0 · Bank · F0-10" data-title="Gallery page shell" data-sub="The frame every bank page sits in: search, topic filters and tiles straight from the registry, with a topic style layer on top."></header>
<main id="gallery"></main>
<section class="nova-card nova-logcard" aria-label="Event log">
<h2 style="font-size:1.1em">Event log (NOVA.events)</h2>
<div id="log" class="nova-log" role="log" aria-live="off"></div>
<button class="nova-btn" id="clearlog">Clear log</button>
</section>
</div>
<script>
@@JS@@
</script>
<script>
/* ===== F0-10 CONFIG: parameters + named presets ===== */
var NOVA_F0_10_CONFIG={
  startMode:'watch',
  topic:'all',        /* filter: all | number | algebra | geometry | ratio | statistics | probability */
  kind:'all',         /* all | api | primitive | engine | shell */
  query:'',
  layer:'number',     /* data-topic style layer for the shell */
  built:['F0-01','F0-02','F0-03','F0-04','F0-05','F0-06','F0-07','F0-08','F0-09','F0-10'],
  presets:{
    all:     {label:'Whole foundation family',topic:'all',kind:'all',query:'',layer:'number'},
    geometry:{label:'Geometry tools',topic:'geometry',kind:'all',query:'',layer:'geometry'},
    algebra: {label:'Algebra tools',topic:'algebra',kind:'all',query:'',layer:'algebra'},
    apis:    {label:'Shared APIs only',topic:'all',kind:'api',query:'',layer:'ratio'},
    stats:   {label:'GCSE: statistics and plotting',topic:'statistics',kind:'all',query:'',layer:'statistics'}
  }
};
</script>
<script>
/* ===== F0-10 ENGINE ===== */
(function(){
var h=NOVA.h,C=NOVA_F0_10_CONFIG,R=NOVA.registry;
var TOPICS=['all','number','algebra','geometry','ratio','statistics','probability'];
function filter(o){var q=(o.query||'').toLowerCase();return R.list().filter(function(m){return (o.topic==='all'||m.topics.indexOf(o.topic)>=0)&&(o.kind==='all'||m.kind===o.kind)&&(!q||(m.id+' '+m.title).toLowerCase().indexOf(q)>=0);});}
function shell(stage,o){var list=filter(o),sh=h('div',{class:'gs-shell'+(o.print?' print':''),'data-topic':o.layer,'aria-label':'Gallery shell preview'});
  sh.appendChild(h('div',{class:'gs-top'},[h('span',{class:'dot','aria-hidden':'true'}),h('b',{text:'NOVA · F0 gallery'}),h('span',{class:'q','data-maths':o.query?'q':null,text:o.query?'\u2315 '+o.query:'\u2315 search'})]));
  var ch=h('div',{class:'gs-chips'});(o.chips||TOPICS.slice(0,5)).forEach(function(t){ch.appendChild(h('span',{class:t===o.topic?'on':'',text:t}));});sh.appendChild(ch);
  var g=h('div',{class:'gs-grid','aria-label':list.length+' components shown'});for(var i=0;i<6;i++){var m=list[i],cls='gs-tile t'+(i+1);
    if(i===5&&list.length>6){g.appendChild(h('div',{class:cls+' more',text:'+'+(list.length-5)+' more'}));break;}
    if(!m){g.appendChild(h('div',{class:cls+' empty'}));continue;}var b=C.built.indexOf(m.id)>=0;
    g.appendChild(h('div',{class:cls+(o.hl===m.id?' hl':''),'data-topic':m.topics[0]==='all'?o.layer:m.topics[0],'data-maths':o.hl===m.id?'hl':null},[h('small',{text:m.id+' · '+m.kind}),m.title,o.status!==false?h('i',{class:b?'b':'p',text:b?'built':'planned'}):null]));}
  sh.appendChild(g);stage.appendChild(sh);return list;}
var DEMO=[{topic:'all',kind:'all',layer:'number',status:false},{topic:'all',kind:'all',layer:'number',status:false,hl:'F0-01'},{topic:'geometry',kind:'all',layer:'number',status:false,hl:'F0-16'},{topic:'all',kind:'all',query:'plot',layer:'number',status:false,hl:'F0-14'},
 {topic:'algebra',kind:'all',layer:'algebra',status:false},{topic:'all',kind:'all',layer:'number',hl:'F0-10'},{topic:'all',kind:'all',layer:'number',print:true}];
var steps=[
 {name:'Shell',mood:'neutral',narration:'The gallery shell is the frame every bank page sits in: a header, filters, a search box and a grid of engine tiles.',prompt:'What three parts does the shell have?'},
 {name:'From the registry',mood:'think',narration:'Tiles come straight from the registry, so a new engine appears in the gallery as soon as it registers. No hand-made lists.',prompt:'Where does the tile list come from?'},
 {name:'Filter',mood:'think',narration:'Topic chips filter the grid. Choose geometry and only the SVG primitives and the geometry canvas stay.',prompt:'How many geometry tools are there?',target:'hl'},
 {name:'Search',mood:'focus',narration:'Search matches ids and titles: type "plot" and you get the axes and plotting primitive, F0-14.',prompt:'Which id matches "plot"?',target:'q'},
 {name:'Topic layer',mood:'think',narration:'Switch the style layer to algebra and the accents turn gold. Same shell, different topic mood, no extra code.',prompt:'Which colour marks algebra?'},
 {name:'Status',mood:'focus',narration:'Badges show what is built (tick) and what is planned (dotted circle): shape as well as colour, so it works for everyone.',prompt:'How is "planned" shown without colour?',target:'hl'},
 {name:'Print',mood:'cheer',narration:'For print the shell drops its glow and turns into a clean light catalogue a teacher can hand out.',prompt:'What changes in print?'}];
function render(i,stage){stage.innerHTML='';var s=steps[i];NOVA.cap(stage,'Gallery · '+s.name,'step '+(i+1)+'/'+steps.length);shell(stage,DEMO[i]);NOVA.scene.helperStrip(stage,i===steps.length-1?'cheer':'explain',s.name);}
var def={id:'F0-10',title:'Gallery page shell',config:C,steps:steps,render:render,
 alt:'Gallery page shell: a framed preview with header, search box, topic chips and a grid of engine tiles with built or planned badges, recoloured by the topic style layer.',
 staticAlt:'Gallery shell: header "NOVA · F0 gallery", search box, topic chips (all, number, algebra, geometry, ratio). Grid of tiles from the registry, e.g. F0-01 Design tokens (built), F0-14 Axes and plotting (planned). Filtering by geometry leaves F0-02 and F0-16. Search "plot" finds F0-14.',
 exploreIntro:'Explore: filter by topic and kind, search, switch the topic style layer and toggle print view.',
 explore:function(panel,stage,api){var st={topic:C.topic,kind:C.kind,query:C.query,layer:C.layer,print:false};
   function draw(){stage.innerHTML='';var n=filter(st).length;NOVA.cap(stage,'Explore · gallery shell',n+' shown');shell(stage,st);NOVA.scene.helperStrip(stage,'explain',n+' tiles');}
   function val(k,v){NOVA.events.emit('value',{engine:'F0-10',key:k,value:v});}
   var pre=h('select',{class:'nova-input','aria-label':'Preset'});Object.keys(C.presets).forEach(function(q){pre.appendChild(h('option',{value:q,text:C.presets[q].label}));});pre.onchange=function(){Object.assign(st,C.presets[pre.value]);delete st.label;tp.set(st.topic);kd.set(st.kind);ly.value=st.layer;qi.input.value=st.query;val('preset',pre.value);draw();};
   var qi=NOVA.ui.entry({label:'Search',engine:'F0-10-ui'});qi.input.setAttribute('inputmode','text');qi.input.addEventListener('input',function(){st.query=qi.input.value;draw();});
   var tp=NOVA.ui.choice(TOPICS,function(v){st.topic=v;draw();},{value:st.topic,engine:'F0-10',key:'topic',label:'Topic'});
   var kd=NOVA.ui.choice(['all','api','primitive','engine','shell'],function(v){st.kind=v;draw();},{value:st.kind,engine:'F0-10',key:'kind',label:'Kind'});
   var ly=h('select',{class:'nova-input','aria-label':'Style layer'});TOPICS.slice(1).forEach(function(t){ly.appendChild(h('option',{value:t,text:t}));});ly.value=st.layer;ly.onchange=function(){st.layer=ly.value;val('layer',st.layer);draw();};
   var pr=h('button',{class:'nova-btn','aria-pressed':'false',text:'Print view',onclick:function(){st.print=!st.print;pr.setAttribute('aria-pressed',String(st.print));val('print',st.print);draw();}});
   panel.appendChild(h('label',{class:'pr-row'},['Preset ',pre]));panel.appendChild(qi);panel.appendChild(h('div',{class:'pr-row'},[h('span',{class:'pr-task',text:'Topic'}),tp]));panel.appendChild(h('div',{class:'pr-row'},[h('span',{class:'pr-task',text:'Kind'}),kd]));
   panel.appendChild(h('label',{class:'pr-row'},['Style layer ',ly,pr]));draw();C._explore={state:st};},
 challenge:function(panel,api,stage){
   var tasks=[
    {q:'Filter the gallery to geometry. How many tiles are left?',build:NOVA.entryTask('tiles =','F0-10'),check:function(v){var ok=v===2;return [ok,ok?'Yes: F0-02 SVG primitives and F0-16 geometry canvas.':v===17?'That is the whole family. Only geometry tiles stay.':'Count the tiles tagged geometry.'];},hint:'Look for the geometry topic on each registry entry.',solve:function(c){c._A.input.value='2';}},
    {q:'Search for "table". Which component id appears?',build:NOVA.choiceTask(['F0-14','F0-15','F0-11'],'F0-10'),check:function(v){var ok=v==='F0-15';return [ok,ok?'Yes: F0-15 Interactive table.':v?'That title does not contain "table".':'Pick one first.'];},hint:'Search matches the id or the title.',solve:function(c){c._G.set('F0-15');}},
    {q:'Which style layer turns the accents gold?',build:NOVA.choiceTask(['number','algebra','geometry'],'F0-10'),check:function(v){var ok=v==='algebra';return [ok,ok?'Yes: the algebra layer uses gold and purple.':v?'Not that one. Switch layers in Explore to compare.':'Pick one first.'];},hint:'It was the layer shown in the Topic layer step.',solve:function(c){c._G.set('algebra');}}];
   NOVA.challengeRun(panel,api,tasks,function(k){stage.innerHTML='';NOVA.cap(stage,'Challenge '+(k+1)+' of 3',['filter','search','layer'][k]);shell(stage,{topic:'all',kind:'all',layer:'number',query:k===1?'':'',status:true});NOVA.scene.helperStrip(stage,'think',['Filter','Search','Layer'][k]);},C);}
};
NOVA.bankMount({id:'F0-10',num:'10',title:'Gallery page shell',def:def,linked:['F0-01','F0-09','F0-17','all F0 engines'],
 spec:{purpose:'The page frame every bank and lesson gallery uses: header, helper switcher, search, topic and kind filters and a tile grid built live from the registry, with built or planned badges and a per-topic style layer. Lets teachers and builders find the right maths tool fast.',
  params:'topic all | number | algebra | geometry | ratio | statistics | probability; kind all | api | primitive | engine | shell; query text; layer (data-topic style layer); built list. Uses NOVA.registry, data-topic theme variables, NOVA.ui.choice. Year groups: KS3 Years 7–9 (12–15), with GCSE extension.',
  presets:'Whole family · Geometry tools · Algebra tools · Shared APIs only · GCSE statistics and plotting',
  steps:'Shell → From the registry → Filter → Search → Topic layer → Status → Print. Each step has a Sir Bob line and a Guided prompt. The helper glides to the highlighted tile and to the search box.',
  interactions:'Watch: auto-play. Guided: step with prompts. Explore: preset, search, topic chips, kind chips, style layer and print toggle; the tile grid updates live (fixed 6 slots, "+n more"). Challenge (3 tasks): count geometry tiles (2); search "table" (F0-15); pick the gold layer (algebra). Events: value, correct, step, hintUsed.',
  traps:'Hand-made lists that go stale · Colour-only status badges · Filters that hide everything with no message · Print views that keep dark backgrounds',
  gcse:'Extension: the GCSE statistics preset; linked: F0-09 registry, F0-17 print renderer, F0-01 tokens and topic layers'}});
})();
</script>
<script>
(function(){var log=document.getElementById('log');var addLog=function(e){log.textContent=new Date(e.time).toLocaleTimeString()+' '+e.type+' '+JSON.stringify(e.detail)+'\n'+log.textContent.slice(0,6000);};NOVA.events.history().forEach(addLog);NOVA.events.on('*',addLog);
document.getElementById('clearlog').onclick=function(){log.textContent='';};})();
</script>
</body>
</html>
