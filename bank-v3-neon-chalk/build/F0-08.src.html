/* ---- F0-08 local styles ---- */
.pr-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.pr-task{font-weight:700}
.nh-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:8px 12px}

.nh-box h4{margin:0 0 4px;font:800 .68rem var(--nova-font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--v-muted)}
.nh-line{display:block;width:100%;height:auto}

.nh-card{height:92px;overflow:hidden;padding:8px 10px;border-radius:10px;border:1px solid var(--v-line);background:var(--v-panel2);font:600 .82rem/1.45 var(--nova-font-ui);color:var(--v-ink);margin-bottom:6px}

.nh-slot::before{content:'\25CC ';font-size:.8em}
.nh-fill{display:inline-block;padding:0 5px;border-radius:6px;background:rgba(43,220,243,.12);border:1.5px solid var(--m-focus);color:var(--m-focus);font-weight:800}
.nh-fill::before{content:'\25C6 ';font-size:.75em}
.nh-fill.res{border-color:var(--m-result);color:var(--m-result);background:rgba(80,220,140,.12)}
.nh-fill.res::before{content:'\2713 '}
.nh-tags{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px;height:24px;overflow:hidden}
.nh-tags span{font:800 .66rem var(--nova-font-ui);padding:3px 8px;border-radius:999px;border:1px solid var(--v-line);color:var(--v-ink)}
.nh-tags span.on{background:var(--m-focus);color:#06111b;border-color:var(--m-focus)}
.nh-tx{display:grid;grid-template-rows:repeat(3,24px);gap:4px;margin:0;padding:0;list-style:none}
.nh-tx li{height:24px;display:flex;align-items:center;padding:0 8px;border-radius:8px;border:1px solid var(--v-line);font:600 .7rem var(--nova-font-ui);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--v-ink)}
.nh-tx li.empty{opacity:.3}
.rs-opts{display:flex;flex-wrap:wrap;gap:6px}
.rs-opts button[aria-pressed="true"]{outline:3px solid var(--m-focus)}
.nova-spec dd{white-space:pre-line}
@media print{.nova-tl,.nova-tabs,.nova-helperbar,.nova-panel{display:none!important}}
