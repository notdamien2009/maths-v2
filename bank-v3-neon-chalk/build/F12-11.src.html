<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA F12-11 · Circumference unrolling</title>
<style>
@@CSS@@
/* ---- F12-11 local styles ---- */
.nova-spec dd{white-space:pre-line}
.f12-sv [role=button]{outline:none}.f12-sv [role=button]:focus-visible{outline:2px dashed var(--m-focus);outline-offset:4px}
.f12-sv[role=application]:focus-visible{outline:2px dashed var(--m-focus);outline-offset:3px;border-radius:12px}
@media print{.nova-tl,.nova-tabs,.nova-helperbar,.nova-panel{display:none!important}}
</style>
</head>
<body data-topic="geometry">
<div class="nova-wrap">
<header id="nova-header" data-run="F12 · 2D shapes, perimeter and area · F12-11" data-title="Circumference unrolling" data-sub="Roll a circle one full turn to see that the circumference is pi times the diameter."></header>
<main id="gallery"></main>
<section class="nova-card nova-logcard" aria-label="Event log">
<h2 style="font-size:1.1em">Event log (NOVA.events)</h2>
<div id="log" class="nova-log" role="log" aria-live="off"></div>
<button class="nova-btn" id="clearlog">Clear log</button>
</section>
</div>
<script>
@@JS@@
</script>
<script>
/* ===== F12-11 CONFIG: parameters + named presets ===== */
var NOVA_F12_11_CONFIG={
  startMode:'watch',
  preset:'roll',
  unit:'cm',
  presets:{
    roll: {label:'Roll the circle',view:'roll',r:5,u:.5,lay:0,h:6},
    lay:  {label:'Lay the diameters',view:'roll',r:5,u:1,lay:3.14,h:6},
    vocab:{label:'Circle vocabulary',view:'vocab',r:5,u:0,lay:0,h:6},
    can:  {label:'Label of a can',view:'can',r:5,u:1,lay:0,h:6}
  }
};
/* ===== F12-11 ENGINE ===== */
(function(){
var h=NOVA.h,S=NOVA.svg,U=NOVA.ui,F=NOVA.f12,C=NOVA_F12_11_CONFIG,P=C.presets,strip=F.strip,fmt=F.fmt,clone=F.clone,UN=C.unit,VW=440,VH=280,PI=Math.PI;
function r2(x){return fmt(Math.round(x*100)/100);}
function circ(sv,cx,cy,R,role,w){return NOVA.neonPath(sv,'M'+(cx-R)+','+cy+' a'+R+','+R+' 0 1,0 '+2*R+',0 a'+R+','+R+' 0 1,0 '+(-2*R)+',0',{role:role,width:w||3});}
function pt(cx,cy,R,deg){var a=deg*PI/180;return [cx+R*Math.cos(a),cy+R*Math.sin(a)];}
function drawRoll(stage,st){var R=46,x0=76,gy=196,Cpx=2*PI*R,u=st.u,th=u*2*PI,cx=x0+u*Cpx,cy=gy-R,sv=S.root(VW,VH,'A circle of radius '+st.r+' '+UN+' rolled along a line: after one turn it covers the circumference, '+r2(2*PI*st.r)+' '+UN+'.');sv.classList.add('f12-sv');
  F.dash(sv,[x0,gy],[x0+Cpx,gy],'unknown',2);
  if(u>0.001)circ(sv,x0,cy,R,'support',2);
  var rg=circ(sv,cx,cy,R,'op',3.2);if(rg&&rg.setAttribute)rg.setAttribute('data-maths','circle');
  if(u>0.001){var pts=[];for(var k=0;k<=36;k++){var phi=th*k/36,rel=[-R*Math.sin(th-phi),R*Math.cos(th-phi)];pts.push([cx+rel[0],cy+rel[1]]);}NOVA.neonPath(sv,'M'+pts.map(function(q){return q[0]+','+q[1];}).join(' L'),{role:'focus',width:5});
    NOVA.neonLine(sv,x0,gy,x0+u*Cpx,gy,{role:'focus',width:4});}
  var mk=NOVA.neonRing(sv,cx-R*Math.sin(th),cy+R*Math.cos(th),{role:'focus',r:7,pulse:false});if(mk)mk.setAttribute('data-maths','mark');
  S.el('circle',{cx:cx,cy:cy,r:3.5,css:'fill:#cfe6ff'},sv);
  if(u>0.99)S.pill(sv,x0+Cpx/2,gy-18,'circumference C = '+(st.ctext||r2(2*PI*st.r))+' '+UN,{role:'focus',size:12});
  if(st.lay>0){var d=2*R,full=Math.floor(st.lay+1e-9),y=gy+30;for(var k=0;k<full;k++){NOVA.neonLine(sv,x0+k*d+3,y,x0+(k+1)*d-3,y,{role:'given',width:3});S.pill(sv,x0+k*d+d/2,y+17,'d',{role:'given',size:12});}
    var fr=st.lay-full;if(fr>.001){NOVA.neonLine(sv,x0+full*d+3,y,x0+full*d+fr*d,y,{role:'unknown',width:3});S.pill(sv,x0+full*d+Math.max(fr*d/2,12),y+17,r2(fr)+' d',{role:'unknown',size:11});}}
  stage.appendChild(sv);}
function drawVocab(stage,st,hl){var R=80,cx=220,cy=136,sv=S.root(VW,VH,'A circle with its radius, diameter, chord, arc and circumference labelled.');sv.classList.add('f12-sv');
  var rg=circ(sv,cx,cy,R,'op',3.2);if(rg&&rg.setAttribute)rg.setAttribute('data-maths','circle');S.el('circle',{cx:cx,cy:cy,r:3.5,css:'fill:#cfe6ff'},sv);
  var D1=pt(cx,cy,R,200),D2=pt(cx,cy,R,20),Rr=pt(cx,cy,R,-55),K1=pt(cx,cy,R,105),K2=pt(cx,cy,R,160);
  var L=NOVA.neonLine(sv,D1[0],D1[1],D2[0],D2[1],{role:hl==='diameter'?'focus':'op',width:3});NOVA.neonLine(sv,cx,cy,Rr[0],Rr[1],{role:'focus',width:3.4});NOVA.neonLine(sv,K1[0],K1[1],K2[0],K2[1],{role:'given',width:3});
  var arc=[];for(var a=25;a<=75;a+=5)arc.push(pt(cx,cy,R,a));NOVA.neonPath(sv,'M'+arc.map(function(q){return q[0]+','+q[1];}).join(' L'),{role:'result',width:5});
  S.pill(sv,(cx+Rr[0])/2+30,(cy+Rr[1])/2-6,'radius',{role:'focus',size:12});S.pill(sv,(cx+D1[0])/2-12,(cy+D1[1])/2-18,'diameter',{role:'op',size:12});
  var km=[(K1[0]+K2[0])/2,(K1[1]+K2[1])/2];S.pill(sv,km[0]-4,km[1]+22,'chord',{role:'given',size:12});S.pill(sv,arc[5][0]+34,arc[5][1]+14,'arc',{role:'result',size:12});S.pill(sv,cx,cy+R+22,'circumference',{role:'op',size:12});
  stage.appendChild(sv);}
function drawCan(stage,st){var C0=2*PI*st.r,ppc=330/C0,hp=Math.min(st.h*ppc,170),x0=55,y0=60,sv=S.root(VW,VH,'The label of a can unrolls into a rectangle as long as the circumference.');sv.classList.add('f12-sv');
  var g=NOVA.neonShape(sv,[[x0,y0],[x0+330,y0],[x0+330,y0+hp],[x0,y0+hp]],{role:'op',hatch:'cross',width:3});g.setAttribute('data-maths','shape');
  NOVA.dimLine(sv,x0,y0,x0+330,y0,'C = 2πr = '+r2(C0)+' '+UN,{role:'focus',off:-20});NOVA.dimLine(sv,x0+330,y0,x0+330,y0+hp,fmt(st.h)+' '+UN,{role:'given',off:26,lx:0,ly:0});
  stage.appendChild(sv);}
function draw(stage,st,hl){if(st.view==='vocab')drawVocab(stage,st,hl);else if(st.view==='can')drawCan(stage,st);else drawRoll(stage,st);}
function chips(stage,st){var C0=2*PI*st.r,items;
  if(st.view==='vocab')items=[['radius r',st.r+' '+UN,'focus'],['diameter d','2 × r = '+2*st.r+' '+UN,'op']];
  else if(st.view==='can')items=[['curved area = C × h',r2(C0)+' × '+st.h+' = '+r2(C0*st.h)+' '+UN+'²','result']];
  else{items=[['radius',st.r+' '+UN,'given'],['diameter',2*st.r+' '+UN,'op']];if(st.u>.99){items.push(['circumference','2 × π × '+st.r+' = '+r2(C0)+' '+UN,'result']);if(st.lay>0)items.push(['C ÷ d',r2(C0/(2*st.r))+' (π)','focus']);}else items.push(['rolled so far',r2(C0*st.u)+' '+UN,'focus']);}
  strip(stage,items);}
var steps=[
 {name:'Circle vocabulary',mood:'neutral',narration:'The radius goes from the centre to the edge. The diameter goes right across through the centre, twice the radius. A chord joins two points on the edge. An arc is part of the edge. The whole edge is the circumference.',prompt:'Which line is longest: radius, chord or diameter?',st:P.vocab},
 {name:'Roll the circle',mood:'focus',narration:'Mark a point on a circle and roll it along a straight line. The marked point leaves a trail on the circle and the same length is laid on the line.',prompt:'How far has the circle rolled when it turns once?',st:{view:'roll',r:5,u:.5,lay:0,h:6},target:'mark'},
 {name:'One full turn',mood:'cheer',narration:'After one full turn the circle has rolled a distance exactly equal to its circumference. The curved edge has been straightened out into a line.',prompt:'What is the line as long as?',st:{view:'roll',r:5,u:1,lay:0,h:6},target:'mark'},
 {name:'Lay the diameters',mood:'think',narration:'Now lay the diameter along that line. It fits three whole times and a little bit extra, about 0.14 of another one.',prompt:'How many diameters fit in the circumference?',st:{view:'roll',r:5,u:1,lay:3.14,h:6}},
 {name:'The number pi',mood:'cheer',narration:'It is the same for every circle: the circumference is always about 3.14 times the diameter. That number is called pi. So C = π × d, or C = 2 × π × r.',prompt:'What is circumference divided by diameter?',st:{view:'roll',r:5,u:1,lay:3.14,h:6}},
 {name:'Use it',mood:'focus',narration:'For radius 5, the diameter is 10, so C = π × 10 which is about 31.4 centimetres. With a calculator pi button, 31.42.',prompt:'What is the diameter when the radius is 5?',st:{view:'roll',r:5,u:1,lay:0,h:6}},
 {name:'Working backwards',mood:'think',narration:'If the circumference is 62.8 centimetres, divide by pi to find the diameter: 62.8 ÷ 3.14 is 20. So the radius is 10.',prompt:'Do you divide or multiply by pi to find the diameter?',st:{view:'roll',r:10,u:1,lay:0,h:6,ctext:'62.8'},rev:1},
 {name:'The label of a can',mood:'cheer',narration:'Peel the label off a can and lay it flat: a rectangle as long as the circumference. Its area is circumference times height, which gives the curved surface area.',prompt:'What shape is the unrolled label?',st:P.can,target:'shape'}];
function render(i,stage){stage.innerHTML='';var s=steps[i];NOVA.cap(stage,'Circumference unrolling · '+s.name,'step '+(i+1)+'/'+steps.length);draw(stage,s.st);if(s.rev)strip(stage,[['circumference','62.8 '+UN,'result'],['diameter','62.8 ÷ 3.14 = 20','focus'],['radius','10 '+UN,'op']]);else chips(stage,s.st);NOVA.scene.helperStrip(stage,i===steps.length-1?'cheer':'explain',s.name);}
var def={id:'F12-11',title:'Circumference unrolling',config:C,steps:steps,render:render,
 alt:'Circumference unrolling: a circle rolls one full turn along a line, then diameters are laid along the line to show that the circumference is pi times the diameter.',
 staticAlt:'Circle radius 5 cm: circumference 2 × π × 5 ≈ 31.4 cm, about 3.14 diameters long. Unrolled can label: a rectangle C wide and h tall.',
 exploreIntro:'Explore: change the radius, roll the circle with the slider, lay diameters along the line and see that C ÷ d is always pi. Switch to circle vocabulary or the label of a can.',
 explore:function(panel,stage,api){var key=C.preset,st=clone(P[key]),box=h('div');
   function pg(){stage.innerHTML='';NOVA.cap(stage,'Explore · '+({roll:'rolling',vocab:'vocabulary',can:'can label'}[st.view]),'r = '+st.r);draw(stage,st);chips(stage,st);NOVA.scene.helperStrip(stage,'explain','C = 2πr');}
   function build(){box.innerHTML='';box.appendChild(U.slider({label:'Radius',min:1,max:10,step:.5,value:st.r,engine:'F12-11',onChange:function(v){st.r=v;pg();}}));
     if(st.view==='roll'){box.appendChild(U.slider({label:'Roll the circle (0 to 1 turn)',min:0,max:1,step:.02,value:st.u,engine:'F12-11',onChange:function(v){st.u=v;pg();}}));box.appendChild(U.slider({label:'Diameters laid along the line',min:0,max:3.2,step:.1,value:st.lay,engine:'F12-11',onChange:function(v){st.lay=Math.round(v*100)/100;if(st.lay>0)st.u=1;pg();}}));}
     if(st.view==='can')box.appendChild(U.slider({label:'Height',min:2,max:9,step:1,value:st.h,engine:'F12-11',onChange:function(v){st.h=v;pg();}}));}
   var pre=h('select',{class:'nova-input','aria-label':'View'});Object.keys(P).forEach(function(k){pre.appendChild(h('option',{value:k,text:P[k].label}));});pre.value=key;
   pre.onchange=function(){key=pre.value;st=clone(P[key]);build();pg();NOVA.events.emit('value',{engine:'F12-11',control:'preset',value:key});};
   panel.appendChild(h('label',{class:'pr-row'},['View ',pre]));panel.appendChild(box);build();pg();},
 challenge:function(panel,api,stage){var A={view:'roll',r:7,u:1,lay:0,h:6},B={view:'roll',r:5,u:1,lay:0,h:6},V=P.vocab;
   var tasks=[
    {q:'A circle has radius 7 cm. What is its circumference? (1 decimal place)',build:NOVA.entryTask('Circumference (cm)','F12-11'),check:function(x){var ok=Math.abs(x-43.98)<.15;return [ok,ok?'Yes: 2 × π × 7 ≈ 44.0 cm.':Math.abs(x-21.99)<.15?'That is π × r. The circumference is π × DIAMETER, so double the radius first.':Math.abs(x-153.9)<.5?'That is the area, π × r². Circumference is the distance round.':x===14?'14 is the diameter. Multiply it by π.':'C = 2 × π × r.'];},hint:'Diameter is 14. Circumference = π × 14.',solve:function(c){c._A.input.value='44';}},
    {q:'A circle has circumference 31.4 cm. What is its diameter? (nearest whole number)',build:NOVA.entryTask('Diameter (cm)','F12-11'),check:function(x){var ok=Math.abs(x-10)<.15;return [ok,ok?'Yes: 31.4 ÷ π ≈ 10 cm.':x===5?'5 is the radius. The question asks for the diameter, which is double.':Math.abs(x-98.6)<1?'You multiplied by π. To find the diameter, DIVIDE the circumference by π.':'Diameter = circumference ÷ π.'];},hint:'Circumference ÷ π gives the diameter.',solve:function(c){c._A.input.value='10';}},
    {q:'Which word describes a straight line from the centre of a circle to its edge?',build:NOVA.choiceTask(['Radius','Diameter','Chord'],'F12-11'),check:function(x){var ok=x==='Radius';return [ok,ok?'Yes: the radius runs from the centre to the edge.':x==='Diameter'?'The diameter goes right across, through the centre. It is two radii.':x==='Chord'?'A chord joins two points on the edge and need not touch the centre.':'Pick one first.'];},hint:'It is half of the diameter.',solve:function(c){c._G.set('Radius');}}];
   function paintC(k){stage.innerHTML='';NOVA.cap(stage,'Challenge '+(k+1)+' of 3',['circumference','work backwards','vocabulary'][k]);draw(stage,[A,B,V][k]);strip(stage,k===0?[['radius','7 cm','given']]:k===1?[['circumference','31.4 cm','result'],['diameter','?','unknown']]:[['find','the word','focus']]);NOVA.scene.helperStrip(stage,'think',['C = 2πr','Divide by π','Name it'][k]);}
   NOVA.challengeRun(panel,api,tasks,paintC,C);}
};
NOVA.bankMount({id:'F12-11',num:'F12·11',title:'Circumference unrolling',def:def,linked:['F0-02','F0-11','F12-10','F12-12','F12-13','F13-10'],
 spec:{purpose:'Where the circumference formula comes from. A circle with a marked point rolls one full turn along a line; the line it covers is the circumference. Laying diameters along it shows the ratio C ÷ d is always the same number, pi. Also covers circle vocabulary, reverse problems, and the unrolled label of a can (curved surface area of a cylinder).',
  params:'preset (roll, lay, vocab, can); radius r; roll progress u (0 to 1 turn); diameters laid (0 to 3.2); can height h; unit cm. The rolled arc and marker use the rolling-circle geometry. Core: NOVA.neonRing / neonPath / neonLine / dimLine, NOVA.f12.dash. Year groups: KS3 Years 7–9 (12–15).',
  presets:'Roll the circle · Lay the diameters · Circle vocabulary · Label of a can',
  steps:'Circle vocabulary → Roll the circle → One full turn → Lay the diameters → The number pi → Use it → Working backwards → The label of a can. Each step has a Sir Bob line and a Guided prompt; the helper points at the marked point.',
  interactions:'Watch: auto-play. Guided: step with prompts. Explore: view, radius, roll slider, diameters-laid slider and can height; chips show radius, diameter, rolled distance, circumference, C ÷ d and curved area. Challenge (3 tasks): circumference from radius; diameter from circumference; name the radius. Events: value, correct, step, hintUsed.',
  traps:'Using π × r as the circumference · confusing circumference with area (π r²) · multiplying instead of dividing by π when working backwards · giving the radius when the diameter is asked for · treating a chord as a diameter',
  gcse:'Extension: answers in terms of π, arc length and sector perimeter, rolling-wheel problems, perimeter of semicircles; linked: F12-12 circle area, F12-13 arcs and sectors, F13-10 cylinders'}});
var log=document.getElementById('log');var addLog=function(e){log.textContent=new Date(e.time).toLocaleTimeString()+' '+e.type+' '+JSON.stringify(e.detail)+'\n'+log.textContent.slice(0,6000);};NOVA.events.history().forEach(addLog);NOVA.events.on('*',addLog);
document.getElementById('clearlog').onclick=function(){log.textContent='';};
})();

</script>
</body>
</html>
