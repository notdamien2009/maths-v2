<header id="nova-header" data-run="F0 · Bank · F0-04" data-title="Interaction kit" data-sub="Drag-snap, slider, stepper, entry, sort and match: one set of controls every NOVA engine shares, all driving the same maths value."></header>

<script>
/* ===== F0-04 CONFIG: parameters + named presets ===== */
var NOVA_F0_04_CONFIG={
  startMode:'watch',
  min:-1, max:2,        /* number line range */
  step:0.25,            /* snap step shared by drag, slider and stepper */
  labelStep:0.5,        /* number line labels */
  value:0.75,           /* demo value */
  sortItems:['0.3','1/3','-0.5','0.25'],
  matchLeft:['1/2','1/4','3/5','1/5'], matchRight:['0.5','0.25','0.6','0.2','0.35'],
  presets:{
    quarters: {label:'Quarters on 0 to 2',min:0,max:2,step:0.25,labelStep:0.5,value:0.75},
    tenths:   {label:'Tenths on 0 to 1',min:0,max:1,step:0.1,labelStep:0.2,value:0.3},
    integers: {label:'Integers −10 to 10',min:-10,max:10,step:1,labelStep:2,value:-3},
    negatives:{label:'Halves −3 to 3',min:-3,max:3,step:0.5,labelStep:1,value:-1.5},
    gcse:     {label:'GCSE: thousands, step 250',min:0,max:5000,step:250,labelStep:1000,value:1750}
  }
};
</script>
<script>
/* ===== F0-04 ENGINE ===== */
(function(){
var h=NOVA.h,S=NOVA.svg,U=NOVA.ui,C=NOVA_F0_04_CONFIG,G=document.getElementById('gallery'),W=360,H=120;
function fmt(v){return S.num(Math.round(v*1e6)/1e6);}
function val(t){return U.parseNum(t);}
/* line(stage,st,pts): number line with plotted points [{v,role,label,target}] */
function line(stage,st,pts){var sv=S.root(W,H,''),ax=S.axes(sv,{x:24,y:70,w:312,h:0,xmin:st.min,xmax:st.max,ymin:0,ymax:0,ticks:st.labelStep,numberLine:true});
  (pts||[]).forEach(function(p){var g=S.point(sv,ax.sx(p.v),ax.y0,{role:p.role||'focus',r:6,glow:true});if(p.label)S.pill(sv,ax.sx(p.v),ax.y0-(p.hi?50:24),p.label,{role:p.role||'focus',size:12});if(p.target&&g&&g.setAttribute)g.setAttribute('data-target',p.target);});
  sv.setAttribute('aria-label','Number line '+fmt(st.min)+' to '+fmt(st.max)+(pts&&pts.length?'. Points: '+pts.map(function(p){return (p.label||fmt(p.v))+' at '+fmt(p.v);}).join(', '):'')+'.');
  stage.appendChild(sv);return {sv:sv,ax:ax};}
function cap(stage,left,tag){stage.appendChild(h('div',{class:'nv-cap'},[h('span',{text:left}),tag?h('span',{class:'tag',text:tag}):null]));}
function strip(stage,items){var d=h('div',{class:'kit-strip'});items.forEach(function(it){d.appendChild(h('span',{class:'kit-ctl'},[h('span',{class:'ic',text:it[0]}),it[1]+' ',h('b',{text:it[2]})]));});stage.appendChild(d);}
var steps=[
 {name:'Drag-snap',mood:'focus',narration:'Drag the marker and let go: it snaps to the nearest '+fmt(C.step)+'. Dropped at 1.3, it snaps to 1.25. Arrow keys move it one step.',prompt:'Dropped at 1.3 with steps of 0.25: where does it snap?'},
 {name:'Slider',mood:'think',narration:'The slider sets the same value. Slide to 1.5 and the marker follows. One value, many controls.',prompt:'If the slider reads 1.5, where is the marker?'},
 {name:'Stepper',mood:'think',narration:'The stepper adds or takes one step. 1.5 plus one step of 0.25 is 1.75.',prompt:'What is 1.5 plus one step of 0.25?'},
 {name:'Entry',mood:'focus',narration:'Type an answer as a fraction, decimal or percent. 3/4, 0.75 and 75% all land on the same point.',prompt:'Type 3 quarters three different ways.'},
 {name:'Sort',mood:'think',narration:'Sort by value, not by how the numbers look. −0.5 is smallest; 0.3 is less than 1/3 because 1/3 is 0.333…',prompt:'Which is bigger: 0.3 or 1/3?'},
 {name:'Match',mood:'think',narration:'Match each fraction to its decimal. 3/5 is 0.6, not 0.35: the digits are a trap.',prompt:'What decimal matches 3/5?'},
 {name:'All linked',mood:'cheer',narration:'Every control reads and writes the same value and emits a value event. Engines just choose which ones to show.',prompt:'Which control would you use on a phone?'}];
function render(i,stage){stage.innerHTML='';var st=C,s=steps[i];cap(stage,'Kit · '+s.name,'step '+(i+1)+'/'+steps.length);var cue='';
  if(i===0){line(stage,{min:0,max:2,labelStep:.5},[{v:1.3,role:'support',label:'drop 1.3',hi:true},{v:1.25,role:'focus',label:'1.25',target:'snap'}]);strip(stage,[['\u25C6','Snap step','0.25']]);cue='Snaps to 1.25';}
  else if(i===1){line(stage,{min:0,max:2,labelStep:.5},[{v:1.5,role:'focus',label:'1.5'}]);strip(stage,[['\u2550','Slider','1.5']]);cue='Slider \u2192 1.5';}
  else if(i===2){line(stage,{min:0,max:2,labelStep:.5},[{v:1.5,role:'given',label:'1.5'},{v:1.75,role:'result',label:'1.75',hi:true,target:'step'}]);strip(stage,[['\u00B1','Stepper','1.5 + 0.25 = 1.75']]);cue='+1 step';}
  else if(i===3){line(stage,{min:0,max:2,labelStep:.5},[{v:.75,role:'unknown',label:'3/4 = 0.75 = 75%',target:'entry'}]);strip(stage,[['\u270E','Entry','3/4'],['\u270E','Entry','0.75'],['\u270E','Entry','75%']]);cue='Same point';}
  else if(i===4){line(stage,{min:-1,max:1,labelStep:.5},[{v:-.5,role:'given',label:'\u22120.5'},{v:.25,role:'given',label:'0.25',hi:true},{v:.3,role:'focus',label:'0.3'},{v:1/3,role:'result',label:'1/3',hi:true}]);strip(stage,[['\u2195','Sorted','\u22120.5 < 0.25 < 0.3 < 1/3']]);cue='Smallest first';}
  else if(i===5){line(stage,{min:0,max:1,labelStep:.25},[{v:.5,role:'result',label:'1/2'},{v:.25,role:'result',label:'1/4',hi:true},{v:.6,role:'result',label:'3/5',hi:true},{v:.2,role:'result',label:'1/5'}]);var pr=h('div',{class:'kit-pairs'});[['1/2','0.5'],['1/4','0.25'],['3/5','0.6'],['1/5','0.2']].forEach(function(p){pr.appendChild(h('span',{text:p[0]+' \u2194 '+p[1]}));});pr.appendChild(h('span',{class:'bad',text:'0.35 \u2716 no match'}));stage.appendChild(pr);cue='4 pairs';}
  else {line(stage,{min:0,max:2,labelStep:.5},[{v:.75,role:'result',label:'0.75',target:'all'}]);strip(stage,[['\u25C6','Drag','0.75'],['\u2550','Slider','0.75'],['\u00B1','Stepper','0.75'],['\u270E','Entry','3/4']]);cue='One value';}
  NOVA.scene.helperStrip(stage,i===steps.length-1?'cheer':'explain',cue);}
/* deliberate point-to on steps that target one maths element */
var PT={'Drag-snap':'snap','Stepper':'step','Entry':'entry'};
NOVA.events.on('step',function(e){var d=e.detail||{};if(d.engine!=='F0-04'||!PT[d.name])return;setTimeout(function(){var st=document.querySelector('#F0-04 .nova-stage'),t=st&&st.querySelector('[data-target='+PT[d.name]+']');if(t)NOVA.scene.pointTo(st,t);},350);});
var def={id:'F0-04',title:'Interaction kit',config:C,steps:steps,render:render,
 alt:'Interaction kit: a number line with one value that can be set by dragging a snapping marker, a slider, a stepper or typed entry, plus sort and match controls.',
 staticAlt:'Number line 0 to 2 with a marker at 0.75. Controls: drag-snap (step 0.25), slider, stepper (±0.25), entry accepting 3/4, 0.75 or 75%. Sorted: −0.5 < 0.25 < 0.3 < 1/3. Matched: 1/2–0.5, 1/4–0.25, 3/5–0.6, 1/5–0.2; 0.35 has no match.',
 exploreIntro:'Explore: every control drives the same value. Drag, slide, step or type, then sort and match.',
 explore:function(panel,stage,api){var st=JSON.parse(JSON.stringify(C)),v=st.value,order=st.sortItems.slice(),mk,sl,sp,en,fb=h('div',{class:'nova-fb'});
   function draw(){stage.innerHTML='';cap(stage,'Explore · one value','v = '+fmt(v));var r=line(stage,st,order.map(function(t,i){var x=val(t);return isFinite(x)&&x>=st.min&&x<=st.max?{v:x,role:'support',label:t,hi:i%2===1}:null;}).filter(Boolean));
     mk=U.dragSnap(r.sv,r.ax,{y:r.ax.y0,value:v,min:st.min,max:st.max,step:st.step,role:'focus',label:'Value marker',engine:'F0-04',onChange:function(x){set(x,'drag');}});
     NOVA.scene.helperStrip(stage,'explain','v = '+fmt(v));}
   function set(x,src){v=+(+x).toFixed(6);if(src!=='slider')sl.input.value=v;sl.querySelector('output').textContent=fmt(v);if(src!=='stepper')sp.set&&sp.querySelector('output')&&(sp.querySelector('output').textContent=fmt(v));sp._v=v;if(src!=='drag')draw();else{stage.querySelector('.nv-cap .tag').textContent='v = '+fmt(v);var b=stage.querySelector('.nv-dockbub');if(b)b.textContent='v = '+fmt(v);}}
   var pre=h('select',{class:'nova-input','aria-label':'Preset'});Object.keys(C.presets).forEach(function(k){pre.appendChild(h('option',{value:k,text:C.presets[k].label}));});
   var ctl=h('div');function build(){ctl.innerHTML='';
     sl=U.slider({label:'Slider',min:st.min,max:st.max,step:st.step,value:v,engine:'F0-04',onChange:function(x){set(x,'slider');}});
     sp=h('div',{class:'nova-row',role:'group','aria-label':'Stepper'},['Stepper ',h('button',{class:'nova-btn','aria-label':'Decrease by one step',text:'\u2212',onclick:function(){step(-1);}}),h('output',{'aria-live':'polite',text:fmt(v),style:'min-width:3em;text-align:center;font-weight:700'}),h('button',{class:'nova-btn','aria-label':'Increase by one step',text:'+',onclick:function(){step(1);}})]);
     en=U.entry({label:'Type a value',engine:'F0-04'});en.input.placeholder='3/4, 0.75 or 75%';en.input.addEventListener('keydown',function(e){if(e.key==='Enter')go();});
     ctl.appendChild(sl);ctl.appendChild(sp);ctl.appendChild(h('div',{class:'pr-row'},[en,h('button',{class:'nova-btn',text:'Set',onclick:go})]));ctl.appendChild(fb);}
   function step(d){var x=NOVA.clamp(Math.round((v+d*st.step)/st.step)*st.step,st.min,st.max);NOVA.events.emit('value',{engine:'F0-04',control:'Stepper',value:x});set(x,'stepper');}
   function go(){var x=val(en.get());if(!isFinite(x)){fb.className='nova-fb bad';fb.textContent='I can read 0.75, 3/4, 1 1/2 or 75%.';return;}var sx=NOVA.clamp(Math.round(x/st.step)*st.step,st.min,st.max);fb.className='nova-fb hint';fb.textContent=fmt(x)+(Math.abs(sx-x)>1e-9?' snaps to '+fmt(sx):' is on the line')+'.';set(sx,'entry');}
   pre.onchange=function(){var q=C.presets[pre.value];['min','max','step','labelStep','value'].forEach(function(k){st[k]=q[k];});v=st.value;build();draw();NOVA.events.emit('value',{engine:'F0-04',control:'preset',value:pre.value});};
   var so=U.sort({items:order,label:'Sort these by value',engine:'F0-04'});NOVA.events.on('value',function(e){if(e.detail&&e.detail.control==='Sort these by value'&&mode()){order=e.detail.value;draw();}});
   function mode(){return stage.isConnected&&panel.contains(so);}
   panel.appendChild(h('label',{class:'pr-row'},['Preset ',pre]));panel.appendChild(ctl);panel.appendChild(h('p',{class:'pr-task',text:'Sort (top = smallest)'}));panel.appendChild(so);
   panel.appendChild(h('p',{class:'pr-task',text:'Match: pick a fraction, then its decimal'}));panel.appendChild(U.match({left:st.matchLeft,right:st.matchRight,label:'Match fractions to decimals',engine:'F0-04'}));
   build();draw();C._explore={set:function(x){set(x,'api');},get:function(){return v;}};},
 challenge:function(panel,api,stage){var k=0,v=0,st={min:0,max:2,labelStep:.5,step:.25};
   var T=[{q:'Put the marker on three quarters. Use any control.',kind:'value'},{q:'Sort these from smallest to largest.',kind:'sort'},{q:'Match every fraction to its decimal.',kind:'match'}];
   var qp=h('p',{class:'pr-task'}),ctl=h('div'),so,ma,sl,en;
   function draw(){stage.innerHTML='';cap(stage,'Challenge '+(k+1)+' of 3',T[k].kind);if(k===0){var r=line(stage,st,[]);U.dragSnap(r.sv,r.ax,{y:r.ax.y0,value:v,min:0,max:2,step:.25,role:'focus',label:'Value marker',engine:'F0-04',onChange:function(x){v=x;if(sl)sl.input.value=x;}});}
     else if(k===1)line(stage,{min:-1,max:1,labelStep:.5},[]);else line(stage,{min:0,max:1,labelStep:.25},[]);NOVA.scene.helperStrip(stage,'think',T[k].q.split('.')[0]);}
   function load(){qp.textContent=T[k].q;ctl.innerHTML='';
     if(k===0){sl=U.slider({label:'Slider',min:0,max:2,step:.25,value:v,engine:'F0-04',onChange:function(x){v=x;draw();}});en=U.entry({label:'Or type it',engine:'F0-04'});ctl.appendChild(sl);ctl.appendChild(h('div',{class:'pr-row'},[en,h('button',{class:'nova-btn',text:'Set',onclick:function(){var x=val(en.get());if(isFinite(x)){v=NOVA.clamp(Math.round(x/.25)*.25,0,2);sl.input.value=v;draw();}}})]));}
     else if(k===1){so=U.sort({items:['0.3','1/3','-0.5','0.25'],label:'Sort smallest to largest',engine:'F0-04'});ctl.appendChild(so);}
     else {ma=U.match({left:['1/2','1/4','3/5','1/5'],right:['0.5','0.25','0.6','0.2','0.35'],label:'Match fractions to decimals',engine:'F0-04'});ctl.appendChild(ma);}draw();}
   function check(){if(k===0){var ok=Math.abs(v-.75)<1e-9;return [ok,ok?'Yes, 0.75.':v===1.5?'That is 3/2. A quarter is 0.25, so three quarters is 0.75.':v===.25||v===.5?'Count three quarter-steps from 0.':'Three quarters is 3 \u00F7 4 = 0.75.'];}
     if(k===1){var a=so.get().map(val),ok=a.every(function(x,i){return i===0||a[i-1]<=x;});return [ok,ok?'Sorted by value.':a[0]!==-0.5?'Negatives are smaller than every positive: \u22120.5 goes first.':'Compare as decimals: 1/3 = 0.333…, so 0.3 comes before 1/3.'];}
     var p=ma.get(),A={'1/2':'0.5','1/4':'0.25','3/5':'0.6','1/5':'0.2'},bad=Object.keys(A).filter(function(x){return p[x]!==A[x];});return [!bad.length,!bad.length?'All four matched. 0.35 was the trap.':p['3/5']==='0.35'?'3/5 is not 0.35: divide 3 by 5 to get 0.6.':'Check '+bad.join(', ')+': divide top by bottom.'];}
   panel.appendChild(qp);panel.appendChild(ctl);
   panel.appendChild(h('div',{class:'pr-row'},[h('button',{class:'nova-btn primary',text:'Check',onclick:function(){var r=check();api.check(r[0],r[1]+(r[0]&&k<2?' Next task.':''),{task:k});if(r[0]&&k<2){var tm=setTimeout(function(){k++;load();},700);api.onCleanup(function(){clearTimeout(tm);});}}}),
     h('button',{class:'nova-btn ghost',text:'Hint',onclick:function(){api.hint(['A quarter is 0.25. Take three of them.','Write each as a decimal first: 1/3 = 0.333…','Divide the top by the bottom: 3 \u00F7 5.'][k]);}})]));
   C._challenge={solve:function(){if(k===0){v=.75;draw();}else if(k===1)so.set(['-0.5','0.25','0.3','1/3']);}};load();}
};
var card=h('section',{class:'nova-card nova-engine',id:'F0-04','aria-labelledby':'F0-04-h'},[h('h2',{id:'F0-04-h',class:'nova-eh'},[h('span',{class:'nova-id',text:'04'}),h('span',{text:'Interaction kit (drag-snap, slider, stepper, sort, match, entry)'})])]);
var spec={purpose:'The shared controls every NOVA engine uses to let pupils set and compare values: a drag-snap marker, slider, stepper, typed entry (fractions, decimals, percents), sort and match. They all read and write one value and emit the same events, so any lesson can pick the controls that suit it.',
 params:'min, max, step (shared snap), labelStep, value, sortItems, matchLeft / matchRight. Core: NOVA.ui.dragSnap / slider / stepper / entry / sort / match, NOVA.ui.parseNum. Year groups: KS3 Years 7–9 (12–15), with GCSE extension.',
 presets:'quarters 0–2 · tenths 0–1 · integers −10 to 10 · halves −3 to 3 · GCSE thousands step 250',
 steps:'Drag-snap → Slider → Stepper → Entry → Sort → Match → All linked. Each step has a Sir Bob Maximus narration line and a Guided prompt. On Drag-snap, Stepper and Entry the helper glides to point at the target, then returns to its corner.',
 interactions:'Watch: auto-play. Guided: step with prompts. Explore: preset; drag the marker (arrow keys, Home and End), slider, stepper, typed entry; sort list (up/down buttons); match by picking a fraction and then a decimal. Challenge (3 tasks): place 3/4 with any control (0.75); sort 0.3, 1/3, −0.5, 0.25; match four fractions to decimals with 0.35 as a distractor. Events: value, correct, step, hintUsed.',
 traps:'Reading 3/4 as 3/2 or as 0.34 · Sorting by how many digits a number has (0.25 > 0.3) · Treating −0.5 as bigger than 0.25 · Matching 3/5 to 0.35 because of the digits',
 gcse:'Extension: the GCSE preset (thousands, step 250) supports estimation and bounds; entry parses mixed numbers and percents; linked: F0-03 timeline, F0-05 maths text, F0-07 events, F0-11 assessment, F0-12 game wrapper, F0-16 geometry canvas'};
card.appendChild(NOVA.specCard(spec));
card.appendChild(h('p',{class:'purpose',style:'margin:6px 0 0'},[h('strong',{text:'Year groups: '}),'KS3 Years 7–9 (12–15). ',h('strong',{text:'Linked components: '}),'F0-03, F0-05, F0-07, F0-11, F0-12, F0-16.']));
var demo=h('div',{'aria-label':'Interaction kit live demo'});card.appendChild(h('h3',{text:'Live demo · F0-04'}));card.appendChild(demo);G.appendChild(card);
window.F0_04=NOVA.mountEngine(demo,def);
var log=document.getElementById('log');var addLog=function(e){log.textContent=new Date(e.time).toLocaleTimeString()+' '+e.type+' '+JSON.stringify(e.detail)+'\n'+log.textContent.slice(0,6000);};NOVA.events.history().forEach(addLog);NOVA.events.on('*',addLog);
