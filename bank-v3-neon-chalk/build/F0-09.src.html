<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA F0-09 · Registry and lesson manifest</title>
<style>
@@CSS@@
/* ---- F0-09 local styles ---- */
.pr-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.pr-task{font-weight:700}
.rs-opts{display:flex;flex-wrap:wrap;gap:6px}
.rs-opts button[aria-pressed="true"]{outline:3px solid var(--m-focus)}
.nova-spec dd{white-space:pre-line}
.xx-h4{margin:0 0 4px;font:800 .68rem var(--nova-font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--v-muted)}
@media print{.nova-tl,.nova-tabs,.nova-helperbar,.nova-panel{display:none!important}}
.mf-wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px;padding:8px 12px}
@media (max-width:480px){.mf-wrap{grid-template-columns:1fr}}
.mf-steps{display:grid;grid-template-rows:repeat(5,40px);gap:5px;margin:0;padding:0;list-style:none}
.mf-steps li{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:6px;height:40px;padding:0 8px;border-radius:9px;border:1px solid var(--v-line);background:var(--v-panel2);font:600 .72rem/1.2 var(--nova-font-ui);color:var(--v-ink);overflow:hidden}
.mf-steps li .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:800 .66rem var(--nova-font-ui);background:var(--v-line)}
.mf-steps li .t{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mf-steps li .t small{display:block;color:var(--v-muted);font-weight:600}
.mf-steps li .o{font:800 .64rem var(--nova-font-ui);padding:2px 7px;border-radius:999px;border:1px solid var(--m-support);color:var(--m-support)}
.mf-steps li.bad{border-color:var(--m-error);box-shadow:inset 0 0 0 1px var(--m-error)}
.mf-steps li.bad .n{background:var(--m-error);color:#06111b}.mf-steps li.bad .n::after{content:'\2716';font-size:.6rem;margin-left:1px}
.mf-steps li.hl{border-color:var(--m-focus);box-shadow:0 0 0 2px var(--m-focus)}
.mf-steps li.empty{opacity:.3}
.mf-order{display:flex;flex-wrap:wrap;gap:5px;min-height:62px;align-content:flex-start}
.mf-order span{font:800 .68rem var(--nova-font-mono,monospace);padding:3px 7px;border-radius:7px;border:1px solid var(--v-line);color:var(--v-ink);background:var(--v-panel2)}
.mf-order span.dep{border-style:dashed;color:var(--v-muted)}
.mf-order span.dep::before{content:'\25B3 ';}
.mf-order span.use{border-color:var(--m-focus);color:var(--m-focus)}.mf-order span.use::before{content:'\25C6 ';}
.mf-val{height:58px;overflow:hidden;margin-top:6px;padding:6px 8px;border-radius:8px;border:1px dashed var(--v-line);font:600 .7rem/1.35 var(--nova-font-ui);color:var(--v-muted)}
.mf-val.ok{border-color:var(--m-result);color:var(--m-result)}.mf-val.ok::before{content:'\2713 ';font-weight:900}
.mf-val.err{border-color:var(--m-error);color:var(--m-error)}.mf-val.err::before{content:'\2716 ';font-weight:900}
.mf-obj{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;height:26px;overflow:hidden}
.mf-obj span{font:800 .66rem var(--nova-font-ui);padding:3px 8px;border-radius:999px;border:1px solid var(--m-support);color:var(--v-ink)}
</style>
</head>
<body data-topic="number">
<div class="nova-wrap">
<header id="nova-header" data-run="F0 · Bank · F0-09" data-title="Registry and lesson manifest" data-sub="A catalogue of every engine and a simple recipe for lessons: which component, which mode, which objective. Checked before pupils ever see it."></header>
<main id="gallery"></main>
<section class="nova-card nova-logcard" aria-label="Event log">
<h2 style="font-size:1.1em">Event log (NOVA.events)</h2>
<div id="log" class="nova-log" role="log" aria-live="off"></div>
<button class="nova-btn" id="clearlog">Clear log</button>
</section>
</div>
<script>
@@JS@@
</script>
<script>
/* ===== F0-09 CONFIG: parameters + named presets (lesson manifests) ===== */
var NOVA_F0_09_CONFIG={
  startMode:'watch',
  preset:'fractions',
  presets:{
    fractions:{label:'Y7 Fractions of amounts',lesson:'Y7-FR-03',title:'Fractions of amounts',objectives:{O1:'Find a unit fraction of an amount',O2:'Find a non-unit fraction of an amount'},
      steps:[{component:'F0-05',mode:'watch',objective:'O1',note:'Show 3/4 of 24'},{component:'F0-13',mode:'guided',objective:'O1',note:'Worked example: 1/4 of 24'},{component:'F0-04',mode:'explore',objective:'O2',note:'Entry: 3/4 of 24'},{component:'F0-11',mode:'challenge',objective:'O2',note:'Quiz: 5 questions'},{component:'F0-12',mode:'challenge',objective:'O2',note:'Game round'}]},
    graphs:{label:'Y8 Plotting straight lines',lesson:'Y8-AL-07',title:'Plotting y = mx + c',objectives:{O1:'Complete a table of values',O2:'Plot points and draw the line'},
      steps:[{component:'F0-15',mode:'watch',objective:'O1',note:'Table for y = 2x + 1'},{component:'F0-14',mode:'guided',objective:'O2',note:'Plot the points'},{component:'F0-15',mode:'explore',objective:'O1',note:'Change m and c'},{component:'F0-11',mode:'challenge',objective:'O2',note:'Quiz'}]},
    angles:{label:'Y7 Angles on a line',lesson:'Y7-GE-02',title:'Angles on a straight line',objectives:{O1:'Angles on a line add to 180°'},
      steps:[{component:'F0-16',mode:'watch',objective:'O1',note:'Measure two angles'},{component:'F0-13',mode:'guided',objective:'O1',note:'Find the missing angle'},{component:'F0-11',mode:'challenge',objective:'O1',note:'Quiz'}]},
    gcse:{label:'GCSE: Standard form',lesson:'G-NU-12',title:'Standard form calculations',objectives:{O1:'Write numbers in standard form',O2:'Multiply in standard form'},
      steps:[{component:'F0-05',mode:'watch',objective:'O1',note:'3.2 × 10⁴'},{component:'F0-06',mode:'explore',objective:'O1',note:'Seeded practice'},{component:'F0-13',mode:'guided',objective:'O2',note:'(2 × 10³)(4 × 10⁵)'},{component:'F0-11',mode:'challenge',objective:'O2',note:'Exam-style'}]}
  }
};
</script>
<script>
/* ===== F0-09 ENGINE ===== */
(function(){
var h=NOVA.h,C=NOVA_F0_09_CONFIG,R=NOVA.registry,M=NOVA.manifest;
function clone(o){return JSON.parse(JSON.stringify(o));}
function board(stage,m,o){o=o||{};var w=h('div',{class:'mf-wrap'}),L=h('div',{},[h('h4',{class:'xx-h4',text:'Manifest · '+m.lesson+' · '+m.title})]),Rr=h('div',{},[h('h4',{class:'xx-h4',text:o.right||'Load order (dependencies first)'})]);
  var errs=o.validate?M.validate(m):[],bad={};errs.forEach(function(e){bad[e.step]=1;});
  var ul=h('ul',{class:'mf-steps','aria-label':'Lesson steps'});for(var i=0;i<5;i++){var s=m.steps[i];if(!s||(o.upto!=null&&i>=o.upto)){ul.appendChild(h('li',{class:'empty'},[h('span',{class:'n',text:String(i+1)}),h('span',{class:'t',text:'—'}),h('span')]));continue;}
    var reg=R.get(s.component);ul.appendChild(h('li',{class:(bad[i]?'bad':'')+(o.hl===i?' hl':''),'data-maths':bad[i]?'bad':o.hl===i?'hl':null},[h('span',{class:'n',text:String(i+1)}),h('span',{class:'t'},[s.component+' · '+(reg?reg.title:'not registered'),h('small',{text:s.mode+' · '+s.note})]),h('span',{class:'o',text:s.objective||'?'})]));}
  L.appendChild(ul);
  if(o.order){var used={};m.steps.forEach(function(s){used[s.component]=1;});var od=h('div',{class:'mf-order','aria-label':'Load order','data-maths':'order'});M.order(m).forEach(function(id){od.appendChild(h('span',{class:used[id]?'use':'dep',text:id}));});Rr.appendChild(od);}
  else if(o.list){var ld=h('div',{class:'mf-order','aria-label':'Registry'});o.list.forEach(function(r){ld.appendChild(h('span',{class:o.listUse&&o.listUse.indexOf(r.id)>=0?'use':'dep',text:r.id}));});Rr.appendChild(ld);}
  if(o.validate){Rr.appendChild(h('div',{class:'mf-val '+(errs.length?'err':'ok'),'aria-live':'polite','data-maths':'val',text:errs.length?errs.map(function(e){return e.msg;}).join(' '):'Valid: every component is registered, every mode is real and every step has an objective.'}));}
  if(o.obj){var ob=h('div',{class:'mf-obj'});var g=M.objectives(m);Object.keys(m.objectives).forEach(function(k){ob.appendChild(h('span',{text:k+': steps '+(g[k]||[]).map(function(x){return x+1;}).join(', ')}));});Rr.appendChild(ob);}
  w.appendChild(L);w.appendChild(Rr);stage.appendChild(w);}
var BASE=C.presets.fractions,BROKEN=clone(BASE);BROKEN.steps[3].component='F0-99';BROKEN.steps[4].mode='play';
var DEMO=[{m:BASE,list:R.list(),right:'Registry · '+R.list().length+' components'},{m:BASE,list:R.find('number'),listUse:['F0-05','F0-13'],right:'Lookup: topic "number"',hl:0},{m:BASE,upto:5,right:'Steps reference components',list:R.list(),listUse:['F0-05','F0-13','F0-04','F0-11','F0-12']},
 {m:BROKEN,validate:1,right:'Validate',target:'bad'},{m:BASE,validate:1,right:'Validate after fixing'},{m:BASE,order:1,validate:1,target:'order'},{m:BASE,order:1,obj:1,right:'Objectives map to steps'}];
var steps=[
 {name:'Registry',mood:'neutral',narration:'Every engine registers itself: an id, a title, what kind it is, its topics and what it depends on. Seventeen foundation parts so far.',prompt:'How many components are registered?'},
 {name:'Lookup',mood:'think',narration:'Lessons can look parts up by topic. Ask for "number" and you get the maths text renderer and the worked example stepper.',prompt:'Which engine shows worked examples?'},
 {name:'Manifest',mood:'think',narration:'A lesson manifest is a list of steps. Each step names a component, a mode and a learning objective: here, fractions of amounts.',prompt:'Which step is the quiz?'},
 {name:'Validate',mood:'focus',narration:'Validation catches mistakes before pupils see them: F0-99 is not a real component, and "play" is not a mode.',prompt:'What is wrong with step 4?',target:'bad'},
 {name:'Fix',mood:'cheer',narration:'Point step 4 at F0-11 and use challenge mode. Now the manifest is valid.',prompt:'Which modes are allowed?'},
 {name:'Load order',mood:'focus',narration:'The registry works out the load order: shared parts like design tokens and events come before the engines that need them.',prompt:'Why does F0-01 load first?',target:'order'},
 {name:'Objectives',mood:'cheer',narration:'Each objective links to its steps, so a report can say how pupils did on O1 and O2 separately.',prompt:'Which steps cover O2?'}];
function render(i,stage){stage.innerHTML='';var s=steps[i],d=DEMO[i];NOVA.cap(stage,'Registry · '+s.name,'step '+(i+1)+'/'+steps.length);board(stage,d.m,d);NOVA.scene.helperStrip(stage,i===steps.length-1?'cheer':'explain',s.name);}
var def={id:'F0-09',title:'Registry and lesson manifest',config:C,steps:steps,render:render,
 alt:'Registry and lesson manifest: a five-step lesson list (component, mode, objective) beside the component registry, a validation panel and the computed load order.',
 staticAlt:'Lesson Y7-FR-03 Fractions of amounts: 1 F0-05 watch O1; 2 F0-13 guided O1; 3 F0-04 explore O2; 4 F0-11 challenge O2; 5 F0-12 challenge O2. Validation flags unknown components (F0-99) and invalid modes (play). Load order puts dependencies such as F0-01 and F0-07 first.',
 exploreIntro:'Explore: pick a lesson, edit any step\u2019s component, mode or objective, then validate and see the load order update.',
 explore:function(panel,stage,api){var m=clone(C.presets[C.preset]),sel=0;
   function draw(){stage.innerHTML='';NOVA.cap(stage,'Explore · '+m.lesson,M.validate(m).length?'invalid':'valid');board(stage,m,{order:1,validate:1,hl:sel});NOVA.scene.helperStrip(stage,'explain','Step '+(sel+1));}
   function val(k,v){NOVA.events.emit('value',{engine:'F0-09',key:k,value:v});}
   var pre=h('select',{class:'nova-input','aria-label':'Lesson'});Object.keys(C.presets).forEach(function(q){pre.appendChild(h('option',{value:q,text:C.presets[q].label}));});pre.onchange=function(){m=clone(C.presets[pre.value]);sel=0;sync();val('preset',pre.value);draw();};
   var stp=NOVA.ui.stepper({label:'Step',value:1,min:1,max:5,step:1,engine:'F0-09-ui',onChange:function(v){sel=Math.min(v,m.steps.length)-1;sync();draw();}});
   var cs=h('select',{class:'nova-input','aria-label':'Component'});R.list().map(function(r){return r.id;}).concat(['F0-99']).forEach(function(id){cs.appendChild(h('option',{value:id,text:id+(R.get(id)?' · '+R.get(id).title:' (unregistered)')}));});
   var ms=h('select',{class:'nova-input','aria-label':'Mode'});M.MODES.concat(['play']).forEach(function(x){ms.appendChild(h('option',{value:x,text:x}));});
   var os=h('select',{class:'nova-input','aria-label':'Objective'});
   function sync(){var s=m.steps[sel];os.innerHTML='';Object.keys(m.objectives).concat(['']).forEach(function(k){os.appendChild(h('option',{value:k,text:k||'(none)'}));});cs.value=s.component;ms.value=s.mode;os.value=s.objective||'';}
   cs.onchange=function(){m.steps[sel].component=cs.value;val('component',cs.value);draw();};ms.onchange=function(){m.steps[sel].mode=ms.value;val('mode',ms.value);draw();};os.onchange=function(){m.steps[sel].objective=os.value;val('objective',os.value);draw();};
   panel.appendChild(h('label',{class:'pr-row'},['Lesson ',pre]));panel.appendChild(stp);[['Component',cs],['Mode',ms],['Objective',os]].forEach(function(p){panel.appendChild(h('label',{class:'pr-row'},[p[0]+' ',p[1]]));});
   panel.appendChild(h('div',{class:'pr-row'},[h('button',{class:'nova-btn primary',text:'Validate',onclick:function(){var e=M.validate(m);api.check(!e.length,e.length?e[0].msg:'Valid manifest. Load order: '+M.order(m).join(' → '),{validate:true});}})]));
   sync();draw();C._explore={manifest:m};},
 challenge:function(panel,api,stage){var G=C.presets.graphs,B2=clone(BASE);B2.steps[2].mode='play';
   var tasks=[
    {q:'F0-13 (worked examples) depends on F0-03, F0-05 and F0-08. In the fractions lesson, which must load before F0-13?',build:NOVA.choiceTask(['F0-03 timeline','F0-11 assessment','F0-12 game wrapper'],'F0-09'),
     check:function(v){var ok=v==='F0-03 timeline';return [ok,ok?'Yes: F0-13 uses the timeline, so F0-03 loads first.':v?'That one loads after F0-13 or does not need it. Look at F0-13\u2019s dependencies.':'Pick one first.'];},hint:'Dependencies always load before the engine that needs them.',solve:function(c){c._G.set('F0-03 timeline');}},
    {q:'In the Y8 plotting lesson, how many steps cover objective O1?',build:NOVA.entryTask('steps =','F0-09'),
     check:function(v){var ok=v===2;return [ok,ok?'Yes: steps 1 and 3 cover O1.':v===4?'That is every step. Count only the O1 tags.':v===1?'There is another O1 step further down.':'Count the O1 tags on the steps.'];},hint:'Look at the objective pill on each step.',solve:function(c){c._A.input.value='2';}},
    {q:'One step in this manifest is invalid. Which step number is it?',build:NOVA.entryTask('step =','F0-09'),
     check:function(v){var ok=v===3;return [ok,ok?'Yes: step 3 uses "play", which is not a mode.':v===5?'Step 5 is a game, but its mode is challenge, which is valid.':'Check each step\u2019s mode against watch, guided, explore, challenge.'];},hint:'Allowed modes: watch, guided, explore, challenge.',solve:function(c){c._A.input.value='3';}}];
   NOVA.challengeRun(panel,api,tasks,function(k){stage.innerHTML='';NOVA.cap(stage,'Challenge '+(k+1)+' of 3',['dependencies','objectives','validate'][k]);board(stage,k===1?G:k===2?B2:BASE,k===0?{order:1}:k===1?{obj:0,list:R.find('algebra'),right:'Registry: algebra'}:{list:R.list(),right:'Registry'});NOVA.scene.helperStrip(stage,'think',['Load order','Objectives','Find the bad step'][k]);},C);}
};
NOVA.bankMount({id:'F0-09',num:'09',title:'Registry and lesson manifest',def:def,linked:['F0-03','F0-07','F0-10','F0-11','F0-12','F0-13','F0-17'],
 spec:{purpose:'The catalogue and the lesson recipe. Every engine registers its id, kind, topics and dependencies; a lesson manifest lists steps (component, mode, objective). The registry validates manifests, works out the load order and maps objectives to steps for reports. Demo lessons are real maths: fractions of amounts, straight-line graphs, angles, standard form.',
  params:'preset lesson; per step: component (registry id), mode watch | guided | explore | challenge, objective (declared in the manifest), note. Core: NOVA.registry.add / get / has / list(filter) / find(topic); NOVA.manifest.validate / order / objectives / MODES. Year groups: KS3 Years 7–9 (12–15), with GCSE extension.',
  presets:'Y7 Fractions of amounts · Y8 Plotting straight lines · Y7 Angles on a line · GCSE Standard form',
  steps:'Registry → Lookup → Manifest → Validate → Fix → Load order → Objectives. Each step has a Sir Bob line and a Guided prompt. The helper glides to the invalid step and to the load order.',
  interactions:'Watch: auto-play. Guided: step with prompts. Explore: choose a lesson, pick a step (stepper), edit its component, mode and objective, Validate (fires correct). Challenge (3 tasks): which dependency loads before F0-13 (F0-03); count the O1 steps in the Y8 lesson (2); find the invalid step (3). Events: value, correct, step, hintUsed.',
  traps:'Loading an engine before its dependencies · Inventing modes ("play") · Steps with no objective, so reports cannot attribute results · Assuming a game step is invalid',
  gcse:'Extension: the GCSE standard form lesson; objectives feed F0-11 results-by-objective; linked: F0-10 gallery shell, F0-11 assessment, F0-12 game wrapper, F0-17 print export'}});
})();
</script>
<script>
(function(){var log=document.getElementById('log');var addLog=function(e){log.textContent=new Date(e.time).toLocaleTimeString()+' '+e.type+' '+JSON.stringify(e.detail)+'\n'+log.textContent.slice(0,6000);};NOVA.events.history().forEach(addLog);NOVA.events.on('*',addLog);
document.getElementById('clearlog').onclick=function(){log.textContent='';};})();
</script>
</body>
</html>
