/* V8 visual clarity lock: Bob uses the original three-card Design-C side column. */
/* V11 DECIMAL REFERENCE LOCK: the decimal point is structural, never the active highlight. */
#bobLessonPage [data-nova-decimal-anchor],
[data-nova-decimal-anchor]{background:transparent!important;border:0!important;box-shadow:none!important;filter:none!important;animation:none!important;color:inherit!important}
#bobLessonPage [data-nova-decimal-anchor] small,
[data-nova-decimal-anchor] small{color:var(--v-muted)!important;text-transform:lowercase!important;letter-spacing:.03em!important}

/* VALUE is the target column: it must read as the anchor, not another ordinary cell. */
.nvis-order-head>span:first-child,.nvis-order-row>*:first-child,.deep-compare-grid>span:first-child,.deep-compare-grid>b{background:linear-gradient(145deg,rgba(49,220,255,.18),rgba(49,220,255,.08));color:var(--v-cyan)!important;border-right:2px solid color-mix(in srgb,var(--v-cyan) 65%,var(--v-line))!important;font-weight:1000}
.nvis-order-head>span:first-child,.deep-compare-grid>span:first-child{box-shadow:inset 0 -3px 0 var(--v-cyan)}

/* Decimal anchor is one fixed, even-width separator everywhere. */
.nvis-dec-anchor,.decimal-fixed,.decimal-head,.decimal-cell{box-sizing:border-box}
.nvis-dec-anchor,.decimal-fixed{width:42px!important;min-width:42px!important;max-width:42px!important;background:transparent!important;border:0!important;box-shadow:none!important;color:var(--v-text)!important}
.decimal-head,.decimal-cell{background:rgba(255,209,102,.10)!important;border-left:2px solid #ffd166!important;border-right:2px solid #ffd166!important;color:#ffd166!important}

.order-chip-row button[draggable=true]{cursor:grab}.order-chip-row button[draggable=true]:active{cursor:grabbing}
.order-place-line.drag-over{outline:4px solid #ffd166;outline-offset:5px;border-radius:12px;background:rgba(255,209,102,.06)}

  background:transparent!important;border:0!important;box-shadow:none!important;filter:none!important;
  animation:none!important;color:var(--v-text)!important
}

  width:42px!important;min-width:42px!important;max-width:42px!important;
  display:grid!important;place-items:center!important;align-content:center!important
}

  display:block!important;color:var(--v-muted)!important;text-transform:lowercase!important;
  letter-spacing:.03em!important;font:1000 .52rem/1.05 Inter,ui-sans-serif,system-ui,sans-serif!important
}

/* NOVA HOME-ED Y7-001 — focused place-value visual extensions.
   These extend the approved L001 visual family without introducing any new curriculum concept. */
.he-partition-strip{
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
}
.he-partition-strip>div{
  min-width:92px;padding:14px 12px;border:1px solid var(--v-line);border-radius:12px;
  background:var(--v-panel);font:1000 1.25rem/1 "Cambria Math",serif;text-align:center
}
.he-partition-strip>span{font-weight:1000;color:var(--v-cyan);font-size:1.3rem}

.he-place-builder .he-builder-title{
  display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px
}
.he-place-builder .he-builder-title b{font:1000 2rem/1 "Cambria Math",serif;color:var(--v-yellow)}
.he-place-builder .he-builder-title span{color:var(--v-muted);font-weight:850}
.he-builder-grid{
  display:grid;grid-template-columns:repeat(3,minmax(90px,1fr)) 42px repeat(3,minmax(90px,1fr));
  border:1px solid var(--v-line);border-radius:14px;overflow:hidden;background:var(--v-panel)
}
.he-builder-grid button,.he-builder-grid .he-dp{
  min-height:110px;border:0;border-right:1px solid var(--v-line);background:transparent;color:var(--v-ink);
  display:grid;place-items:center;align-content:center;gap:5px;padding:9px
}
.he-builder-grid button{cursor:pointer}
.he-builder-grid button:last-child{border-right:0}
.he-builder-grid button small,.he-builder-grid .he-dp small{
  color:var(--v-muted);font-size:.62rem;font-weight:1000;text-transform:uppercase
}
.he-builder-grid button b,.he-builder-grid .he-dp b{font:1000 2rem/1 "Cambria Math",serif}
.he-builder-grid button em{font-style:normal;color:var(--v-cyan);font-weight:950}
.he-builder-grid button.active{
  background:linear-gradient(145deg,rgba(255,209,102,.28),rgba(255,171,77,.16));
  box-shadow:inset 0 0 0 3px var(--v-yellow)
}
.he-builder-controls{display:flex;justify-content:center;margin-top:12px}

.he-zero-compare{
  display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center
}
.he-zero-compare>div{
  border:1px solid var(--v-line);border-radius:14px;background:var(--v-panel);
  min-height:126px;display:grid;place-items:center;align-content:center;gap:6px;padding:14px;text-align:center
}
.he-zero-compare>div.good{border:2px solid var(--v-green);background:rgba(65,227,166,.08)}
.he-zero-compare>div.bad{border:2px solid var(--v-red);background:rgba(255,113,132,.08)}
.he-zero-compare>div small{color:var(--v-muted);font-weight:1000;text-transform:uppercase}
.he-zero-compare>div b{font:1000 1.7rem/1 "Cambria Math",serif}
.he-zero-compare>div span{color:var(--v-muted);font-size:.82rem}
.he-zero-compare>strong{color:var(--v-yellow);text-align:center}

.he-zero-demo .he-zero-number{
  display:grid;grid-template-columns:repeat(3,1fr) 42px repeat(3,1fr);
  border:1px solid var(--v-line);border-radius:14px;overflow:hidden;background:var(--v-panel)
}
.he-zero-number>span,.he-zero-number>b{
  min-height:88px;display:grid;place-items:center;border-right:1px solid var(--v-line);
  font:1000 2.2rem/1 "Cambria Math",serif
}
.he-zero-number>b{border-right:1px solid var(--v-line);color:var(--v-ink)}
.he-zero-number .placeholder-zero{
  color:var(--v-yellow);background:rgba(255,209,102,.12);box-shadow:inset 0 0 0 2px rgba(255,209,102,.45)
}
.he-zero-number .placeholder-zero.removed{opacity:.1;transform:scale(.72)}
.he-zero-labels{
  display:grid;grid-template-columns:repeat(3,1fr) 42px repeat(3,1fr);
  color:var(--v-muted);font-size:.62rem;font-weight:1000;text-transform:uppercase;text-align:center;margin-top:5px
}
.he-zero-labels i{font-style:normal;text-transform:lowercase}
.he-zero-controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.he-zero-controls button{
  border:1px solid var(--v-line);background:var(--v-panel);color:var(--v-ink);border-radius:10px;
  padding:9px 12px;font-weight:900;cursor:pointer
}

.he-place-chain{
  display:grid;grid-template-columns:repeat(7,auto);gap:8px;align-items:center;justify-content:center
}
.he-place-chain>div{
  min-width:96px;padding:14px 10px;border:1px solid var(--v-line);border-radius:12px;
  background:var(--v-panel);display:grid;gap:4px;text-align:center;font:1000 1.35rem/1 "Cambria Math",serif
}
.he-place-chain>div small{font:900 .62rem/1.1 Inter,sans-serif;color:var(--v-muted);text-transform:uppercase}
.he-place-chain>span{color:var(--v-yellow);font-weight:1000}

.he-multiplier-row{
  display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:8px
}
.he-multiplier-row>span{
  border:1px solid var(--v-line);border-radius:12px;background:var(--v-panel);padding:13px 9px;
  text-align:center;font:900 1rem/1.3 "Cambria Math",serif
}
.he-multiplier-row b{color:var(--v-yellow)!important}

.he-system-line{
  display:grid;grid-template-columns:repeat(4,minmax(72px,1fr)) 32px repeat(3,minmax(72px,1fr));
  gap:6px;align-items:center;margin-top:12px
}

}

.he-chain-interactive .he-chain-cells{

}
.he-chain-cells>div,.he-chain-cells>.he-dp{

.he-chain-cells>div b,.he-chain-cells>.he-dp b{font:1000 1.65rem/1 "Cambria Math",serif}
.he-chain-cells>div.active{

}
.he-chain-controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}

.ng-stages,.ng-controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.ng-stages .active{outline:2px solid var(--stage-accent,#3ad6c6);outline-offset:2px}.ng-panel{min-width:0}.ng-panel h4{font-size:1.125rem;line-height:1.45}.ng-panel p,.ng-status{font-size:1rem;line-height:1.6;overflow-wrap:anywhere}.ng-chart{position:relative;min-width:0;width:100%}.ng-moving-digit{position:absolute;z-index:5;display:grid;place-items:center;pointer-events:none;color:#fff;font-size:26px;font-weight:950;line-height:1}.ng-equation{font-size:1.125rem!important;font-weight:850}.ng-feedback{min-height:4.8em}.ng-evidence{padding:10px 14px;border-left:3px solid var(--stage-accent,#3ad6c6);background:var(--shell-panel2,#0e2b40)}.ng-evidence p{margin:6px 0}.nova-game-workspace .quick-check{margin-top:16px}.ng-stages .nova-btn,.ng-controls .nova-btn{white-space:normal;min-height:44px;max-width:100%;font-size:1rem}.nova-game-workspace button:focus-visible{outline:3px solid var(--stage-accent,#3ad6c6);outline-offset:3px}
@media(max-width:600px){.ng-stages{display:grid;grid-template-columns:1fr 1fr}.ng-controls .nova-btn{flex:1 1 140px}.nova-game-workspace{padding:12px}.ng-head{display:block}.ng-head h4{margin-top:10px}}
</style>
<style id="lesson2-victory">
    .nova-victory-overlay{position:fixed;inset:0;z-index:2147483000;background:rgba(2,7,22,.8);display:grid;place-items:center;padding:18px;overflow:hidden}
    .nova-victory-confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
    .nova-confetti-piece{position:absolute;top:-28px;left:var(--left);width:12px;height:22px;border-radius:3px;opacity:0;transform:rotate(0deg);animation:nova-win-fall var(--duration) ease-in var(--delay) forwards}
    @keyframes nova-win-fall{0%{transform:translateY(-35px) rotate(0deg);opacity:1}85%{opacity:1}100%{transform:translate(var(--drift),110vh) rotate(900deg);opacity:0}}
    .nova-victory-sticker{position:relative;z-index:1;width:min(94vw,475px);padding:34px 22px 30px;text-align:center;color:#eef7ff;background:linear-gradient(155deg,#142643,#08182d 75%);border:3px solid #ffcc58;border-radius:28px;box-shadow:0 0 40px rgba(255,204,88,.32),0 26px 80px #000b;animation:nova-win-pop .65s cubic-bezier(.18,1.45,.32,1) both}
    .nova-victory-medal{width:125px;height:125px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;font-size:78px;color:#112237;background:radial-gradient(circle at 35% 25%,#fff2af,#ffcc58 45%,#d68b17 90%);border:7px double #fff0b1;box-shadow:0 0 38px rgba(255,204,88,.55)}
    .nova-victory-heading{font:900 clamp(22px,4vw,35px) var(--nova-font-ui,system-ui);color:#ffcc58;letter-spacing:.055em}
    .nova-victory-title{font:900 clamp(19px,3vw,26px) var(--nova-font-ui,system-ui);color:#eef7ff;margin-top:9px}
    .nova-victory-sticker p{font:700 17px var(--nova-font-ui,system-ui);color:#c7dcef;margin:16px auto 24px}
    .nova-victory-sticker button{min-height:48px;padding:12px 22px}
    @keyframes nova-win-pop{from{transform:scale(.45) rotate(-9deg);opacity:0}to{transform:scale(1) rotate(0deg);opacity:1}}
    @media(prefers-reduced-motion:reduce){.nova-confetti-piece,.nova-victory-sticker{animation:none!important}}

<script id="novaLockedProductEngine">
const DATA=JSON.parse(document.getElementById('novaLessonData').textContent);
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v??'').trim().toLowerCase().replace(/\s+/g,'');
function bobHead(label,title,text){return `<div class="sir-bob-stage-head"><div class="bob-mini">BM</div><div><span class="stage-head-name">Sir Bob Maximus · ${esc(label)}</span><h3>${esc(title)}</h3><p>${esc(text)}</p></div></div>`}
function workpad(){return `<div class="workpad-tools"><button type="button" class="workpad-toggle">✏️ Working pad</button></div><div class="workpad"><div class="workpad-caption"><span>Rough working · not marked</span><button type="button" class="workpad-clear">Clear</button></div><canvas></canvas></div>`}
function qCard(q,mode){
 const isMCQ=q.type==='mcq'||q.type==='visual-mcq';
 const isWritten=q.type==='written';
 const live=(mode==='start')||(mode==='practice'&&q.checking==='live');
 const visual=q.visualHtml||'';
 const answerControl=isMCQ
   ?`<div class="choices">${(q.options||[]).map(o=>`<button class="choice" type="button" data-value="${esc(o)}">${esc(o)}</button>`).join('')}</div>`
   :(isWritten
      ?`<div class="q-row"><textarea aria-label="Written answer"></textarea>${live?'<button class="nova-btn check-btn q-live-check" type="button">Check</button>':''}${!live&&mode==='practice'?'<span class="deferred-badge">Marked in end result</span>':''}</div>`
      :`<div class="q-row"><input aria-label="Answer" />${live?'<button class="nova-btn check-btn q-live-check" type="button">Check</button>':''}${!live&&mode==='practice'?'<span class="deferred-badge">Marked in end result</span>':''}</div>`);
 const afterChoices=isMCQ
   ?`<div class="q-row">${live?'<button class="nova-btn check-btn q-live-check" type="button">Check</button>':''}${!live&&mode==='practice'?'<span class="deferred-badge">Marked in end result</span>':''}</div>`
   :'';
 const hintId=`bob-hint-${String(q.id||'q').replace(/[^a-z0-9_-]/gi,'-')}`;
 const askBob=(mode!=='exit'&&q.hint)
   ?`<button type="button" class="nova-btn ghost hint-btn" aria-expanded="false" aria-controls="${esc(hintId)}">Ask Bob</button>`
   :'';
 return `<div class="q tier-${esc(q.tier)}" data-qid="${esc(q.id)}" data-mode="${mode}" data-type="${esc(q.type)}" data-role="${esc(q.role||'')}" data-checking="${esc(q.checking||'')}">
   <span class="q-tier-label">${esc(q.tier)}${q.type.startsWith('visual-')?' · visual':''}</span>
   <strong>${esc(q.question)}</strong>
   ${visual}
   ${answerControl}
   ${afterChoices}
   <div class="workpad-tools"><button type="button" class="workpad-toggle">✏️ Working pad</button>${askBob}</div>
   ${q.hint&&mode!=='exit'?`<div class="support bob-hint-card" id="${esc(hintId)}" hidden aria-hidden="true"><div class="bob-mini">BM</div><div><strong>Sir Bob Maximus · hint</strong><p>${esc(q.hint)}</p></div></div>`:''}
   <div class="workpad"><div class="workpad-caption"><span>Rough working · not marked</span><button type="button" class="workpad-clear">Clear</button></div><canvas></canvas></div>
   <div class="feedback"></div>
 </div>`
}

function novaPageFooter(){
 return `<footer class="nova-page-footer" aria-label="NOVA lesson property notice"><span>Original KS3 Maths content · Not for redistribution without permission ·</span><span class="nova-mark nova-footer-logo" aria-label="NOVA">NOVA</span><span class="nova-footer-property">property</span></footer>`
}

function renderStart(){
 const s=DATA.start;
 $('#stageStart').innerHTML=`<article class="nova-card">${bobHead('Big idea',s.bigIdeaTitle,s.bigIdeaIntro)}<div class="objective-detail"><strong>By the end of this lesson you should understand:</strong><ul class="objective-list">${s.goalBullets.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="nova-grid-3">${s.conceptCards.map(c=>`<div class="mini-card"><strong>${esc(c.title)}</strong><p>${esc(c.text)}</p></div>`).join('')}</div></article><article class="nova-card math-paper">${bobHead('Quick start','Quick diagnostic · what do you already know?','These warm-ups check the ideas we will build on.')}<div>${s.diagnostic.map(q=>qCard(q,'start')).join('')}</div></article><div class="stage-handover start-bob-handover"><div><strong>Bob · ready when you are</strong><p>${esc(s.handoverText||'When you are ready, move into Bob’s teaching page. He will build the lesson idea in the lesson concepts before you take control in Learn.')}</p></div><button class="nova-btn" type="button" id="startLearnWithBob">Learn with Bob →</button></div>${novaPageFooter()}`;
 $('#startLearnWithBob').onclick=showBob;
}

let bi=0,bState=0,bPlaying=false,bSpeed=1,bVoice=false,bToken=0;
function bobMathToSpeech(text){const div=document.createElement('div');div.innerHTML=String(text??'');return(div.textContent||'').replace(/×/g,' times ').replace(/÷/g,' divided by ').replace(/√/g,' square root of ').replace(/²/g,' squared ').replace(/³/g,' cubed ').replace(/=/g,' equals ').replace(/\+/g,' plus ').replace(/−|-/g,' minus ').replace(/\(/g,' open bracket ').replace(/\)/g,' close bracket ').replace(/\s+/g,' ').trim()}
function pause(ms){return new Promise(r=>setTimeout(r,ms/bSpeed))}
const NOVA_BOB_DEFAULT_VOICE_NAME = "Microsoft Ryan Online (Natural) - English (United Kingdom)";
const NOVA_BOB_DEFAULT_VOICE_LANG = "en-GB";
function bobLockedRyanVoice(voices){
  return voices.find(v=>v.name===NOVA_BOB_DEFAULT_VOICE_NAME && /^en-GB$/i.test(v.lang))
    || voices.find(v=>/Microsoft Ryan Online \(Natural\)/i.test(v.name) && /^en-GB/i.test(v.lang))
    || voices.find(v=>/Microsoft Ryan/i.test(v.name) && /^en-GB/i.test(v.lang))
    || null;

an:#2bdcf3; --math-gold:#ffcc58; --math-green:#4fe2a1; --math-orange:#ff873d; --math-purple:#8b6bf1; --math-red:#ff6577;\n  --m-given:var(--math-blue);    /* given / known        : solid square            */\n  --m-unknown:var(--math-gold);  /* unknown / variable   : dashed hollow circle    */\n  --m-op:var(--math-cyan);       /* operation / relation : diamond                 */\n  --m-result:var(--math-green);  /* result / answer      : tick + double underline */\n  --m-error:var(--math-red);     /* error / misconception: cross + hatch           */\n  --m-focus:var(--math-orange);  /* active / focus       : star + glow ring        */\n  --m-support:var(--math-purple);/* support / scaffold   : triangle                */\n  --nova-accent:#2F6FED; --nova-accent-2:#204FA6; --nova-accent-soft:#EAF1FF; --ok:#16866f; --bad:#b42318;\n  --nova-font-ui:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif;\n  --nova-font-display:var(--nova-font-ui);\n  --nova-font-chalk:\"NOVA Chalk\",\"Segoe Print\",\"Comic Sans MS\",cursive;\n  --nova-font-chalk-draw:\"NOVA Chalk\",\"Segoe Print\",cursive; /* labels INSIDE drawings: scratchy, always with the nv-chalk texture filter */\n  --nova-font-chalk-write:\"NOVA Chalk\",\"Segoe Print\",cursive; /* written maths away from drawings: smooth bold + neon glow */\n  --nova-font-maths:var(--nova-font-chalk-write);\n  --nova-font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\n  --r-sm:11px; --r-md:20px; --r-lg:26px; --t-fast:150ms; --t-med:350ms; --ease:cubic-bezier(.34,1.56,.64,1);\n  --stage-accent:var(--math-cyan);\n  /* DARK (template default) */\n  --shell-page:#050914; --shell-page-2:#07111e; --shell-top:#07111d; --shell-surface:#0a1625; --shell-surface-2:#0e1c2d; --shell-surface-3:#111f31;\n  --shell-text:#eef7ff; --shell-ink:#d4e5f4; --shell-muted:#8da5bc; --shell-line:#20384f; --shell-shadow:0 18px 50px rgba(0,0,0,.27);\n  --soft-blue:rgba(54,125,255,.10); --soft-cyan:rgba(43,220,243,.08); --soft-orange:rgba(255,135,61,.09); --soft-purple:rgba(139,107,241,.09); --soft-green:rgba(79,226,161,.07); --soft-gold:rgba(255,204,88,.08);\n  --input:#101f31; --input-border:#2b465e;\n  /* visual canvas (template .nvis) */\n  --v-bg:#06111b; --v-panel:#0b2032; --v-panel2:#0e2b40; --v-line:#244963; --v-ink:#eef8ff; --v-muted:#9cb2c4; --v-grid:rgba(49,220,255,.045);\n}\nhtml[data-theme=\"light\"]{\n  --shell-page:#edf4f9; --shell-page-2:#f8fbfe; --shell-top:#ffffff; --shell-surface:#ffffff; --shell-surface-2:#f8fbff; --shell-surface-3:#f0f6fb;\n  --shell-text:#17385c; --shell-ink:#365670; --shell-muted:#72889d; --shell-line:#d7e4ed; --shell-shadow:0 14px 32px rgba(23,52,86,.09);\n  --soft-cyan:rgba(0,172,200,.08); --soft-green:rgba(24,185,122,.07); --soft-gold:rgba(255,204,88,.12);\n  --input:#ffffff; --input-border:#bed0df;\n  --v-bg:#f4f9fd; --v-panel:#ffffff; --v-panel2:#eef6fb; --v-line:#bfd5e4; --v-ink:#16344e; --v-muted:#607a8e; --v-grid:rgba(74,133,183,.10);\n  --math-blue:#2563eb; --math-cyan:#007fa5; --math-gold:#9a6c00; --math-green:#0b8b63; --math-orange:#c2560c; --math-purple:#6550c7; --math-red:#b13e50;\n}\n*{box-sizing:border-box}\nhtml,body{background:var(--shell-page)}\nbody{margin:0;min-height:100vh;color:var(--shell-text);font-family:var(--nova-font-ui);line-height:1.55;\n  background:radial-gradient(circle at 9% 5%,var(--soft-cyan),transparent 24%),radial-gradient(circle at 92% 6%,var(--soft-purple),transparent 22%),linear-gradient(180deg,var(--shell-page-2) 0,var(--shell-page) 520px);background-attachment:fixed}\nbutton,input,select{font:inherit}\n.nova-wrap{width:min(1120px,calc(100% - 20px));margin:10px auto 60px}\n/* top bar + lesson hero (template pattern) */\n.nova-topbar{display:flex;align-items:center;gap:12px;padding:12px 14px 14px;border:1px solid var(--shell-line);border-radius:var(--r-lg);background:var(--shell-top);box-shadow:var(--shell-shadow);position:relative;overflow:hidden}\n.nova-topbar::after{content:\"\";position:absolute;left:14px;right:14px;bottom:0;height:2px;background:linear-gradient(90deg,var(--math-orange),var(--math-gold),var(--math-green),var(--math-cyan),var(--math-blue),var(--math-purple));opacity:.85}\n.nova-logo{flex:0 0 44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:1000;font-size:.62rem;letter-spacing:.04em;color:#04101d;background:linear-gradient(145deg,#3477ff,var(--math-cyan));box-shadow:0 6px 16px rgba(43,220,243,.25)}\n.nova-topbar b{display:block;font-size:1rem}.nova-topbar small{display:block;color:var(--shell-muted);font-size:.72rem;font-weight:700}\n.nova-topbar .themetog{margin-left:auto}\n.nova-hero{position:relative;margin:14px 0;padding:18px 18px 18px 22px;border:1px solid var(--shell-line);border-radius:var(--r-lg);background:linear-gradient(145deg,var(--shell-surface),var(--shell-surface-2));box-shadow:var(--shell-shadow);overflow:hidden}\n.nova-hero::before{content:\"\";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--stage-accent)}\n.nova-hero .runchip{display:inline-block;padding:4px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--stage-accent) 45%,transparent);background:var(--soft-cyan);color:var(--stage-accent);font-size:.68rem;font-weight:950;letter-spacing:.1em;text-transform:uppercase}\n.nova-hero h1{margin:.3em 0 .2em;font-size:clamp(1.9rem,5vw,3.1rem);line-height:1.04;letter-spacing:-.04em;font-weight:900}\n.nova-hero p{margin:0;color:var(--shell-ink);max-width:62ch}\n.nova-prov{display:inline-flex;margin-top:10px;padding:4px 10px;border-radius:999px;background:var(--soft-gold);color:var(--math-gold);font-size:.72rem;font-weight:850;border:1px solid color-mix(in srgb,var(--math-gold) 35%,transparent)}\n/* cards */\n.nova-card{color:var(--shell-ink);background:linear-gradient(145deg,var(--shell-surface),var(--shell-surface-2));border:1px solid var(--shell-line);border-radius:var(--r-lg);box-shadow:var(--shell-shadow);padding:clamp(14px,3vw,26px
